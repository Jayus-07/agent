; ============================================================================
; 单容器后端进程编排（2026-10-20 后端容器合一）
; ============================================================================
; 容器内全部后端进程由 supervisord 托管：3 个 HTTP 服务（app/rag-service/
; mcp-service）+ 4 个 Celery 队列池 + beat + 2 个客服派单 dispatcher。
; compose 侧服务名 backend（网络别名 app / rag-service / mcp-service 保持
; 旧 DNS 兼容：APISIX 上游 app:8000、RAG_SERVICE_URL、Prometheus 抓取目标
; 均无需改动）。
;
; 生命周期约定：
;   - 容器 PID 1 = supervisord（nodaemon），stop 信号触发逆序停止，
;     compose stop_grace_period=700s 兜底 SIGKILL。
;   - uvicorn 带 --timeout-graceful-shutdown 600：SSE/长 RAG 在途请求
;     优雅收尾；app 优先保长流窗口，rag/mcp 各留 300s。
;   - Celery acks_late + task_reject_on_worker_lost：被杀任务未 ack 消息
;     回队重投，无需 visibility timeout。
;   - autorestart=true + 指数退避：进程崩溃永不放弃（与 restart:
;     unless-stopped 同语义），启动失败由 startretries 限速。
;
; 端口分配（容器内，均不发布宿主机除 compose ports 外）：
;   8000 app | 8090 rag-service | 8091 mcp-service
;   9809-9812 各 Celery 池的 Prometheus 指标端点（同容器必须错开，
;   WORKER_METRICS_PORT 缺省会全挤 9809）。
;
; 运维入口：
;   docker exec agent-backend supervisorctl status          # 进程总览
;   docker exec agent-backend supervisorctl tail -f app     # 单进程日志
;   docker exec agent-backend supervisorctl restart app     # 只重启 app 进程
;
; 注意：本容器必须单副本运行——beat 与 dispatcher 的正确性依赖单实例
; （beat 多副本会重复调度；dispatcher-1/2 靠显式实例名区分心跳）。
; ============================================================================

[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ── HTTP 服务（停止顺序：dispatcher/worker 先停，HTTP 最后）────────
; priority 小者先启动、后停止（supervisor 逆序停止）。rag 先于 app：
; app 启动期会探测 RAG 依赖。

[program:rag-service]
command=python -m uvicorn backend.services.rag_server:app --host 0.0.0.0 --port 8090 --timeout-graceful-shutdown 600
directory=/app
environment=RAG_MODE="local",RAG_SERVICE_URL="http://127.0.0.1:8090"
priority=10
stopwaitsecs=300
stopasgroup=true
killasgroup=true
autorestart=true
startretries=10
startsecs=5
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:app]
command=python -m uvicorn backend.app.server:app --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 600
directory=/app
; RAG 走容器内回环：rag-service 同容器 8090，不再绕网络别名
environment=RAG_MODE="remote",RAG_SERVICE_URL="http://127.0.0.1:8090"
priority=20
stopwaitsecs=610
stopasgroup=true
killasgroup=true
autorestart=true
startretries=10
startsecs=5
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:mcp-service]
command=python -m uvicorn mcp_servers.protocol_app:app --host 0.0.0.0 --port 8091 --timeout-graceful-shutdown 600
directory=/app
environment=RAG_MODE="remote",RAG_SERVICE_URL="http://127.0.0.1:8090"
priority=30
stopwaitsecs=300
stopasgroup=true
killasgroup=true
autorestart=true
startretries=10
startsecs=5
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; ── Celery 队列池（1 pool ≈ 1 workload class，口径不变）────────────
; bash -c + exec 是为了保留 ${VAR:-default} 的运行时可调性（compose 注入
; 的 env 在子 shell 里展开），exec 让 celery 成为直接子进程接收信号。
; 索引执行体 RAG_MODE=local：embedding/索引写共享 app_data 卷（口径同拆分版）。

[program:agent-worker]
command=bash -c 'exec celery -A backend.workers.agent_worker worker --loglevel=info -Q "${CELERY_AGENT_QUEUE:-agent}" --concurrency="${AGENT_WORKER_CONCURRENCY:-4}" -n "agent-worker@backend"'
directory=/app
environment=RAG_MODE="local",RAG_SERVICE_URL="http://127.0.0.1:8090",RAG_DATA_DIR="/app/data",PROMETHEUS_MULTIPROC_DIR="/tmp/prom_multiproc",WORKER_METRICS_PORT="9809"
priority=40
stopwaitsecs=60
stopasgroup=true
killasgroup=true
autorestart=true
startretries=10
startsecs=10
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:rag-index-worker]
command=bash -c 'exec celery -A backend.workers.agent_worker worker --loglevel=info -Q "${CELERY_RAG_INDEX_QUEUE:-rag_index}" --concurrency="${RAG_INDEX_WORKER_CONCURRENCY:-2}" -n "rag-index-worker@backend"'
directory=/app
environment=RAG_MODE="local",RAG_SERVICE_URL="http://127.0.0.1:8090",RAG_DATA_DIR="/app/data",PROMETHEUS_MULTIPROC_DIR="/tmp/prom_multiproc",WORKER_METRICS_PORT="9810"
priority=50
stopwaitsecs=60
stopasgroup=true
killasgroup=true
autorestart=true
startretries=10
startsecs=10
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:maintenance-worker]
command=bash -c 'exec celery -A backend.workers.agent_worker worker --loglevel=info -Q "${CELERY_MAINTENANCE_QUEUE:-maintenance}" --concurrency="${MAINTENANCE_WORKER_CONCURRENCY:-1}" -n "maintenance-worker@backend"'
directory=/app
environment=PROMETHEUS_MULTIPROC_DIR="/tmp/prom_multiproc",WORKER_METRICS_PORT="9811"
priority=60
stopwaitsecs=60
stopasgroup=true
killasgroup=true
autorestart=true
startretries=10
startsecs=10
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:report-worker]
command=bash -c 'exec celery -A backend.workers.agent_worker worker --loglevel=info -Q "${CELERY_REPORT_QUEUE:-report}" --concurrency="${REPORT_WORKER_CONCURRENCY:-1}" -n "report-worker@backend"'
directory=/app
environment=PROMETHEUS_MULTIPROC_DIR="/tmp/prom_multiproc",WORKER_METRICS_PORT="9812"
priority=70
stopwaitsecs=60
stopasgroup=true
killasgroup=true
autorestart=true
startretries=10
startsecs=10
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; ── Celery Beat（必须单实例：多副本会重复调度周期任务）────────────
[program:beat]
command=celery -A backend.tasks.celery_app beat --loglevel=info --pidfile=/tmp/celerybeat.pid --schedule=/tmp/celerybeat-schedule
directory=/app
priority=80
stopwaitsecs=20
stopasgroup=true
killasgroup=true
autorestart=true
startretries=10
startsecs=5
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; ── 客服自动派单 dispatcher（同容器双实例，显式实例名区分心跳）────
; 派单正确性由 FOR UPDATE SKIP LOCKED + 活动 assignment 部分唯一索引保证，
; 双实例互不通信；心跳键按实例名隔离（多副本语义与拆分版一致）。
[program:cs-dispatcher-1]
command=python -m backend.workers.cs_dispatcher
directory=/app
environment=CS_DISPATCHER_INSTANCE_ID="cs-dispatcher-1"
priority=90
stopwaitsecs=20
stopasgroup=true
killasgroup=true
autorestart=true
startretries=10
startsecs=5
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:cs-dispatcher-2]
command=python -m backend.workers.cs_dispatcher
directory=/app
environment=CS_DISPATCHER_INSTANCE_ID="cs-dispatcher-2"
priority=90
stopwaitsecs=20
stopasgroup=true
killasgroup=true
autorestart=true
startretries=10
startsecs=5
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
