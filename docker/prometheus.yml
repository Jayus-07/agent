# prometheus.yml — Prometheus 抓取配置
#
# 挂载：docker compose --profile observability up -d
# 抓取目标：宿主机 Python 后端 /metrics（Prometheus 文本格式，见 backend/app/server.py）
# 告警规则：docker/prometheus-alert-rules.yml（阈值定义见 docs/observability/slo.md）
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# B4（2026-09-21 审查）：告警触达——规则触发后发往 Alertmanager，
# 由其按 docker/alertmanager.yml.tpl 的 receiver 外推 webhook
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/prometheus-alert-rules.yml

scrape_configs:
  - job_name: agent-platform-app
    # Python 后端跑在宿主机 8000；若后端改为容器部署（app 服务启用），改成 app:8000
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: agent-platform-apisix
    # APISIX 独立导出服务（容器网络内 9091，compose 未发布该端口到宿主机）；
    # 自定义指标：gateway_auth_denied_total{route,reason} / gateway_auth_would_deny_total
    metrics_path: /apisix/prometheus/metrics
    static_configs:
      - targets: ["agent-apisix:9091"]

  # ── 基础设施 exporters（2026-09-16 任务中心观测，observability profile）──
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: redis-broker
    # B1 拆实例后的 broker 独立监控（noeviction 内存压力/队列键规模）
    static_configs:
      - targets: ["redis-broker-exporter:9121"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: celery
    # danihodovic/celery-exporter：celery_worker_up / celery_queue_length /
    # celery_task_{sent,succeeded,failed,retried}_total / celery_task_runtime_seconds
    static_configs:
      - targets: ["celery-exporter:9808"]

  - job_name: task-workers
    # Phase2-F（2026-09-23）：worker 运行时指标——task_terminal/retry/
    # recovery/lease_events/fenced_write/execution_duration/queue_wait/
    # authorization_denied/admission（multiprocess 聚合，容器内 9809，
    # 不发布宿主机）。每个 worker 副本一个 target（多副本水平扩展）。
    static_configs:
      - targets:
          - "agent-worker:9809"
          - "rag-index-worker:9809"
          - "maintenance-worker:9809"
          - "report-worker:9809"
