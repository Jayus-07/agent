# prometheus-alert-rules.test.yml — G2 告警规则单元测试（promtool test rules）
#
# 用途：capability-governance G2 的「规则命中」可复现证据——不依赖真实流量，
# 用构造指标序列验证 ToolUnregisteredCallDetected / ToolFailureRateSuddenJump
# 的触发与静默边界。规则或本测试任一改动后复跑：
#   docker run --rm --entrypoint promtool \
#     -v "$PWD/docker:/etc/prom:ro" prom/prometheus:latest \
#     test rules /etc/prom/prometheus-alert-rules.test.yml
rule_files:
  - prometheus-alert-rules.yml

evaluation_interval: 1m

tests:
  # ── ToolUnregisteredCallDetected：未注册调用出现即告警，全程为 0 则静默 ──
  - interval: 1m
    input_series:
      - series: 'agent_tool_unregistered_total{tool="ghost.cap",domain="ghost"}'
        values: "0+0x5 1+0x10"
    alert_rule_test:
      # 前 5 分钟零未注册调用 → 不触发
      - eval_time: 4m
        alertname: ToolUnregisteredCallDetected
        exp_alerts: []
      # t=5m 计数 0→1，t=6m 的 10m 窗口 increase=1 > 0 → 触发
      - eval_time: 6m
        alertname: ToolUnregisteredCallDetected
        exp_alerts:
          - exp_labels:
              severity: warning
              tool: ghost.cap
              domain: ghost
            exp_annotations:
              summary: "出现未注册 Tool 调用（治理对账漂移信号）"
              description: "未注册 = 策略注册表与 MCP 动态快照均无该 tool_key，运行时按 DEFAULT_POLICY 兜底继续执行（不拒绝）。按 tool/domain 标签定位调用来源：新工具漏登记走登记流程补策略；路由漂移核对 capabilities.yaml 与 Skill 注册表（管理端 /skills 对账列）；探针/测试流量（probe./test. 前缀）不计入本指标"

  # ── ToolFailureRateSuddenJump：环比突增触发；平稳基线不触发 ──
  # 场景：calls 恒 0.1/s；failures 前 40m 0.01/s（失败率 10%），
  # t=40m 起跳到 0.3/s（失败率 75%）→ 当前 10m 失败率 = 7.5× 基线。
  - interval: 1m
    input_series:
      - series: 'agent_tool_calls_total{tool="x.y",domain="data",status="success"}'
        values: "0+6x80"
      - series: 'agent_tool_calls_total{tool="x.y",domain="data",status="failed"}'
        values: "0+0.6x80"
      - series: 'agent_tool_failure_total{tool="x.y",domain="data"}'
        values: "0+0.6x40 0.6+18x40"
    alert_rule_test:
      # 平稳段（失败率恒 10%）：环比无突增 → 不触发
      - eval_time: 30m
        alertname: ToolFailureRateSuddenJump
        exp_alerts: []
      # 突增后：当前 10m 失败率 75% > 2×基线(≈10%) 且 >2%、流量达标 → 触发
      - eval_time: 55m
        alertname: ToolFailureRateSuddenJump
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Tool 失败率环比突增（>2× 上一小时基线且当前 >2%）"
              description: "与 ToolFailureSpike（绝对阈值 10%）互补，抓高位前的早期劣化。按 tool/domain 标签对比突增前后窗口的失败构成（管理端 /admin/tools/stats top_failed_tools + top_error_classes），先看 error_class 是否集中（传输类=依赖故障，执行类=代码/配置变更）；灰度/发布窗口内出现优先回滚最近变更"
