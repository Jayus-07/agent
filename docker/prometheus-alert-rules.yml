# prometheus-alert-rules.yml — Prometheus 告警规则（P1-8）
#
# 用法：
#   1. Prometheus scrape 配置（prometheus.yml）中抓取应用 /metrics 端点
#   2. rule_files 引入本文件
#   3. alertmanager.yml 中配置接收端（webhook / 企微 / 邮件）
#
# 告警级别约定：
#   critical — 服务不可用，需要立即处理（page）
#   warning  — 降级运行，工作时间处理（ticket）
groups:
  # ── Recording rules：QPS / P99 分位数预计算（Grafana 面板与告警复用）──
  - name: agent-platform-recording
    interval: 30s
    rules:
      - record: chat:qps:rate5m
        expr: sum(rate(chat_request_total[5m]))
      - record: chat:latency_p99_seconds
        expr: histogram_quantile(0.99, sum(rate(chat_request_duration_seconds_bucket[10m])) by (le))
      - record: chat:ttft_p99_seconds
        expr: histogram_quantile(0.99, sum(rate(chat_ttft_seconds_bucket[10m])) by (le))
      - record: chat:tpot_p99_seconds
        expr: histogram_quantile(0.99, sum(rate(chat_tpot_seconds_bucket[10m])) by (le))

  # ── 元数据级联灰度止损信号（2026-09-20）────────────────────
  # 这些规则只负责发现风险，不自动修改开关；发布编排收到告警后应将
  # METADATA_CASCADE_ENABLED=false、METADATA_CASCADE_ROLLOUT_PERCENT=0。
  - name: agent-platform-metadata-canary
    interval: 30s
    rules:
      - record: metadata:shadow_failure_rate:ratio5m
        expr: |
          sum(rate(metadata_shadow_job_total{result="failed"}[5m]))
            / clamp_min(sum(rate(metadata_shadow_job_total[5m])), 0.001)

      - record: metadata:legacy_fallback_rate:ratio5m
        expr: |
          sum(rate(metadata_route_total{level="legacy_rule",outcome="fallback"}[5m]))
            / clamp_min(
                sum(rate(metadata_route_total{
                  level=~"R0|R1|R2|L3|legacy_rule|L0|L1|L2",
                  outcome=~"hit|fallback"
                }[5m])),
                0.001
              )

      - alert: MetadataCascadeFallbackRateHigh
        expr: metadata:legacy_fallback_rate:ratio5m > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "元数据规则 fallback 比例超过 5%"
          description: "级联灰度命中后仍频繁回退规则链；检查统一抽取失败、Schema 越界和上游 LLM 状态，必要时立即回退灰度"

      - alert: MetadataShadowFailureRateHigh
        expr: metadata:shadow_failure_rate:ratio5m > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "元数据影子任务失败率超过 1%"
          description: "影子任务失败会失去一致率证据，但不得阻塞主索引；检查 Redis、PostgreSQL、缓存命中和独立 worker"

      - alert: MetadataShadowBackpressure
        expr: |
          sum(increase(metadata_shadow_dispatch_total{
            result=~"backpressure|skipped|failed"
          }[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "元数据影子派发出现持续背压或失败"
          description: "影子队列已触发有界丢弃/失败策略；先扩 shadow worker 或降低采样，不得让影子抢占主索引资源"

      - alert: MetadataShadowQueueAgeHigh
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(metadata_shadow_queue_age_seconds_bucket[10m])) by (le)
          ) > 60
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "元数据影子队列 P95 年龄超过 60 秒"
          description: "影子证据开始滞后；检查 rag_metadata_shadow 消费能力和队列长度，不要因此阻塞主路径"

      - alert: MetadataResourceWaitTimeout
        expr: increase(metadata_resource_wait_timeout_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "元数据资源槽位出现等待超时"
          description: "Embedding/LLM/DB/影子资源发生有界等待超时；按 resource 标签判断是否需要扩容或降采样"

      - alert: MetadataRouteError
        expr: |
          sum(increase(metadata_route_total{
            outcome="error"
          }[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "元数据路由出现错误"
          description: "检查对应 level 的路由、Embedding、分类器模型卡和统一抽取日志；错误不得静默计入命中"

      - alert: MetadataClassifierMismatch
        expr: increase(metadata_classifier_mismatch_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "元数据分类器版本或指纹失配"
          description: "R1 不得继续接管流量；保持分类器关闭并核对 taxonomy/rules/model/feature 指纹"

  - name: agent-platform-sli
    rules:
      # ── 可用性 ──────────────────────────────
      - alert: ChatErrorRateHigh
        expr: |
          sum(rate(chat_request_total{status="error"}[5m]))
            / clamp_min(sum(rate(chat_request_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Chat API 错误率超过 5%"
          description: "近 5 分钟错误率 {{ $value | humanizePercentage }}，检查后端日志与 LLM 状态"

      - alert: ChatLatencyP95High
        expr: |
          histogram_quantile(0.95, sum(rate(chat_request_duration_seconds_bucket[10m])) by (le)) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Chat P95 延迟超过 30s"
          description: "检查 RAG 检索耗时与 LLM 响应时间"

      # ── P99 延迟（SLO 目标见 docs/observability/slo.md）──────────
      - alert: ChatLatencyP99High
        expr: chat:latency_p99_seconds > 60
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Chat P99 E2E 延迟超过 60s（SLO: < 60s）"
          description: "P99={{ $value | humanizeDuration }}，检查慢请求 trace 定位瓶颈阶段"

      - alert: ChatTTFTP99High
        expr: chat:ttft_p99_seconds > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Chat P99 TTFT 超过 3s（SLO: < 3s）"
          description: "TTFT 反映 prefill + 首包链路：检查 Router 是否频繁落到 LLM 层、LLM 上游排队、以及并发排队（request_concurrency_wait_seconds）"

      - alert: ChatTPOTP99High
        expr: chat:tpot_p99_seconds > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Chat P99 TPOT 超过 200ms（SLO: < 200ms）"
          description: "TPOT 反映 LLM decode 速度：检查 LLM 上游限流/降速、输出长度分布、以及网络吞吐"

      # ── 并发饱和（优先级排队中间件）──────────────
      - alert: ConcurrencyQueueSustained
        expr: min_over_time(request_concurrency_queued[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "并发槽位持续满载，请求开始排队"
          description: "近 10 分钟一直有请求在等待队列中；高优先级对话会挤占 normal 批量任务，评估是否扩容 MAX_CONCURRENT_REQUESTS"

      # ── LLM 韧性链（P1-7/P1-8 新增）────────────
      - alert: LLMCircuitBreakerOpen
        expr: circuit_breaker_state{name="deepseek"} == 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "LLM 熔断器处于开路状态"
          description: "上游 LLM 持续故障，服务已进入 fallback/降级话术模式，检查 provider 可用性与 API 余额"

      - alert: LLMDegradedAnswerSpike
        expr: increase(degradation_alerts_total{code="LLM_DEGRADED_ANSWER"}[10m]) > 3
        labels:
          severity: critical
        annotations:
          summary: "LLM 降级拒答 10 分钟内超过 3 次"
          description: "主模型与备用模型均不可用，用户收到的是固定拒答话术"

      # ── 降级链 / 技能失败 ─────────────────────
      - alert: WorkerRetryExhausted
        expr: increase(degradation_alerts_total{code="WORKER_RETRY_EXHAUST"}[15m]) > 5
        labels:
          severity: warning
        annotations:
          summary: "Worker 重试耗尽 15 分钟内超过 5 次"
          description: "检查对应 skill 的下游依赖（数据库 / 外部 API）"

      - alert: SkillFailureSpike
        expr: increase(skill_failure_total[15m]) > 10
        labels:
          severity: warning
        annotations:
          summary: "技能失败 15 分钟内超过 10 次"
          description: "按 skill 标签定位：{{ $labels.skill }} / {{ $labels.error_type }}"

      # ── RAG 质量 ────────────────────────────
      - alert: RagRejectRateHigh
        expr: rag_reject_rate > 0.3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "RAG 拒答率超过 30%"
          description: "Evidence Gate 大量拦截，检查知识库覆盖度"

      - alert: RagHitRateLow
        expr: 0 < rag_hit_rate < 0.7
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "RAG 命中率低于 70%"
          description: "检查向量库健康度与检索参数"

      # ── APISIX 网关（2026-09-16 接入 Prometheus）──────────────
      - alert: GatewayDown
        expr: up{job="agent-platform-apisix"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "APISIX 网关指标端点失联"
          description: "Prometheus 连续 1 分钟抓不到 agent-apisix:9091；检查容器状态（docker ps | grep apisix）与导出服务日志"

      - alert: GatewayAuthDeniedSpike
        expr: increase(apisix_gateway_auth_denied_total[10m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "网关认证拒绝量突增（10 分钟 >100 次）"
          description: "按 {{ $labels.reason }} 排查：signature/expired 批量出现可能是密钥轮换未同步；blacklist 突增可能是登出风暴或撞库"

      - alert: GatewayRateLimitedSpike
        expr: sum(increase(apisix_http_status{code="429"}[10m])) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "网关限流触发量突增（10 分钟 >50 次 429）"
          description: "按 route 标签定位：正常用户被误伤则放宽对应路由配额（apisix/apisix.yaml），异常流量则保持并关注来源"

      - alert: GatewayUpstream5xxHigh
        expr: sum(rate(apisix_http_status{code=~"5.."}[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "网关侧上游 5xx 超过 1 rps 持续 5 分钟"
          description: "上游 app/Java 服务异常；结合 backend/app 指标与日志定位（网关 retries=0，5xx 即上游真实失败）"

      # ── 任务体系（2026-09-16 接入 redis/postgres/celery exporters）──────
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis exporter 失联"
          description: "缓存/限流/取消标志/事件通道/SSE 全依赖 Redis；连续 1 分钟抓不到 redis-exporter:9121 即判不可用"

      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL exporter 失联"
          description: "记忆库/任务状态权威/checkpoint 全在 PG；连续 1 分钟抓不到 postgres-exporter:9187 即判不可用"

      # ── B4（2026-09-21 审查）：PG 连接饱和——up==0 只能发现宕机，
      # 池打满（连接耗尽）时 up 仍为 1，必须用连接数口径单独告警
      - alert: PostgresConnectionsSaturated
        expr: |
          sum(pg_stat_activity_count) / clamp_min(pg_settings_max_connections, 1) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PG 连接使用率超过 80%（持续 5 分钟）"
          description: "async 池 + pgvector 池 + Celery 子进程池 + 裸连接总和逼近 max_connections；按 client/应用侧排查连接泄漏，或评估 max_connections 与 pgbouncer（勿盲目调大）"

      # ── B1（2026-09-21 审查）：Redis 内存压力与逐出监控 ──
      # 缓存实例 allkeys-lru：内存压力 = 逐出开始 = 缓存命中率下降 +
      # 混入 db0 的非缓存键（会话/黑名单）有被逐出风险，必须可见
      - alert: RedisMemoryPressureHigh
        expr: |
          redis_memory_used_bytes{job=~"redis"} / clamp_min(redis_memory_max_bytes{job=~"redis"}, 1) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis 实例 {{ $labels.job }} 内存使用超过 maxmemory 90%"
          description: "缓存实例接近 allkeys-lru 逐出线；broker 实例（noeviction）接近后写入将报错。评估扩 maxmemory、清理大键或拆分业务"

      - alert: RedisEvictedKeysSpike
        expr: increase(redis_evicted_keys_total{job=~"redis"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Redis 实例 {{ $labels.job }} 发生键逐出（15 分钟）"
          description: "allkeys-lru 已开始逐出：缓存键逐出可接受，但须确认无安全键（JWT 吊销黑名单/会话）混入缓存实例；broker 实例 noeviction 不应有此指标，出现即配置漂移"

      - alert: CeleryWorkerDown
        expr: min(celery_worker_up) == 0 or absent(celery_worker_up) == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Celery Worker 全部离线或无 worker 心跳"
          description: "celery_worker_up 无样本（absent）= 没有 worker 在跑；== 0 = 心跳超时。任务会积压无人消费，检查 compose worker 服务与健康检查"

      - alert: CeleryQueueBacklog
        expr: celery_queue_length > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Celery 队列积压（{{ $labels.queue }} > 20 持续 5 分钟）"
          description: "入队速率超过消费能力：检查 worker 在线数/并发（celery_worker_up、/observability/system-health），必要时横向扩 worker 副本"

      - alert: CeleryTaskFailureRateHigh
        expr: sum(rate(celery_task_failed_total[10m])) / clamp_min(sum(rate(celery_task_failed_total[10m])) + sum(rate(celery_task_succeeded_total[10m])), 0.001) > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "任务失败率超过 30%（10 分钟窗口）"
          description: "按 name/queue 标签定位失败任务类型；管理端任务中心看 traceback（/api/admin/tasks/{id}），常见为 LLM 凭据失效或超时"

      # ── 安全 / 幂等 / 预算闭环（WP6）──────────────────────────────
      - alert: IdempotencyUnavailable
        expr: increase(idempotency_claim_total{result="unavailable"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "幂等权威存储不可用，写副作用应保持拒绝"
          description: "检查 Redis/PG 连通性；在恢复前不得绕过幂等门禁执行写操作"

      - alert: IdempotencyConflictSpike
        expr: increase(idempotency_claim_total{result="conflict"}[10m]) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "幂等冲突量异常升高"
          description: "检查客户端重试、幂等键复用和请求体漂移；不要通过放宽指纹校验消除告警"

      - alert: BudgetExceededSpike
        expr: increase(budget_request_total{result="rejected"}[10m]) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "请求预算拒绝量异常升高"
          description: "按 mode 区分请求级限制与日/月额度；核查是否为真实超限，禁止静默降级模型或写副作用"

      - alert: BudgetThresholdReached
        expr: increase(budget_threshold_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "用户或租户预算达到 80%/100% 阈值"
          description: "从 budget_threshold_total 的 scope_type/period_type/threshold 维度查询主体范围；不要在告警文本中写入主体 ID"

      - alert: BudgetHardLimitBlocked
        expr: increase(budget_quota_total{result="rejected"}[10m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "硬预算已阻断新的预算约束操作"
          description: "只读查询应继续可用；检查价格、日/月 ledger 与策略继承，不得把硬阻断改成无限或静默 fallback"

      - alert: ModelPriceMissing
        expr: increase(budget_price_total{result=~"missing|unavailable"}[10m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "模型价格表缺失或不可用"
          description: "enforce 模式下应拒绝受硬预算约束的模型调用；observe/off 模式仅统计 token 并告警，先导入并完成双人审核"

      - alert: SideEffectBudgetRejected
        expr: increase(side_effect_budget_total{result="rejected"}[10m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "写副作用被预算门禁拒绝"
          description: "确认幂等和审批状态未被绕过；只允许在预算周期或策略合法调整后重试"

      - alert: SemanticValidationFailureSpike
        expr: increase(semantic_validation_total{result="rejected"}[10m]) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tool/Skill 语义校验失败量异常升高"
          description: "按 layer 定位结构或语义契约回归；不得把校验失败当作 Tool 成功结果继续交给 Reporter"

      - alert: FeedbackCandidateReviewFailure
        expr: increase(feedback_candidate_total{result="rejected"}[1h]) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "反馈评测候选审核或 promotion 拒绝量升高"
          description: "检查审核状态机和 golden set 导出；pending/rejected 候选不得进入生产评测集"

  # ── 客服高并发派单与事件可靠性（P8，2026-09-21）──────────────
  # 口径与 backend/observability/metrics.py 的 cs_dispatch_* / cs_outbox_* 对齐；
  # dispatcher 心跳由 cs-dispatcher 每 tick 写 Redis（TTL 30s），进程消失即
  # up == 0（cs-dispatcher 的 healthcheck 由 compose 直接重启，无需告警联动）。
  - name: agent-platform-cs-dispatch
    interval: 30s
    rules:
      - alert: CsOutboxLagHigh
        expr: cs_outbox_lag_seconds > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "客服 outbox 最旧 pending 事件 lag 超过 5 秒"
          description: "方案 P8 完成标准为 P99 < 2s；先查 cs-dispatcher relay 是否存活，再看 Redis publish 回执失败率"

      - alert: CsOutboxBacklogGrowing
        expr: cs_outbox_pending > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "客服 outbox 积压事件超过 100 条且持续"
          description: "relay 长时间未清空 pending；检查 AgentHub.publish_envelope 失败与 Redis 连通性，事件不会丢但用户通知延迟"

      - alert: CsDispatchQueueDepthHigh
        expr: cs_dispatch_queue_depth > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "客服排队工单持续超过 50"
          description: "检查在线坐席数与容量（cs_dispatch_online_agents × max_conversations），必要时引导用户走 AI 或扩坐席"

      - alert: CsNoOnlineAgents
        expr: cs_dispatch_online_agents == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "客服在线坐席数为 0"
          description: "派单 fail-closed 不产生新绑定；确认坐席是否全部离线（WS 心跳）或 presence Redis 故障"

      - alert: CsPresenceUnavailableSpike
        expr: increase(cs_dispatch_offered_total{result="presence_unavailable"}[5m]) > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "派单因 Redis presence 不可用持续 fail-closed"
          description: "5 分钟内超过 5 次 presence_unavailable；检查 Redis 与 customer_service.realtime 的同步客户端"

      - alert: CsReaperClosedSpike
        expr: increase(cs_dispatch_reaped_total{action=~"closed_.*"}[10m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "10 分钟内超过 10 张工单被 reaper 终态关闭"
          description: "closed_max_attempts/closed_total_deadline 说明坐席侧长期无人接单或派单目标不可达，属于服务体验事件而非技术故障时需人工复盘"
  # ── Context Budget 生产防线（2026-09-23 生产收口 STOP E3）──────────
  # 指标由 context_budget 产生：overflow / L5 结果 / 压缩延迟 / 计数器策略。
  # 定位：overflow=预算防线被击穿（P0 信号）；L5 失败=深防线不可用（降级运行，
  # 聊天不中断但摘要水位停摆，需人工关注水位推进）；锁冲突/水位线丢弃=
  # 并发竞争正常现象，突增才告警。
  - name: agent-platform-context-budget
    interval: 30s
    rules:
      - alert: ContextBudgetOverflow
        expr: increase(context_budget_overflow_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Context Budget 裁剪后仍溢出（防线被击穿）"
          description: "10 分钟内出现 preflight 后仍超 hard budget——L1-L5 全部执行后仍超限。检查 LLM_CONTEXT_LENGTH/模型窗口配置是否与真实流量匹配，以及是否存在超大单条注入"

      - alert: ContextL5FailureRateHigh
        expr: |
          sum(rate(context_l5_total{status="failed"}[15m]))
            / clamp_min(sum(rate(context_l5_total[15m])), 0.001) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "L5 增量摘要失败率超过 50%"
          description: "reason=db_error 多为水位线/迁移问题（确认 chat_sessions.summary_version 已落地）；reason=timeout 检查摘要模型 CONTEXT_L5_SUMMARY_MODEL 健康；lock_conflict/stale_waterline 属并发正常现象，不在此列"

      - alert: ContextL5StaleWaterlineSpike
        expr: increase(context_l5_total{reason="stale_waterline"}[15m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "15 分钟内 CAS 丢弃旧摘要超过 10 次"
          description: "说明同会话并发摘要竞争异常激烈（正常应偶发）——检查是否有同一 session 的高并发写入源或 Redis 锁失效"

      - alert: ContextL5LockConflictSpike
        expr: increase(context_l5_total{reason="lock_conflict"}[15m]) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "15 分钟内 L5 单飞锁冲突超过 30 次"
          description: "偶发为正常单飞语义；持续突增说明热点会话高并发或锁 TTL 过短被频繁重试"

      - alert: ContextCompactionLatencyHigh
        expr: |
          histogram_quantile(0.95, sum(rate(context_compaction_latency_seconds_bucket[10m])) by (le, level)) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "压缩层 P95 延迟超过 30s"
          description: "level=L5 时检查摘要模型（qwen3.8-flash）健康与 CONTEXT_L5_SUMMARY_TIMEOUT_SECONDS；L4 为零 LLM 不应超 1s，超了说明事件循环被阻塞"

      - alert: ContextTokenCounterFallback
        expr: increase(context_token_counter_total{strategy="fallback"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Token 计数退化为 2 字符/token 粗估"
          description: "fallback 策略说明模型名解析失败——检查 llm_models 注册表刷新与 get_request_model_name 链路；粗估会导致预算失真"
