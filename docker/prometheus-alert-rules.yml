# prometheus-alert-rules.yml — Prometheus 告警规则（P1-8）
#
# 用法：
#   1. Prometheus scrape 配置（prometheus.yml）中抓取应用 /metrics 端点
#   2. rule_files 引入本文件
#   3. alertmanager.yml 中配置接收端（webhook / 企微 / 邮件）
#
# 告警级别约定：
#   critical — 服务不可用，需要立即处理（page）
#   warning  — 降级运行，工作时间处理（ticket）
groups:
  # ── Recording rules：QPS / P99 分位数预计算（Grafana 面板与告警复用）──
  - name: agent-platform-recording
    interval: 30s
    rules:
      - record: chat:qps:rate5m
        expr: sum(rate(chat_request_total[5m]))
      - record: chat:latency_p99_seconds
        expr: histogram_quantile(0.99, sum(rate(chat_request_duration_seconds_bucket[10m])) by (le))
      - record: chat:ttft_p99_seconds
        expr: histogram_quantile(0.99, sum(rate(chat_ttft_seconds_bucket[10m])) by (le))
      - record: chat:tpot_p99_seconds
        expr: histogram_quantile(0.99, sum(rate(chat_tpot_seconds_bucket[10m])) by (le))

  - name: agent-platform-sli
    rules:
      # ── 可用性 ──────────────────────────────
      - alert: ChatErrorRateHigh
        expr: |
          sum(rate(chat_request_total{status="error"}[5m]))
            / clamp_min(sum(rate(chat_request_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Chat API 错误率超过 5%"
          description: "近 5 分钟错误率 {{ $value | humanizePercentage }}，检查后端日志与 LLM 状态"

      - alert: ChatLatencyP95High
        expr: |
          histogram_quantile(0.95, sum(rate(chat_request_duration_seconds_bucket[10m])) by (le)) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Chat P95 延迟超过 30s"
          description: "检查 RAG 检索耗时与 LLM 响应时间"

      # ── P99 延迟（SLO 目标见 docs/observability/slo.md）──────────
      - alert: ChatLatencyP99High
        expr: chat:latency_p99_seconds > 60
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Chat P99 E2E 延迟超过 60s（SLO: < 60s）"
          description: "P99={{ $value | humanizeDuration }}，检查慢请求 trace 定位瓶颈阶段"

      - alert: ChatTTFTP99High
        expr: chat:ttft_p99_seconds > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Chat P99 TTFT 超过 3s（SLO: < 3s）"
          description: "TTFT 反映 prefill + 首包链路：检查 Router 是否频繁落到 LLM 层、LLM 上游排队、以及并发排队（request_concurrency_wait_seconds）"

      - alert: ChatTPOTP99High
        expr: chat:tpot_p99_seconds > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Chat P99 TPOT 超过 200ms（SLO: < 200ms）"
          description: "TPOT 反映 LLM decode 速度：检查 LLM 上游限流/降速、输出长度分布、以及网络吞吐"

      # ── 并发饱和（优先级排队中间件）──────────────
      - alert: ConcurrencyQueueSustained
        expr: min_over_time(request_concurrency_queued[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "并发槽位持续满载，请求开始排队"
          description: "近 10 分钟一直有请求在等待队列中；高优先级对话会挤占 normal 批量任务，评估是否扩容 MAX_CONCURRENT_REQUESTS"

      # ── LLM 韧性链（P1-7/P1-8 新增）────────────
      - alert: LLMCircuitBreakerOpen
        expr: circuit_breaker_state{name="deepseek"} == 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "LLM 熔断器处于开路状态"
          description: "上游 LLM 持续故障，服务已进入 fallback/降级话术模式，检查 provider 可用性与 API 余额"

      - alert: LLMDegradedAnswerSpike
        expr: increase(degradation_alerts_total{code="LLM_DEGRADED_ANSWER"}[10m]) > 3
        labels:
          severity: critical
        annotations:
          summary: "LLM 降级拒答 10 分钟内超过 3 次"
          description: "主模型与备用模型均不可用，用户收到的是固定拒答话术"

      # ── 降级链 / 技能失败 ─────────────────────
      - alert: WorkerRetryExhausted
        expr: increase(degradation_alerts_total{code="WORKER_RETRY_EXHAUST"}[15m]) > 5
        labels:
          severity: warning
        annotations:
          summary: "Worker 重试耗尽 15 分钟内超过 5 次"
          description: "检查对应 skill 的下游依赖（数据库 / 外部 API）"

      - alert: SkillFailureSpike
        expr: increase(skill_failure_total[15m]) > 10
        labels:
          severity: warning
        annotations:
          summary: "技能失败 15 分钟内超过 10 次"
          description: "按 skill 标签定位：{{ $labels.skill }} / {{ $labels.error_type }}"

      # ── RAG 质量 ────────────────────────────
      - alert: RagRejectRateHigh
        expr: rag_reject_rate > 0.3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "RAG 拒答率超过 30%"
          description: "Evidence Gate 大量拦截，检查知识库覆盖度"

      - alert: RagHitRateLow
        expr: 0 < rag_hit_rate < 0.7
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "RAG 命中率低于 70%"
          description: "检查向量库健康度与检索参数"

      # ── APISIX 网关（2026-09-16 接入 Prometheus）──────────────
      - alert: GatewayDown
        expr: up{job="agent-platform-apisix"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "APISIX 网关指标端点失联"
          description: "Prometheus 连续 1 分钟抓不到 agent-apisix:9091；检查容器状态（docker ps | grep apisix）与导出服务日志"

      - alert: GatewayAuthDeniedSpike
        expr: increase(apisix_gateway_auth_denied_total[10m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "网关认证拒绝量突增（10 分钟 >100 次）"
          description: "按 {{ $labels.reason }} 排查：signature/expired 批量出现可能是密钥轮换未同步；blacklist 突增可能是登出风暴或撞库"

      - alert: GatewayRateLimitedSpike
        expr: sum(increase(apisix_http_status{code="429"}[10m])) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "网关限流触发量突增（10 分钟 >50 次 429）"
          description: "按 route 标签定位：正常用户被误伤则放宽对应路由配额（apisix/apisix.yaml），异常流量则保持并关注来源"

      - alert: GatewayUpstream5xxHigh
        expr: sum(rate(apisix_http_status{code=~"5.."}[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "网关侧上游 5xx 超过 1 rps 持续 5 分钟"
          description: "上游 app/Java 服务异常；结合 backend/app 指标与日志定位（网关 retries=0，5xx 即上游真实失败）"
