# =============================================================================
# api-gateway 外部配置（挂载进容器 /app/config/application.yml）
#
# 工作流（免重建）：
#   1. 改本文件（路由 / 白名单 / 环境变量默认值）
#   2. docker compose restart api-gateway
#   完毕 —— 不需要 docker compose build。
#
# 优先级说明：Spring Boot 会用本文件覆盖镜像内 application.yml 的同名配置
# （列表型配置如 routes / exclude-paths 是整段替换，不是合并），
# 因此改路由、改白名单请只改这里，镜像内的那份仅作容器裸跑兜底。
#
# 本文件由 2026-09-15 的镜像内 application.yml 复制而来，内容保持同步。
# =============================================================================
server:
  port: 8080

spring:
  application:
    name: api-gateway
  # 网关唯一的 Redis 用途是查鉴权黑名单，故全局 Redis 直指 oa-auth-redis
  # （独立实例、noeviction，ARCH-03），不用 Spring Boot 默认的 localhost:6379。
  # 连接异常不影响健康检查（management.health.redis.enabled=false），
  # 鉴权侧由过滤器 fail-closed + 401 兜底。
  data:
    redis:
      host: ${AUTH_REDIS_HOST:127.0.0.1}
      port: ${AUTH_REDIS_PORT:16379}
      password: ${AUTH_REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
  cloud:
    gateway:
      # 去重 CORS 头：下游服务直连调试场景也会返回 CORS 头，浏览器禁止重复 ACAO
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_UNIQUE
      # 全局 CORS：前端跨域统一在网关处理，下游服务不再重复配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        # ── 认证中心（旧系统 auth-service 复用；必须置于列表最前）──
        # /api/auth/login → /auth/login（后端 context-path 不变，旧接口契约零改动）
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://host.docker.internal:8006}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        # ── 用户中心（旧系统 system-service，注册/用户管理）──
        # /api/sys/users/register → /system/users/register（context-path /system，端口 8001）
        - id: system-service
          uri: ${SYS_SERVICE_URL:http://host.docker.internal:8001}
          predicates:
            - Path=/api/sys/**
          filters:
            - RewritePath=/api/sys/(?<segment>.*), /system/$\{segment}
        # ── 业务系统（Java）：客服管理面 ──
        - id: business-service
          uri: ${BUSINESS_SERVICE_URL:http://business-service:8081}
          predicates:
            - Path=/api/cs/conversations/**,/api/channels/**
          filters:
            - StripPrefix=1
        # ── AI 系统（Python）：chat/rag/observability/... 其余全部 ──
        - id: ai-service
          uri: ${AI_SERVICE_URL:http://host.docker.internal:8000}
          predicates:
            - Path=/api/**
          filters:
            - StripPrefix=1

# 网关身份注入：开启后所有请求带 X-User-Id（无真实登录体系时用默认用户）
# 对接 Python 侧 TRUST_USER_HEADER=true + USER_ID_HEADER=X-User-Id
gateway:
  user-header-enabled: ${GATEWAY_USER_HEADER_ENABLED:false}
  user-header-name: X-User-Id
  default-user-id: ${GATEWAY_DEFAULT_USER_ID:demo-user}

  # 网关统一鉴权（P2）。enabled 与 user-header-enabled 互斥，同时开启拒绝启动。
  auth:
    enabled: ${GATEWAY_AUTH_ENABLED:false}
    # 灰度阶梯：open(现状) → shadow(只记指标) → guest(游客可过) → enforce(一律 401)
    # 上线顺序按 02 文档 §10；每条路由可用 route-policies 单独覆盖
    default-policy: ${GATEWAY_AUTH_MODE:shadow}
    exclude-paths:
      - /api/auth/login          # 登录本身不能要求令牌
      - /api/auth/refresh        # 凭 HttpOnly Cookie，无 Bearer
      - /api/sys/users/register  # 注册：创建账号前不可能有令牌（system-service 免认证）
      - /api/channels/whatsapp/webhook   # Meta 签名验签，无 JWT
    # route-policies:            # 示例（未列出的走 default-policy）
    #   /api/cs/**: guest
    jwt:
      secret: ${JWT_SECRET:}
      # 必须与 auth-service 的 jwt.issuer 同值；错配会导致全部令牌 401
      # （02 文档曾误写 hongmeng-oa 之外的默认值，P2-D1 已双端对齐为 hongmeng-oa）
      issuer: ${JWT_ISSUER:hongmeng-oa}
      # 值含冒号必须加引号（裸写 `auth:blacklist:` 会被 SnakeYAML 判为非法映射）
      blacklist-prefix: "auth:blacklist:"
      clock-skew-seconds: 60
      previous-secret: ${JWT_SECRET_PREVIOUS:}   # 密钥轮换窗口，留空即单密钥

management:
  endpoints:
    web:
      exposure:
        # 环境变量控制：GATEWAY_ACTUATOR_INCLUDE=health,info,metrics,gateway
        # 打开 gateway 端点后可运行时增改路由（零重启）：
        #   POST /actuator/gateway/routes/{id}   Content-Type: application/json
        #   {"predicates":[{"name":"Path","args":{"pattern":"/api/foo/**"}}],
        #    "filters":[],"uri":"http://127.0.0.1:9000"}
        #   POST /actuator/gateway/refresh  （老版本不生效时手动刷新）
        # 安全提示：actuator 无鉴权，仅限纯本机开发；对外/生产环境保持默认
        #（health,info,metrics），或用防火墙只放行 127.0.0.1。
        include: ${GATEWAY_ACTUATOR_INCLUDE:health,info,metrics}
  endpoint:
    gateway:
      enabled: ${GATEWAY_HOT_ROUTES:false}
  health:
    # 认证 Redis 可用性由鉴权过滤器 fail-closed 兜底（401），不应把网关整体标 DOWN
    redis:
      enabled: false

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.agent.gateway: INFO
