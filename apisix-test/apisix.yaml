# B2 测试路由：echo 桩（验证身份头注入/剥离）+ 真实 chat（验证下游 401 判别）+ auth 白名单
upstreams:
  - id: echo
    type: roundrobin
    nodes:
      "host.docker.internal:8099": 1
  - id: app
    type: roundrobin
    nodes:
      "host.docker.internal:8000": 1
  - id: auth
    type: roundrobin
    nodes:
      "host.docker.internal:8006": 1

routes:
  - id: echo
    uri: /echo
    upstream_id: echo
    plugins:
      gateway-auth: {}
      prometheus: {}

  # 限流专项测试路由：配额刻意取小让断言快（count=5/min，并发 2+burst 1）；
  # 键语义与生产一致（http_x_user_id，空回退 IP）。/echo 保持不限流，
  # 认证矩阵大量复用它，二者不能混。
  - id: limited
    uri: /limited
    upstream_id: echo
    plugins:
      gateway-auth: {}
      prometheus: {}
      limit-conn:
        key: http_x_user_id
        conn: 2
        burst: 1
        default_conn_delay: 0.1
        rejected_code: 429
      limit-count:
        key: http_x_user_id
        count: 5
        time_window: 60
        rejected_code: 429

  - id: chat
    uri: /api/chat/*
    upstream_id: app
    plugins:
      gateway-auth: {}
      prometheus: {}
      proxy-rewrite:
        regex_uri: ["^/api/(.*)$", "/$1"]

  # 角色闸专项路由：/api/approvals 前缀在 gateway-auth 里配了 write=admin 的闸，
  # 上游指向 echo 桩——矩阵用它验证 403 role-insufficient / admin 放行
  - id: approvals-gate
    uri: /api/approvals/*
    upstream_id: echo
    plugins:
      gateway-auth: {}
      prometheus: {}

  # 白名单对照：auth 路由不挂认证插件（与生产一致；prometheus 例外——观测与认证无关）
  # 2026-09-21 与生产同步：注入部署级默认租户（后端 login/refresh 要求可信
  # X-Tenant-Id，见 72be04d；set 覆盖防伪造，多租户演进前单租户兜底）
  - id: auth-passthrough
    uri: /api/auth/*
    upstream_id: auth
    plugins:
      prometheus: {}
      proxy-rewrite:
        regex_uri: ["^/api/(.*)$", "/$1"]
        headers:
          set:
            X-Tenant-Id: "default"

# 访问审计日志挂全路由（与生产一致，台架同时承担生产配置加载前验证）
global_rules:
  - id: access-log-global
    plugins:
      gateway-access-log: {}

#END
