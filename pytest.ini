[pytest]
testpaths = backend/tests tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    --strict-markers
    --tb=short
    --cov=backend
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=55
filterwarnings =
    ignore::DeprecationWarning
markers =
    benchmark: 性能基准用例（无 pytest-benchmark 插件时仅作标记，正常执行）
    llm_judge: LLM Judge 测试（需要 Ollama 服务，CI 中非阻塞运行）
    pg: 需要 PostgreSQL 的测试（unit-only 运行时用 -m "not pg" 跳过）