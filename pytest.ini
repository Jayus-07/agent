[pytest]
testpaths = backend/tests tests
# 让 `from tests.xxx import ...` 能解析到 backend/tests（backend/tests 是包）。
# ⚠️ 这条在 pyproject.toml 的 [tool.pytest.ini_options] 里也写着（pythonpath = ["backend"]），
# 但 **pytest.ini 优先级高于 pyproject.toml**，于是那份配置从来没生效过 ——
# 表现为仓库根直接跑 pytest 时 13 个模块收集失败（backend/tests/sql/*、context_budget/*），
# 全量套件直接 Interrupted。两处必须保持一致（此处为生效的那份）。
pythonpath = backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# 日常全量不加 coverage 插桩（约省 15-40% 耗时），推荐并发跑：pytest -n 4
# 覆盖率门禁改为显式运行（夜间/发版）：
#   pytest --cov=backend --cov-report=term-missing --cov-report=html:htmlcov \
#          --cov-report=xml:coverage.xml --cov-fail-under=55
addopts =
    --strict-markers
    --tb=short
# ── 用例级硬超时（pytest-timeout）─────────────────────────────────
# 背景：宿主→docker PG 的 vpnkit 转发存在半开连接病态——TCP connect 瞬时成功，
# 但 psycopg 握手阶段会在 select 上无限等待。此前没有超时机制，只能按
# artifacts/final_rc/BASELINE_RUNBOOK.md 的做法"盯日志 8 分钟无增长即判定挂死"
# 再人工杀进程。装了 pytest-timeout 后可在命令行开启，把人工看护变成自动失败：
#
#   pytest backend/tests/<module> -q --no-cov --timeout=300 --timeout-method=thread
#
# 为什么写在注释而不是 ini（2026-10-09 实测权衡）：
#   - 写进 addopts：插件缺失时 pytest 直接报 "unrecognized arguments" 起不来，
#     等于给所有未装插件的环境（含离线 CI 镜像）加了硬依赖，风险最高；
#   - 写成 ini 键（timeout/timeout_method）：插件缺失时只告警不报错，但会产生
#     "Unknown config option" 噪声，且**当前的离线环境无法安装插件来验证键名**，
#     我拒绝把一个未经验证的键写进生效配置；
#   - 因此只登记依赖与用法，等 CI 或联网环境装上插件后再按插件文档落 ini。
# Windows 必须用 --timeout-method=thread：signal 方式依赖 SIGALRM，Windows 不可用。
# 300s 依据（本机实测最慢用例）：memory ~4.6s、rag indexer ~30s、evaluation 真库 ~60s。
filterwarnings =
    ignore::DeprecationWarning
markers =
    benchmark: 性能基准用例（无 pytest-benchmark 插件时仅作标记，正常执行）
    llm_judge: LLM Judge 测试（需要 Ollama 服务，CI 中非阻塞运行）
    pg: 需要 PostgreSQL 的测试（unit-only 运行时用 -m "not pg" 跳过）
    quality_gate: RAG 质量门禁（真实重建索引+检索，单跑 ~10min；默认跳过，
        用 --quality-gate 或 RUN_QUALITY_GATE=1 显式运行）