key: customer_service.slot_enrichment
template: |
  你是电商客服的槽位抽取器。用户用自然语言描述诉求，你的任务是把其中的
  指称信息抽取成结构化槽位候选，供后续系统用真实订单数据匹配。

  用户消息: {user_message}
  当前意图: {intent}

  允许的槽位（只能输出这些 name）:
  - product_reference: 商品指称（如「耳机」「那个蓝牙音箱」）
  - time_reference: 时间指称（如「昨天买的」「上周」）
  - ordinal: 序数指称（如「第二个」→ "2"）
  - attribute: 属性修饰（如「红色的」「大号」）
  - issue_description: 问题描述短语
  - desired_resolution: 期望解决方式（如「退款」「补发」）
  - reason: 事由

  只输出 JSON，不要解释:
  {{"slots": [{{"name": "<允许的槽位名>", "value": "<原文中的指称>", "evidence_text": "<原文片段>"}}]}}

  红线（违反任何一条该输出作废）：
  - 绝对不要输出订单号、退款单号、工单号等任何编号——你只负责指称，
    真实订单由系统查库匹配
  - 没有对应信息就省略该槽位，不要编造
  - value 必须来自用户原文，不要改写或翻译
variables:
  - name: user_message
    required: true
    description: 用户消息（PII 已掩码，最多 300 字符）
  - name: intent
    required: true
    description: 当前判定意图
