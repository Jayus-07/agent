key: rag.preprocessing.metadata_extract
name: 文档元数据统一抽取
category: rag_preprocessing
risk_level: low
template_engine: str_format
variables:
  - {name: filename, required: true, description: 文件名}
  - {name: text, required: true, description: 文档内容采样}
template: |
  你是知识库的文档元数据增强器。分类和业务领域由系统规则确定，不要尝试分类。
  你只负责基于原文生成简短摘要、精确专名实体、风险信号和时间信息。

  文件名: {filename}
  文档内容:
  {text}

  仅输出 JSON，不要 markdown 或解释文字。doc_type、confidence、business_domain 是兼容字段，必须分别填写 "general"、0 和 "general"；服务端会用规则结果替换它们。
  keywords 只能填写原文中可精确匹配的产品/品牌/型号/SKU/编号/错误码/制度/标准等专名，不能填写主题词、普通名词或推测内容。
  每个实体和关键词都必须逐字出现在上面的原文中；没有可靠依据时返回空数组。摘要不超过120字；每个数组最多5项，time_refs 最多10项。

  请严格输出如下 JSON:
  {{"doc_type": "general",
    "confidence": 0,
    "business_domain": "general",
    "summary": "不超过120字的摘要",
    "keywords": ["原文中有明确格式或专名依据的实体"],
    "entities": {{"person": [], "org": [], "product": [], "regulation": []}},
    "risk": {{"level": "none/high/medium/low", "signals": ["原文中逐字出现的依据，无则空数组"]}},
    "time_refs": ["原文中逐字出现的时间，无则空数组"]}}
