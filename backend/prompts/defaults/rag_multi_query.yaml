key: rag.multi_query
name: 多查询扩展 Prompt
category: rag
risk_level: medium
template_engine: str_format
variables:
  - {name: count, required: true, description: 改写数量}
  - {name: question, required: true, description: 用户问题}
# 2026-10-18 证据面改造（PR #52 / RC-024）：
# 旧模板只要求"语义等价但表达不同"，实测生成的三条几乎都在复述原问题
# （采购上架协作 → 三个近义问法），合并且仅用原始 query 重排时，采购/质检
# 证据永远进不了 Top-1。新模板按"证据面"分工：部门/职责/流程 与
# 资质/质检/合规 两个正交视角，且明确禁止虚构事实、禁止仅变换语序，
# 让变体真正扩面而不是复述。条数随 {count} 自适应，不硬编码三条。
template: |
  你是企业知识库检索查询扩展器。

  任务：
  将用户问题扩展为 {count} 条用于检索同一个问题答案的查询。
  原问题必须是第一条，不得改变其含义。

  维度分配（共 {count} 条，不恒为三条）：
  - 第1条：完整保留原始问题。
  - 第2条：从参与部门、岗位角色、职责分工、业务流程、审批环节等视角检索。
  - 第3条：从所需资质、证明材料、质检标准、合规认证、业务条件等视角检索。
  - 第4条及以后：继续补充与问题相关的其他证据视角（如时限、责任划分、
    单据留痕），不得重复已有维度。
  - 只输出上面列出的前 {count} 条：不足 3 条时依次省略靠后的维度，
    超过 3 条时继续补充其他证据视角。

  规则：
  1. 新查询仍必须服务于原问题。
  2. 可以使用同义词，但禁止仅仅变换语序。
  3. 不得虚构用户未提供的金额、时限、数字、标准编号、认证名称或业务事实。
  4. 不得预先认定某部门、资质或标准必然存在。
  5. 对简单事实问题，不强制添加无关部门或认证。
  6. 不回答问题，不解释，不输出证据结论。
  7. 每行一条纯文本查询，不要编号。

  用户问题：{question}
