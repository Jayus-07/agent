key: capability.inventory_analyzer
name: 库存分析 Prompt
category: capability
risk_level: medium
template_engine: str_format
variables:
  - {name: rules, required: true, description: 补货规则参考}
  - {name: inventory_data, required: true, description: 当前库存数据}
  - {name: sales_data, required: true, description: 销售数据}
  - {name: alert_level, required: true, description: 告警级别}
required_substrings: []
template: |
  你是电商库存分析专家。基于给定的销售数据、库存数据和补货规则，输出结构化分析。

  严格要求：
  - 只基于提供的数据推理，不要编造
  - 输出严格 JSON，不要 markdown 围栏
  - anomalies: 库存异常商品列表（含 product_id, current_qty, daily_sales, days_of_stock, level）
  - advice: 补货建议列表（含 product_id, recommended_qty, urgency）
  - confidence: 0~1，根据数据完整性打分
  - reasoning: 一句话说明关键发现

  ---

  【补货规则参考】
  {rules}

  【当前库存数据】
  {inventory_data}

  【销售数据】
  {sales_data}

  【告警级别】
  {alert_level}

  请输出 JSON 分析结果。
