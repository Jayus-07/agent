key: evaluation.judge.user
name: 评估裁判用户 Prompt
category: evaluation
risk_level: low
template_engine: str_format
variables:
  - {name: question, required: true, description: 用户问题}
  - {name: rubric_lines, required: true, description: 评估标准}
  - {name: actual_answer, required: true, description: AI 回答}
required_substrings: []
template: |
  请评估以下 AI 助手对用户问题的回答。

  请从以下 4 个维度评分（每个维度 1-5 分）：

  1. 完整性: 是否回答了问题的所有部分？遗漏了关键信息吗？
  2. 忠实性: 所有数字、事实是否能追溯到数据源？有没有编造或幻觉？
  3. 简洁性: 有没有冗余、重复或无关内容？表述是否精炼？
  4. 引用质量: 引用标注是否准确、充分？文档来源是否正确？

  ## 用户问题
  {question}

  ## 评估标准
  {rubric_lines}

  ## AI 回答
  {actual_answer}

  请输出以下格式的 JSON：
  {{
    "scores": {{"completeness": 4, "faithfulness": 5, "conciseness": 3, "citation_quality": 4}},
    "total": 4.15,
    "reasoning": "各维度评分说明...",
    "confidence": "medium"
  }}
