key: rag.evidence_gate.self_correction
name: 自纠错查询改写
category: rag
risk_level: medium
template_engine: str_format
variables:
  - {name: reason, required: true, description: 拒答原因}
  - {name: question, required: true, description: 原问题}
template: |
  原问题在知识库检索被拒答（原因：{reason}）。请改写出 3 条更容易命中知识库原文的检索 query，每行一个，不要编号。

  改写要求：
  1. 第 1 条：把书面化/术语化措辞换成口语化同义说法（例如"时效"→"时间/多久"、"规定"→"是什么样的"），贴近知识库常见问答的措辞；保留业务主体与全部限定条件，不扩大范围。
  2. 第 2 条：换一个证据侧重点（流程、材料、时限、条件等），同样用日常措辞。
  3. 第 3 条：关键词化短语（去掉疑问语气词）。
  4. 不得虚构原问题没有的金额、编号、部门或业务事实；不回答问题，只输出检索 query。

  原问题: {question}
  改写结果:
