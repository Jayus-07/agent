# capabilities.yaml — Capability 路由清单（唯一事实源）
#
# 治理规则（企业惯例：声明式 manifest，启动期派生，fail-fast）：
#   - ALL_CAPABILITIES / ROUTE_EXAMPLES / WORKFLOW_NAMES / WORKFLOW_EXAMPLES
#     全部由本文件派生（见 orchestration/router/manifest.py），手写回去会被
#     test_registry_consistency 抓住。
#   - routed: true  → 进入向量/LLM 路由，examples 必填（>=2 条，建议 5-10 条）
#   - routed: false → 已注册但不参与用户问题路由（内部能力），reason 必填
#   - skill 字段必须与 skills/<name>/skill.py 的 name 属性一致
#     （consistency 测试做双向校验：manifest ↔ skills/registry）
#   - workflow 名须形如 ^[a-z][a-z0-9_]*$（纯蛇形，不带点——带点的是
#     capability 命名空间），且必须与 @workflow 装饰器写入的 meta.name 一致。
#     本段必须覆盖 orchestration/workflows/__init__.py::register_all() 里的
#     每一个 workflow，否则该 workflow 在向量路由里"失明"（2026-09-16 前的
#     selection_decision 就是这个状态）。
#
# examples 撰写要点（2026-09-16 补）：
#   - 条数是**召回余量**，不是装饰。2 条只是硬下限，5-10 条才是安全区；
#     向量路由靠它们建索引，条数太少的 capability 容易在多个近义能力间被抢走。
#   - 必须落在该 capability 的**能力边界内**：travel.poi_search 只支持
#     福州/厦门/杭州；competitor.analyze 只处理「有明确竞品 URL 的页面级分析」，
#     不含无 URL 的经营决策咨询（那属 business.analyze）。
#   - 块内不得重复（manifest.py 会抛 ManifestError）。
#
# 「反直觉设计」备忘（2026-09-16 核实；审计时最容易误判的三点）：
#   - routed: false 的能力（email.watch / competitor.watch /
#     competitor.history）**不在向量索引里**（vector_router 只索引
#     routed_capabilities），Rule/LLM Router 也选不到它们 —— 因此它们
#     **抢不走**任何 routed 能力的路由。写 examples 时不必为「避让」
#     内部能力而回避某些措辞。
#   - 竞品三个 capability 是「漏斗式」：RuleRouter 把 竞品/比价/巡检/
#     监控列表/价格监控/降价/涨价 全部指向 competitor.analyze，再由
#     Skill._select_tool 按 action 分发到 analyze / watch / history /
#     watchlist 四个 Tool。故 competitor.analyze 的 examples **必须**
#     保留「监控」类措辞（如「监控一下竞品价格变化」）—— 该问句在
#     RuleRouter 只命中「竞品」1 个弱信号（confidence 0.72 < 0.8），
#     会 fallback 到向量路由；删掉这条样例会让「监控」类提问失去
#     determinism，而不是「消除重叠」。
#   - routed: false 只约束**路由层**：Planner prompt 与 critique 的能力
#     清单取 orchestration/tool_registry 全量（17 个，含内部），故内部
#     能力对 Planner LLM 仍可见。详见四层设计规范 §4 台账 E9。
#
# 注意：增删 examples 后，VectorRouter 启动时会按数量自检并自动重建 Chroma
# 索引（collection 内自愈，无需手动删 backend/data/router_index）。

version: 1

capabilities:
  - name: sql.query
    skill: sql
    routed: true
    # rule_keywords：规则路由（RuleRouter）单意图强/弱信号关键词（正则）。
    # 未声明的 capability 由 rule_router 回退内置缺省表，行为不变。
    rule_keywords:
      - 多少
      - 几个
      - 统计
      - 数量
      - 金额
      - 总和
      - 排名
      - "TOP"
      - 前.*?名
      - 最高
      - 最低
      - 最近
      - 本月
      - 上月
      - 今年
      - 去年
      - 环比
      - 同比
      - 增长率
    examples:
      - 最近 30 天销售金额
      - 本月销量前 10 的商品
      - 查询库存不足的商品
      - 上个月退款金额
      - 各品类商品数量统计
      - 排名前五的客户

  - name: rag.search
    skill: rag
    routed: true
    rule_keywords:
      - 制度
      - 规定
      - 规范
      - 政策
      - 流程
      - 标准
      - 时效
      - "SLA"
      - 多久
      - 如何
      - 怎么
      - 是什么
      - 什么叫
      - 定义
      - 审核
      - 退款
      - 退货
      - 换货
      - 售后
    examples:
      - 公司制度是什么
      - 请解释退款流程
      - 员工福利有哪些规定
      - 广告政策说明
      - 商品上架要求
      - 差评处理 SOP

  - name: business.analyze
    skill: business_analysis
    routed: true
    examples:
      - 分析库存不足的原因
      - 毛利率下降趋势分析
      - 找出销量下降的关键商品
      - 评估供应商绩效
      - 分析最近三个月退货率变化的原因
      - 各渠道的转化率表现怎么样

  - name: report.generate
    skill: report
    routed: true
    examples:
      - 生成月度销售报告
      - 生成库存分析报告
      - 生成经营周报
      - 出一份上月经营分析报告
      - 生成季度销售总结
      - 帮我写一份库存盘点报告

  - name: email.send
    skill: email
    routed: true
    examples:
      - 发送邮件给运营
      - 把日报发给 CEO
      - 邮件通知采购
      - 帮我发一封邮件给采购部
      - 给团队群发会议通知
      - 发封邮件跟供应商确认交期

  # 批次1 Agently Mail 扩展：读能力需 EMAIL_ENGINE=agently 且完成 OAuth；
  # 未安装 CLI 时工具层返回不可用提示，不炸路由
  - name: email.search
    skill: email
    routed: true
    examples:
      - 帮我搜一下邮箱里关于发货单的邮件
      - 最近收到了哪些邮件
      - 找一下客户发来的报价邮件
      - 搜一下上周的订单确认邮件
      - 邮箱里有没有物流公司的回信
      - 找找关于合同续签的邮件

  - name: email.read
    skill: email
    routed: true
    examples:
      - 读一下这封邮件的内容
      - 这封邮件里说了什么
      - 看看邮件的附件
      - 打开最新那封邮件看看
      - 帮我读一下第三封邮件
      - 这封邮件里有没有提到交期

  # 内部能力：watch 长轮询不适合对话内触发，供通知闭环/automation 消费
  - name: email.watch
    skill: email
    routed: false
    reason: 新邮件监听为长轮询阻塞操作，仅通知闭环与 automation 内部使用

  - name: data.export
    skill: data_export
    routed: true
    examples:
      - 导出销售数据到 Excel
      - 把客户名单导出
      - 导出全部商品清单
      - 把这份数据存成 CSV
      - 导出近半年的销售明细
      - 把上个月的订单导出成 Excel

  - name: web.search
    skill: web_search
    routed: true
    examples:
      - 搜索 Amazon 政策更新
      - 查 Google 趋势
      - 搜一下最新的跨境电商政策
      - 查一下 Temu 最近的规则变化
      - 网上有没有关于这个类目的报道
      - 搜一下这个品牌最近有什么新动作

  - name: web.crawl
    skill: web_crawl
    routed: true
    examples:
      - 抓取竞品网站
      - 爬取新闻内容
      - 抓取这个商品详情页的内容
      - 把这个网页的正文提取出来
      - 爬一下这篇文章的全文
      - 帮我抓取这个页面的价格信息

  - name: data.collect
    skill: data_collection
    routed: true
    examples:
      - 采集 90 天销售数据
      - 收集各平台数据
      - 采集最近一个月的订单数据
      - 拉取各平台的销量数据
      - 导入这批商品的价格数据
      - 采集供应商的库存数据

  # 仅覆盖「候选地点检索」这一无状态能力；完整行程规划走旅游域图，
  # 不经主 Router（见 orchestration/graph/travel_prefilter.py）
  - name: travel.poi_search
    skill: travel_poi
    routed: true
    examples:
      - 福州有哪些值得去的景点
      - 厦门必去的打卡点有哪些
      - 帮我找杭州适合亲子的地方
      - 查一下鼓浪屿附近的景点
      - 厦门有哪些适合看海的地方
      - 杭州有什么值得逛的博物馆

  - name: map.lookup
    skill: map_lookup
    routed: true
    examples:
      - 福州现在天气怎么样
      - 明天厦门会下雨吗
      - 三坊七巷具体在哪
      - 这个坐标是什么地方
      - 从福州站到长乐机场要多久
      - 帮我查一下附近有什么咖啡店
      - 把这几个地点画成一张地图

  # 竞品分析此前只在 rule_router 硬编码强信号，ALL_CAPABILITIES 缺失导致
  # LLM Router 会拒绝它（tool_selector.py 注释已承认该漂移）。manifest 化
  # 后正式纳入路由，规则强信号依旧优先生效。
  - name: competitor.analyze
    skill: competitor_analysis
    routed: true
    examples:
      - 分析这个竞品链接
      - 帮我跟竞品比价
      - 看看竞品这个商品的卖点和差评
      - 监控一下竞品价格变化
      - 查一下这个商品页的价格和促销信息
      - 这个竞品链接的价格有变化吗

  # 内部能力：不参与用户问题路由。用户侧「巡检/监控」类提问由
  # competitor.analyze 的 examples 承接，再经 action=watch 分发。
  - name: competitor.watch
    skill: competitor_analysis
    routed: false
    reason: 竞品巡检为全量扫描 + 快照写入，不参与用户问题路由：用户侧「巡检/监控」类提问由 competitor.analyze 承接并经 action=watch 分发（selection_decision workflow 直接读 store，不经过本能力）

  - name: competitor.history
    skill: competitor_analysis
    routed: false
    reason: 竞品快照历史查询依赖已存快照，不参与用户问题路由：用户侧「价格历史」类提问由 competitor.analyze 承接并经 action=history 分发（selection_decision workflow 直接读 store，不经过本能力）

workflows:
  - name: daily_report
    examples:
      - 每天跑日报
      - 自动生成日报
      - 今天的日报
      - 把日报发邮件

  - name: inventory_alert
    examples:
      - 检查库存风险
      - 自动提醒采购
      - 库存预警扫描

  # 批次2 市场调研：证据管线（采集→标准化→分组分析→事实锁定→12章节报告）
  - name: market_research
    examples:
      - 调研一下蓝牙耳机市场
      - 帮我做宠物零食的品类市场调研报告
      - 分析这个品类的市场规模和竞争格局

  # 批次3 选品决策：市场评估→差异化→财务测算→AI评审团→决策报告
  # 2026-09-16 补登记：该 workflow 此前只在 app/server.py 注册、不在本清单，
  # 导致向量路由对用户问题看不见它（manifest 不完整）。
  - name: selection_decision
    examples:
      - 评估蓝牙耳机品类值不值得做
      - 帮我做一次选品决策
      - 这个品类能不能上
      - 给宠物零食品类出一份选品决策报告
