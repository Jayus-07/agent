        description: 竞品名称（add 时可选）
      question:
        type: string
        required: false
        description: 用户原始问题（其中的 URL 会被自动提取）
      enabled:
        type: boolean
        required: false
        description: toggle 时是否启用（默认 True）
      idempotency_key:
        type: string
        required: false
        description: 客户端幂等键；重复提交同键不会重复抓取或修改
    planner_examples:
    - action: analyze
      url: https://item.jd.com/100012043978.html
      question: 帮我分析这个竞品的价格
    - action: watch
      question: 巡检一下所有监控的竞品
    - action: history
      url: https://item.jd.com/100012043978.html
      question: 这个竞品最近价格走势如何
    - action: add
      url: https://item.jd.com/100012043978.html
      name: iPhone 15 Pro Max
    - action: remove
      url: https://item.jd.com/100012043978.html
    routed: false
    domain: business
    risk_level: LOW
    fast_path_enabled: true
    reason: 竞品快照历史查询依赖已存快照，不参与用户问题路由：用户侧「价格历史」类提问由 competitor.analyze 承接并经 action=history 分发（selection_decision workflow 直接读 store，不经过本能力）

workflows:
  - name: daily_report
    examples:
