# capabilities.yaml — Capability 路由清单（唯一事实源）
#
# 治理规则（企业惯例：声明式 manifest，启动期派生，fail-fast）：
#   - ALL_CAPABILITIES / ROUTE_EXAMPLES / WORKFLOW_NAMES / WORKFLOW_EXAMPLES
#     全部由本文件派生（见 orchestration/router/manifest.py），手写回去会被
#     test_registry_consistency 抓住。
#   - routed: true  → 进入向量/LLM 路由，examples 必填（>=2 条，建议 5-10 条）
#   - routed: false → 已注册但不参与用户问题路由（内部能力），reason 必填
#   - skill 字段必须与 skills/<name>/skill.py 的 name 属性一致
#     （consistency 测试做双向校验：manifest ↔ skills/registry）
#   - workflow 名须形如 ^[a-z][a-z0-9_]*$（纯蛇形，不带点——带点的是
#     capability 命名空间），且必须与 @workflow 装饰器写入的 meta.name 一致。
#     本段必须覆盖 orchestration/workflows/__init__.py::register_all() 里的
#     每一个 workflow，否则该 workflow 在向量路由里"失明"（2026-09-16 前的
#     selection_decision 就是这个状态）。
#
# examples 撰写要点（2026-09-16 补）：
#   - 条数是**召回余量**，不是装饰。2 条只是硬下限，5-10 条才是安全区；
#     向量路由靠它们建索引，条数太少的 capability 容易在多个近义能力间被抢走。
#   - 必须落在该 capability 的**能力边界内**：travel.poi_search 只支持
#     福州/厦门/杭州；competitor.analyze 只处理「有明确竞品 URL 的页面级分析」，
#     不含无 URL 的经营决策咨询（那属 business.analyze）。
#   - 块内不得重复（manifest.py 会抛 ManifestError）。
#
# 「反直觉设计」备忘（2026-09-16 核实；审计时最容易误判的三点）：
#   - routed: false 的能力（email.watch / competitor.watch /
#     competitor.history）**不在向量索引里**（vector_router 只索引
#     routed_capabilities），Rule/LLM Router 也选不到它们 —— 因此它们
#     **抢不走**任何 routed 能力的路由。写 examples 时不必为「避让」
#     内部能力而回避某些措辞。
#   - 竞品三个 capability 是「漏斗式」：RuleRouter 把 竞品/比价/巡检/
#     监控列表/价格监控/降价/涨价 全部指向 competitor.analyze，再由
#     Skill._select_tool 按 action 分发到 analyze / watch / history /
#     watchlist 四个 Tool。故 competitor.analyze 的 examples **必须**
#     保留「监控」类措辞（如「监控一下竞品价格变化」）—— 该问句在
#     RuleRouter 只命中「竞品」1 个弱信号（confidence 0.72 < 0.8），
#     会 fallback 到向量路由；删掉这条样例会让「监控」类提问失去
#     determinism，而不是「消除重叠」。
#   - routed: false 只约束**路由层**：Planner prompt 与 critique 的能力
#     清单取 orchestration/tool_registry 全量（17 个，含内部），故内部
#     能力对 Planner LLM 仍可见。详见四层设计规范 §4 台账 E9。
#
# =====================================================
# 分层路由（hierarchical routing，2026-09-22）
# =====================================================
# domains 段：粗分类器（CoarseIntentClassifier）的唯一事实源。
#   - description/examples 供 embedding prototype 分类器建域心；
#   - keywords 供规则 hint（强信号 >= COARSE_RULE_STRONG_HITS 直接判域）；
#   - customer_service / travel / selection_funnel 是域图（无主图 capability），
#     粗分类命中后由 router_node 复用各自既有 prefilter，不新增路由实现。
#
# capability 三字段（声明式，禁止代码手写映射）：
#   domain            归属粗域（必须已在 domains 段声明，manifest fail-fast）
#   risk_level        LOW / MEDIUM / HIGH —— HIGH 永不进 Fast Path，
#                     执行期另有 Tool 层审批门（security/tool_approval）
#   fast_path_enabled 细路由 Fast Path 白名单（还需 top1/margin 双阈值 + LOW 风险）

version: 1

domains:
  - name: knowledge
    description: 企业知识与公开信息检索：制度、政策、文档、FAQ、知识库问答、外部资料搜索
    examples:
      - 公司年假规定是什么
      - 退款流程是怎么规定的
      - 员工福利有哪些制度
      - 广告投放政策说明
      - 差评处理 SOP
      - 搜一下最新的跨境电商政策
    keywords:
      - 制度
      - 报销
      - 规定
      - 规范
      - 政策
      - 流程
      - 标准
      - 时效
      - "SLA"
      - 是什么
      - 什么叫
      - 定义
      - 条例
      - 指南
      - "SOP"

  - name: data
    description: 数据查询与统计：数据库查询、指标、明细数据、数据导出与采集
    examples:
      - 查询最近 30 天销售额
      - 本月销量前 10 的商品
      - 各品类商品数量统计
      - 导出销售数据到 Excel
      - 采集最近一个月的订单数据
      - 排名前五的客户
    keywords:
      - 多少
      - 几个
      - 统计
      - 数量
      - 金额
      - 总和
      - 排名
      - 库存
      - 销量
      - 销售额
      - 环比
      - 同比
      - 增长率
      - 明细
      - 导出

  - name: business
    description: 业务分析：经营分析、销量趋势、竞品与比价分析、库存原因分析
    examples:
      - 分析 SKU001 为什么销量下降
      - 毛利率下降趋势分析
      - 评估供应商绩效
      - 分析这个竞品链接
      - 跟竞品比价
      - 各渠道转化率表现怎么样
    keywords:
      - 分析
      - 为什么
      - 原因
      - 趋势
      - 毛利
      - 转化率
      - 竞品
      - 比价
      - 经营

  - name: report
    description: 报告生成：经营报告、销售周报月报、分析报告、总结汇报
    examples:
      - 生成本月经营分析报告
      - 生成月度销售报告
      - 生成库存分析报告
      - 出一份上月经营周报
      - 帮我写一份库存盘点报告
    keywords:
      - 报告
      - 报表
      - 周报
      - 日报
      - 总结
      - 汇报
      # 正则对冲：「经营分析报告」同时命中 business 的 分析+经营，须让
      # report 有同等强度的组合信号，避免被 business rule override 抢走
      - 分析.*?报告
      - 生成.*?报告

  - name: customer_service
    description: 客服售后：订单查询、物流、退款退货申请、投诉、人工客服（域图承载）
    examples:
      - 查一下我的订单物流
      - 订单 123456 到哪了
      - 帮我申请退款
      - 东西坏了怎么退换
      - 我要投诉
      - 转人工客服
    keywords:
      - 订单
      - 物流
      - 退款
      - 退货
      - 换货
      - 售后
      - 投诉
      - 客服
      - 发货

  - name: travel
    description: 旅游出行：行程规划、景点检索、天气路线地图（域图承载）
    examples:
      - 规划福州 2 天的行程
      - 厦门有哪些值得去的景点
      - 明天会下雨吗
      - 从福州站到长乐机场要多久
    keywords:
      - 旅游
      - 行程
      - 景点
      - 攻略
      - 出行
      - 天气

  - name: selection_funnel
    description: 智能选品：品类评估、选品漏斗、上不上架决策（域图承载）
    examples:
      - 给宠物零食做一次智能选品
      - 评估蓝牙耳机品类值不值得做
    keywords:
      - 选品

  - name: communication
    description: 邮件通信：发送邮件、搜索邮件、读邮件
    examples:
      - 发送邮件给运营
      - 帮我搜一下邮箱里关于发货单的邮件
      - 读一下这封邮件的内容
    keywords:
      - 邮件
      - 邮箱
      - 抄送
      - 收件人

  - name: general
    description: 普通寒暄与闲聊，不需要任何工具的请求
    examples:
      - 你好
      - 你能做什么
      - 谢谢
      - 再见
    keywords:
      - 你好
      - 您好
      - 谢谢
      - 再见
      - 你是谁

capabilities:
  - name: sql.query
    skill: sql
    description: 查询 PostgreSQL 数据库并返回结构化 SQLResult（行/列/耗时）
    params_schema:
      question:
        type: string
        required: true
        description: 自然语言查询问题（中文/英文）
    planner_examples:
    - question: 查询库存低于安全库存的商品及其库存量
    routed: true
    domain: data
    risk_level: LOW
    fast_path_enabled: true
    # rule_keywords：规则路由（RuleRouter）单意图强/弱信号关键词（正则）。
    # 未声明的 capability 由 rule_router 回退内置缺省表，行为不变。
    rule_keywords:
      - 多少
      - 几个
      - 统计
      - 数量
      - 金额
      - 总和
      - 排名
      - "TOP"
      - 前.*?名
      - 最高
      - 最低
      - 最近
      - 本月
      - 上月
      - 今年
      - 去年
      - 环比
      - 同比
      - 增长率
      # 2026-09-22 D6 路由能力漂移修复：补齐统计/汇总类特征词。
      # 此前「各部门销售额」「本月订单数」只命中 0-1 个关键词，规则层给不出
      # 强信号，向量层又被 data.collect 的采集类 examples 拉走 top1。
      - 汇总
      - 合计
      - 总额
      - 订单量
      - 订单数
      - 销售额
      - 销量
      - 各部门
      - 按部门
      - 明细
    # score calibration opt-in（score_calibration.py）：向量召回分数按本组
    # 关键词命中数校准（强信号加分 / 零命中降权）。仅显式声明的能力参与，
    # RAG/Travel/CS/Selection 等其他域不受影响。
    calibrate_signals: true
    examples:
      - 最近 30 天销售金额
      - 本月销量前 10 的商品
      - 查询库存不足的商品
      - 上个月退款金额
      - 各品类商品数量统计
      - 排名前五的客户
      - 统计本月订单金额
      - 本月订单总数是多少
      - 各部门销售额统计
      - 最近 7 天退款金额
      - 销售额最高的 5 个商品

  - name: rag.search
    skill: rag
    description: 从跨境电商知识库中检索 SOP/规范/FAQ/Listing指南等非结构化内容
    params_schema:
      question:
        type: string
        required: true
        description: 检索问题
    planner_examples:
    - question: Amazon FBA发货的标准操作流程SOP
    routed: true
    domain: knowledge
    risk_level: LOW
    fast_path_enabled: true
    rule_keywords:
      - 制度
      - 规定
      - 规范
      - 政策
      - 流程
      - 标准
      - 时效
      - "SLA"
      - 多久
      - 如何
      - 怎么
      - 是什么
      - 什么叫
      - 定义
      - 报销
      - 审核
      - 退款
      - 退货
      - 换货
      - 售后
    examples:
      - 公司制度是什么
      - 请解释退款流程
      - 员工福利有哪些规定
      - 广告政策说明
      - 商品上架要求
      - 差评处理 SOP

  - name: business.analyze
    skill: business_analysis
    description: 对 SQL 查询结果进行业务分析，结合 RAG 知识库中的业务规则，生成风险洞察和行动建议。依赖前置 sql.query 步骤的 SQLResult。
    params_schema:
      sql_result:
        type: object
        required: true
        auto: sql.query
        description: 前置 sql.query 步骤产出的 SQLResult（由 previous_outputs 自动传递，无需手动指定）
    planner_examples:
    - sql_result: '{sql: ''SELECT ...'', tables: [''inventory.inventory''], rows: [...], ...}'
    routed: true
    domain: business
    risk_level: LOW
    fast_path_enabled: true
    examples:
      - 分析库存不足的原因
      - 毛利率下降趋势分析
      - 找出销量下降的关键商品
      - 评估供应商绩效
      - 分析最近三个月退货率变化的原因
      - 各渠道的转化率表现怎么样

  - name: report.generate
    skill: report
    description: 生成结构化 Markdown 报告（含图表），基于数据库中的实时数据。必须有前序步骤提供数据后再调用。
    params_schema:
      report_type:
        type: string
        required: true
        enum:
        - daily_sales
        - product_performance
        - inventory_health
        - ad_performance
        - order_fulfillment
        - customer_analysis
        description: 报告类型：daily_sales=销售日报, product_performance=商品动销, inventory_health=库存健康, ad_performance=广告效果, order_fulfillment=订单履约, customer_analysis=客户分析
      filters:
        type: object
        required: false
        description: '筛选条件字典，如 {''channel'': ''Amazon''}'
    planner_examples:
    - report_type: daily_sales
      filters:
        channel: Amazon
    routed: true
    domain: report
    risk_level: LOW
    fast_path_enabled: true
    examples:
      - 生成月度销售报告
      - 生成库存分析报告
      - 生成经营周报
      - 出一份上月经营分析报告
      - 生成季度销售总结
      - 帮我写一份库存盘点报告

  - name: email.send
    skill: email
    description: 邮件能力：发送邮件（SMTP 或 Agently 引擎）；搜索、读取、监听 Agently 邮箱（EMAIL_ENGINE=agently 且完成 OAuth 后可用）。发送必须在报告/数据生成完成后再调用（依赖前序步骤的输出）。
    params_schema:
      action:
        type: string
        required: false
        enum:
        - send
        - search
        - read
        - watch
        description: 操作类型（默认 send）
      to:
        type: string
        required: false
        description: 收件人邮箱，多个用逗号分隔（send 必填）
      subject:
        type: string
        required: false
        description: 邮件主题（send 必填）
      body:
        type: string
        required: false
        description: 邮件正文（支持 Markdown/HTML）（send 必填）
      cc:
        type: string
        required: false
        description: 抄送邮箱
      idempotency_key:
        type: string
        required: false
        description: 客户端幂等键；重复提交同键不会重复发信
      query:
        type: string
        required: false
        description: 搜索关键词（search 必填）
      folder:
        type: string
        required: false
        description: 文件夹 inbox/sent/trash/spam（search 可选）
      message_id:
        type: string
        required: false
        description: 邮件 ID，形如 msg_xxx（read 必填）
      limit:
        type: int
        required: false
        description: 返回条数（search 默认 10）
      timeout_sec:
        type: int
        required: false
        description: watch 等待窗口秒数（默认 120）
    planner_examples:
    - action: send
      to: team@company.com
      subject: 运营周报
      body: '# 本周运营数据
    
    
        ...'
    - action: search
      query: 发货单
      folder: inbox
    - action: read
      message_id: msg_xxx
    - action: watch
      timeout_sec: 60
    routed: true
    domain: communication
    risk_level: HIGH
    fast_path_enabled: false
    examples:
      - 发送邮件给运营
      - 把日报发给 CEO
      - 邮件通知采购
      - 帮我发一封邮件给采购部
      - 给团队群发会议通知
      - 发封邮件跟供应商确认交期

  # 批次1 Agently Mail 扩展：读能力需 EMAIL_ENGINE=agently 且完成 OAuth；
  # 未安装 CLI 时工具层返回不可用提示，不炸路由
  - name: email.search
    skill: email
    description: 邮件能力：发送邮件（SMTP 或 Agently 引擎）；搜索、读取、监听 Agently 邮箱（EMAIL_ENGINE=agently 且完成 OAuth 后可用）。发送必须在报告/数据生成完成后再调用（依赖前序步骤的输出）。
    params_schema:
      action:
        type: string
        required: false
        enum:
        - send
        - search
        - read
        - watch
        description: 操作类型（默认 send）
      to:
        type: string
        required: false
        description: 收件人邮箱，多个用逗号分隔（send 必填）
      subject:
        type: string
        required: false
        description: 邮件主题（send 必填）
      body:
        type: string
        required: false
        description: 邮件正文（支持 Markdown/HTML）（send 必填）
      cc:
        type: string
        required: false
        description: 抄送邮箱
      idempotency_key:
        type: string
        required: false
        description: 客户端幂等键；重复提交同键不会重复发信
      query:
        type: string
        required: false
        description: 搜索关键词（search 必填）
      folder:
        type: string
        required: false
        description: 文件夹 inbox/sent/trash/spam（search 可选）
      message_id:
        type: string
        required: false
        description: 邮件 ID，形如 msg_xxx（read 必填）
      limit:
        type: int
        required: false
        description: 返回条数（search 默认 10）
      timeout_sec:
        type: int
        required: false
        description: watch 等待窗口秒数（默认 120）
    planner_examples:
    - action: send
      to: team@company.com
      subject: 运营周报
      body: '# 本周运营数据
    
    
        ...'
    - action: search
      query: 发货单
      folder: inbox
    - action: read
      message_id: msg_xxx
    - action: watch
      timeout_sec: 60
    routed: true
    domain: communication
    risk_level: LOW
    fast_path_enabled: true
    examples:
      - 帮我搜一下邮箱里关于发货单的邮件
      - 最近收到了哪些邮件
      - 找一下客户发来的报价邮件
      - 搜一下上周的订单确认邮件
      - 邮箱里有没有物流公司的回信
      - 找找关于合同续签的邮件

  - name: email.read
    skill: email
    description: 邮件能力：发送邮件（SMTP 或 Agently 引擎）；搜索、读取、监听 Agently 邮箱（EMAIL_ENGINE=agently 且完成 OAuth 后可用）。发送必须在报告/数据生成完成后再调用（依赖前序步骤的输出）。
    params_schema:
      action:
        type: string
