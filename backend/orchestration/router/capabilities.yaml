  # 仅覆盖「候选地点检索」这一无状态能力；完整行程规划走旅游域图，
  # 不经主 Router（见 orchestration/graph/travel_prefilter.py）
  - name: travel.poi_search
    skill: travel_poi
    description: 检索旅行目的地城市（当前支持：福州、厦门、杭州）的候选兴趣点（POI），返回含营业时段、坐标、票价、建议停留时长的结构化列表。适用于行程规划前的候选池获取，或选址/周边分析中的地点摸底。注意：返回的是候选池，不含排程、通勤与时间可行性校验。
    params_schema:
      city:
        type: string
        required: true
        description: 目的地城市名，如「福州」「厦门」「杭州」
      preferences:
        type: string
        required: false
        description: 逗号分隔偏好标签：自然/人文/美食/亲子/购物/夜生活/摄影
      avoid:
        type: string
        required: false
        description: 逗号分隔的避雷关键词（地名或类别），命中即剔除
      must_go:
        type: string
        required: false
        description: 逗号分隔的必去地点名，命中项标记 required 并优先返回
      limit:
        type: integer
        required: false
        description: 返回条数上限（默认 20）
    planner_examples:
    - city: 福州
      preferences: 人文,摄影
      must_go: 三坊七巷
      limit: 10
    - city: 厦门
      avoid: 购物
      limit: 8
    routed: true
    domain: travel
    risk_level: LOW
    fast_path_enabled: true
    examples:
      - 福州有哪些值得去的景点
      - 厦门必去的打卡点有哪些
      - 帮我找杭州适合亲子的地方
      - 查一下鼓浪屿附近的景点
      - 厦门有哪些适合看海的地方
      - 杭州有什么值得逛的博物馆

  - name: map.lookup
    skill: map_lookup
    description: 查询地理位置类事实：天气、地址与坐标互转、地点检索、路线规划与耗时、导航调起链接、静态地图图片、行政区划、街景。适用于「福州现在天气怎么样」「三坊七巷在哪」「从这里到机场要多久」「把这个地方画出来」这类问题。注意：本能力只回答事实查询，不做行程安排（排期请用旅行域能力）；坐标入参统一为「纬度,经度」；街景需企业开发者权限，未开通会返回明确指引。
    params_schema:
      action:
        type: string
        required: true
        enum:
        - weather
        - geocode
        - reverse_geocode
        - place_search
        - route
        - navigation
        - static_map
        - district
        - street_view
        description: 查询类型：weather 天气 / geocode 地址转坐标 / reverse_geocode 坐标转地址 / place_search 地点检索 / route 路线规划 / navigation 导航调起 / static_map 静态图 / district 行政区划 / street_view 街景
      city:
        type: string
        required: false
        description: 城市名，如「福州」；weather/place_search/geocode 用于消歧
      address:
        type: string
        required: false
        description: 待解析的地址文本（geocode 用）
      keyword:
        type: string
        required: false
        description: 检索词（place_search/district 用，也可作为 geocode 的地址）
      location:
        type: string
        required: false
        description: 坐标「纬度,经度」（weather/reverse_geocode/static_map/street_view 用）
      from_location:
        type: string
        required: false
        description: 起点坐标「纬度,经度」（route/navigation 用）
      to_location:
        type: string
        required: false
        description: 终点坐标「纬度,经度」（route/navigation 用）
      to_name:
        type: string
        required: false
        description: 终点名称，显示在导航调起页上（navigation 用）
      mode:
        type: string
        required: false
        description: 出行方式：route 用 driving/walking/bicycling/transit；navigation 用 drive/walk/bus/bike（传前者会自动转换）
      kind:
        type: string
        required: false
        description: 天气类型：now 实时 / future 未来几天 / hourly 逐小时（默认 now）
      near:
        type: string
        required: false
        description: 周边检索中心坐标「纬度,经度」（place_search 用）
      zoom:
        type: integer
        required: false
        description: 静态图缩放级别 4~18，默认 14
      size:
        type: string
        required: false
        description: 静态图尺寸「宽*高」，默认 600*400
      markers:
        type: string
        required: false
        description: 静态图标注点，分号分隔，每项「纬度,经度」或「纬度,经度,标注字符」
      radius_m:
        type: integer
        required: false
        description: 半径（米）：place_search 默认 3000 / street_view 默认 50
      page_size:
        type: integer
        required: false
        description: 地点检索返回条数，默认 10，上限 20
      district_id:
        type: string
        required: false
        description: 行政区划 id（district 用，与 keyword 二选一）
    planner_examples:
    - action: weather
      city: 福州
    - action: geocode
      address: 福州市鼓楼区南后街139号
      city: 福州
    - action: place_search
      keyword: 咖啡
      city: 福州
      page_size: 5
    - action: route
      from_location: 26.0824,119.2968
      to_location: 26.049,119.389
      mode: driving
    - action: static_map
      location: 26.0824,119.2968
      zoom: 13
      markers: 26.0824,119.2968,A
    routed: true
    domain: travel
    risk_level: LOW
    fast_path_enabled: true
    examples:
      - 福州现在天气怎么样
      - 明天厦门会下雨吗
      - 三坊七巷具体在哪
      - 这个坐标是什么地方
      - 从福州站到长乐机场要多久
      - 帮我查一下附近有什么咖啡店
      - 把这几个地点画成一张地图

  # 竞品分析此前只在 rule_router 硬编码强信号，ALL_CAPABILITIES 缺失导致
  # LLM Router 会拒绝它（tool_selector.py 注释已承认该漂移）。manifest 化
