# Agent Platform — 一键启动全家桶
#
#   docker compose up -d          # 启动全部服务
#   docker compose logs -f app    # 查看应用日志
#   docker compose down           # 停止
#
# P1-12 生产化改动：
#   - PostgreSQL 不再对外暴露端口（仅容器网络内可达）；
#     如需本地调试，取消下方 postgres.ports 注释（仅绑 127.0.0.1）
#   - 应用业务库查询走 agent_readonly 只读账号（数据库层只读防线）
#   - 首次启动由 docker/init-dbs.sh 自动建库 + 建角色（幂等）
#   - PGPASSWORD / PG_READONLY_PASSWORD 必填（fail-fast，无默认弱密码）

# 微服务拆分后的统一网络
networks:
  agent-net:
    driver: bridge

services:
  # ── APISIX（Python 项目独立入口，B1 起）──
  # standalone 声明式配置（apisix/apisix.yaml 进 git，不引 Nacos/etcd）；
  # 端口绑 127.0.0.1：B1~B3 仅本机验证，B4 切流时才评估对外暴露。
  # Java SCG(8080) 原样保留，是回滚路径，二者并存互不影响。
  apisix:
    image: apache/apisix:3.13.0-debian
    container_name: agent-apisix
    ports:
      - "127.0.0.1:9080:9080"
    volumes:
      # 改路由只动 apisix/apisix.yaml，重启容器即生效（发布/回滚流程见方案 §8）
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      # standalone 声明：role=data_plane + config_provider=yaml（3.13 镜像要求显式声明）
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      # 自研认证插件（B2；源码进 Git，密钥走环境变量不落盘）
      - ./apisix/plugins:/usr/local/apisix/custom_plugins/apisix/plugins:ro
    environment:
      # 认证模式灰度：shadow（默认，只记不拦）→ guest → enforce（B4 切流时定）
      - GATEWAY_AUTH_MODE=${GATEWAY_AUTH_MODE:-shadow}
      # JWT 验签（与 Java auth-service 同源；值来自 .env，禁止写入本文件）
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_SECRET_PREVIOUS=${JWT_SECRET_PREVIOUS:-}
      - JWT_ISSUER=${JWT_ISSUER:-hongmeng-oa}
      # Redis 黑名单（只读 oa-auth-redis，写侧归 auth-service）
      - AUTH_REDIS_HOST=${AUTH_REDIS_HOST:-host.docker.internal}
      - AUTH_REDIS_PORT=${AUTH_REDIS_PORT:-16379}
      - AUTH_REDIS_PASSWORD=${AUTH_REDIS_PASSWORD:-}
    # 注意：不要加 extra_hosts host-gateway —— Docker Desktop (Windows) 自带的
    # host.docker.internal 才能到达宿主机 loopback 服务（8000/8006）；
    # host-gateway 指向 VM 网关，loopback 服务不可达（B1 实测 502）。
    networks:
      - agent-net
    restart: unless-stopped

  # ── API Gateway（Spring Cloud Gateway，统一入口）──
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    volumes:
      # 外部配置覆盖（Spring Boot 默认读取 ./config/application.yml，WORKDIR=/app）：
      # 改路由/白名单只动 api-gateway/config/application.yml，然后
      #   docker compose restart api-gateway
      # 无需 --build 重新打镜像（镜像内那份 yml 仅作容器裸跑兜底）
      - ./api-gateway/config:/app/config:ro
    environment:
      # Python 后端跑在宿主机；若 app 容器启用则改回 http://app:8000
      # 支持环境变量覆盖：冒烟脚本用它把上游临时切到回显桩，验证网关下发/剥离的身份头
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://host.docker.internal:8000}
      - BUSINESS_SERVICE_URL=http://business-service:8081
      # ── 认证中心接入 + 网关统一鉴权（P2）──
      # 认证中心为 oa-auth 独立 compose（端口仅绑宿主机 loopback），容器经 host.docker.internal 访问
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://host.docker.internal:8006}
      # system-service（注册/用户中心）：Nacos 配置端口 8001、context-path /system
      - SYS_SERVICE_URL=${SYS_SERVICE_URL:-http://host.docker.internal:8001}
      # 网关热路由开关（仅本地开发）：true 时暴露 /actuator/gateway 端点，
      # 可 POST 运行时增改路由零重启；生产/对外必须保持 false
      - GATEWAY_HOT_ROUTES=${GATEWAY_HOT_ROUTES:-false}
      - GATEWAY_ACTUATOR_INCLUDE=${GATEWAY_ACTUATOR_INCLUDE:-health,info,metrics}
      - GATEWAY_AUTH_ENABLED=${GATEWAY_AUTH_ENABLED:-false}
      - GATEWAY_AUTH_MODE=${GATEWAY_AUTH_MODE:-shadow}
      # JWT_SECRET 必须与 Enterprise_OA/anonymous-rating-system/docker/.env.oaauth 的 JWT_SECRET_KEY 同值
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_ISSUER=${JWT_ISSUER:-hongmeng-oa}
      # 黑名单 Redis 指向 oa-auth-redis（独立实例，noeviction，ARCH-03）
      - AUTH_REDIS_HOST=${AUTH_REDIS_HOST:-host.docker.internal}
      - AUTH_REDIS_PORT=${AUTH_REDIS_PORT:-16379}
      - AUTH_REDIS_PASSWORD=${AUTH_REDIS_PASSWORD:-}
      # 网关注入用户身份头（对接后端 TRUST_USER_HEADER 机制）
      - GATEWAY_USER_HEADER_ENABLED=${GATEWAY_USER_HEADER_ENABLED:-false}
      - GATEWAY_DEFAULT_USER_ID=${GATEWAY_DEFAULT_USER_ID:-}
    depends_on:
      app:
        condition: service_started
      business-service:
        condition: service_started
    networks:
      - agent-net
    restart: unless-stopped

  # ── 业务系统（Java：工单/客户/会话/审计/渠道接入）──
  business-service:
    build: ./business-service
    ports:
      - "8081:8081"
    environment:
      # 记忆库（读写：customer_service schema）
      - MEM_DB_URL=jdbc:postgresql://postgres:5432/agent_memory
      - MEM_DB_USERNAME=postgres
      - MEM_DB_PASSWORD=${PGPASSWORD:?PGPASSWORD is required}
      # 业务库（只读：订单等，数据库层强制只读）
      - BIZ_DB_URL=jdbc:postgresql://postgres:5432/agent_business
      - BIZ_DB_USERNAME=agent_readonly
      - BIZ_DB_PASSWORD=${PG_READONLY_PASSWORD:?PG_READONLY_PASSWORD is required}
      # Kafka
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # 内部调用令牌（Python AI 服务 → 业务系统内部 REST）
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-}
      # WhatsApp Cloud API（无 token 时仅收不发）
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN:-}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - agent-net
    restart: unless-stopped

  # ── 应用服务（AI 系统：RAG/Agent/LLM）──
  app:
    build: .
    ports:
      # P3（docs/auth 修复清单④）：信任边界=网络边界——app 信任网关注入的
      # 身份头（IDENTITY_SOURCE=header/strict），8000 只允许宿主机内部访问，
      # 外部流量必须走 8080 网关；对外暴露 8000 等于允许任何人伪造身份头。
      - "127.0.0.1:8000:8000"
    environment:
      # LLM
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4-flash}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      # 阿里云 DashScope（embedding/rerank/OCR 共用，EMBEDDING_API_KEY 未设时回退此值）
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      # PostgreSQL — 记忆库（读写，服务账号）
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=agent_memory
      - PGUSER=postgres
      - PGPASSWORD=${PGPASSWORD:?PGPASSWORD is required}
      # PostgreSQL — 业务库（只读账号，数据库层强制只读）
      - BUSINESS_PGDATABASE=agent_business
      - PG_READONLY_USER=agent_readonly
      - PG_READONLY_PASSWORD=${PG_READONLY_PASSWORD:?PG_READONLY_PASSWORD is required}
      # 模型
      - EMBEDDING_MODEL_PATH=${EMBEDDING_MODEL_PATH:-BAAI/bge-small-zh-v1.5}
      - RERANKER_MODEL_PATH=${RERANKER_MODEL_PATH:-BAAI/bge-reranker-base}
      # 日志
      - LOG_FORMAT=${LOG_FORMAT:-json}
      # 认证（fail-closed：未配置 API_KEY 时业务端点拒绝服务）
      - API_KEY=${API_KEY:-}
      # Redis
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - REDIS_URL=redis://redis:6379/0
      # Kafka（事件发布，默认关闭保证向后兼容）
      - KAFKA_ENABLED=${KAFKA_ENABLED:-true}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Kafka 入站消费者（WhatsApp 闭环：webhook → 本消费者 → agent.ask → ai.reply.events）
      - KAFKA_CONSUMER_ENABLED=${KAFKA_CONSUMER_ENABLED:-true}
      # 客服模块（意图路由/转人工/确认态，.env 中 CS_ENABLED 控制）
      - CS_ENABLED=${CS_ENABLED:-true}
      # 旅游域图（行程规划，.env 中 TRAVEL_ENABLED 控制；checkpointer 走
      # postgres，需 agent_memory 库已建 checkpoints 表——首次由
      # PostgresSaver.setup 自动建表）
      - TRAVEL_ENABLED=${TRAVEL_ENABLED:-true}
      - TRAVEL_CHECKPOINTER_ENABLED=${TRAVEL_CHECKPOINTER_ENABLED:-true}
      - TRAVEL_CHECKPOINTER_BACKEND=${TRAVEL_CHECKPOINTER_BACKEND:-postgres}
      - TRAVEL_CHECKPOINT_TTL_DAYS=${TRAVEL_CHECKPOINT_TTL_DAYS:-7}
      # AI 工具网关（Java business-service 经 /internal/ai/call 调用 Python 工具）
      - AI_TOOLS_ENABLED=${AI_TOOLS_ENABLED:-true}
      # 业务系统（Java）地址：cs_admin cutover 开关用
      - BUSINESS_SERVICE_URL=http://business-service:8081
      - CS_ADMIN_SOURCE=${CS_ADMIN_SOURCE:-local}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-}
      # RAG 服务化：app 走远端代理（rag-service 持有 embedding/Chroma/索引）
      - RAG_MODE=remote
      - RAG_SERVICE_URL=http://rag-service:8090
      # RAG 数据根目录指向 app_data 卷挂载点（文档注册表/Chroma/BM25/docs 全在此，
      # 与 rag-service 共享同一份数据；文档管理路由读的注册表也在这里）
      - RAG_DATA_DIR=/app/data
    volumes:
      - app_data:/app/data
      - app_cache:/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      rag-service:
        condition: service_started
    networks:
      - agent-net
    restart: unless-stopped

  # ── RAG 独立服务（重资源：embedding 模型 + Chroma + BM25 + 索引同步）──
  # 初始化含全量增量同步（可能数十分钟），readyz 就绪前 /ask 返回 503；
  # 与 app 共享 app_data 卷（索引数据原地复用，存量部署无迁移成本；
  # remote 模式下 app 不再写索引路径，实际写路径归本服务独占）；
  # 共享 app_cache 卷（embedding/reranker 模型只存一份，不重复下载）
  rag-service:
    build: .
    command: ["python", "-m", "uvicorn", "backend.services.rag_server:app", "--host", "0.0.0.0", "--port", "8090"]
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      # 强制本地模式（服务端自我代理防护，rag_server 内部还有二次校验）
      - RAG_MODE=local
      # RAG 数据根目录指向 app_data 卷（与 app 共享同一份注册表/索引/文档）
      - RAG_DATA_DIR=/app/data
      # 显式传 embedding 模型：必须与宿主机建索引用的模型一致（宿主 .env 为 text-embedding-v3），
      # 否则增量 sync 会用不同模型重嵌入全量文档
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-v3}
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4-flash}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - EMBEDDING_MODEL_PATH=${EMBEDDING_MODEL_PATH:-BAAI/bge-small-zh-v1.5}
      - RERANKER_MODEL_PATH=${RERANKER_MODEL_PATH:-BAAI/bge-reranker-base}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    volumes:
      - app_data:/app/data
      - app_cache:/app/.cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/healthz"]
      # liveness 只看进程；就绪状态看 /readyz（app 侧 fail-fast + 重试）
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5m
    networks:
      - agent-net
    restart: unless-stopped

  # ── 标准 MCP 协议服务（streamable HTTP，供 Claude/Cursor 等外部 client）──
  # 工具执行复用 MCPServer.call_tool；RAG 工具经代理转发 rag-service（不重复
  # 加载 embedding/Chroma）；鉴权沿用全局 API_KEY（X-API-Key，fail-closed）
  mcp-service:
    build: .
    command: ["python", "-m", "uvicorn", "mcp_servers.protocol_app:app", "--host", "0.0.0.0", "--port", "8091"]
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      # RAG 走远端：本进程不加载索引（rag-service 才是索引单点）
      - RAG_MODE=remote
      - RAG_SERVICE_URL=http://rag-service:8090
      # 鉴权（fail-closed：未配置时拒绝所有 MCP 调用）
      - API_KEY=${API_KEY:-}
      # DNS rebinding 防护白名单（只经 127.0.0.1 发布端口访问时够用；
      # 经网关/域名接入时追加对应 host，如 mcp.example.com:*）
      - MCP_ALLOWED_HOSTS=localhost:*,127.0.0.1:*
      # SQL 工具（本进程直连业务库）
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=agent_memory
      - PGUSER=postgres
      - PGPASSWORD=${PGPASSWORD:?PGPASSWORD is required}
      - BUSINESS_PGDATABASE=agent_business
      - PG_READONLY_USER=agent_readonly
      - PG_READONLY_PASSWORD=${PG_READONLY_PASSWORD:?PG_READONLY_PASSWORD is required}
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4-flash}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    volumes:
      - app_data:/app/data
    depends_on:
      rag-service:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - agent-net
    restart: unless-stopped

  # ── PostgreSQL + pgvector ──
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=agent_memory
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${PGPASSWORD:?PGPASSWORD is required}
    # 不对外暴露端口（默认）。本地调试时取消注释：
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # 首次初始化：建业务库 + schema + 种子 + 只读角色（仅空卷时执行）
      - ./docker/init-dbs.sh:/docker-entrypoint-initdb.d/10-init-dbs.sh:ro
      - ./backend/sql/migrations:/docker-migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_memory"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agent-net
    restart: unless-stopped

  # ── Kafka（事件总线，KRaft 单节点）──
  kafka:
    image: apache/kafka:3.7.0
    ports:
      # 外部监听器供宿主机开发调试（Python/Java 本地运行时用）
      - "127.0.0.1:9094:9094"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    volumes:
      - kafka_data:/opt/kafka/data
    networks:
      - agent-net
    restart: unless-stopped

  # ── Ollama（可选，本地模型）──
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # ── Prometheus（指标抓取 + 告警，可选）──
  # 启动：docker compose --profile observability up -d prometheus grafana
  # UI: http://localhost:9090（查询 recording rules：chat:qps:rate5m 等）
  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus-alert-rules.yml:/etc/prometheus/prometheus-alert-rules.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      # Linux 宿主机也能解析 host.docker.internal（Docker Desktop 自带该解析）
      - "host.docker.internal:host-gateway"
    networks:
      - agent-net
    restart: unless-stopped

  # ── Grafana（看板，可选；数据源自动装配指向 prometheus）──
  # UI: http://localhost:3001（默认 admin/admin，GRAFANA_PASSWORD 可覆盖）
  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - agent-net
    restart: unless-stopped

  # ── Redis（缓存/限流/异步队列）──
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agent-net
    restart: unless-stopped

volumes:
  app_data:
  app_cache:
  pg_data:
  ollama_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:
