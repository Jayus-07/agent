# Agent Platform — 一键启动全家桶
#
#   docker compose up -d          # 启动全部服务
#   docker compose logs -f app    # 查看应用日志
#   docker compose down           # 停止
#
# P1-12 生产化改动：
#   - PostgreSQL 不再对外暴露端口（仅容器网络内可达）；
#     如需本地调试，取消下方 postgres.ports 注释（仅绑 127.0.0.1）
#   - 应用业务库查询走 agent_readonly 只读账号（数据库层只读防线）
#   - 首次启动由 docker/init-dbs.sh 自动建库 + 建角色（幂等）
#   - PGPASSWORD / PG_READONLY_PASSWORD 必填（fail-fast，无默认弱密码）

# 微服务拆分后的统一网络
networks:
  agent-net:
    driver: bridge

services:
  # ── APISIX（Python 项目独立入口，B1 起）──
  # standalone 声明式配置（apisix/apisix.yaml 进 git，不引 Nacos/etcd）；
  # 端口绑 127.0.0.1：B1~B3 仅本机验证，B4 切流时才评估对外暴露。
  # Java SCG(8080) 原样保留，是回滚路径，二者并存互不影响。
  apisix:
    image: apache/apisix:3.13.0-debian
    container_name: agent-apisix
    ports:
      - "127.0.0.1:9080:9080"
    volumes:
      # 改路由只动 apisix/apisix.yaml，重启容器即生效（发布/回滚流程见方案 §8）
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      # standalone 声明：role=data_plane + config_provider=yaml（3.13 镜像要求显式声明）
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      # 自研认证插件（B2；源码进 Git，密钥走环境变量不落盘）
      - ./apisix/plugins:/usr/local/apisix/custom_plugins/apisix/plugins:ro
    environment:
      # 认证模式：默认 enforce（fail-closed）。灰度已完成（.env 曾设 shadow→enforce），
      # 需要临时回观测时在 .env 显式设 GATEWAY_AUTH_MODE=shadow
      - GATEWAY_AUTH_MODE=${GATEWAY_AUTH_MODE:-enforce}
      # JWT 验签（与 Java auth-service 同源；值来自 .env，禁止写入本文件）
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_SECRET_PREVIOUS=${JWT_SECRET_PREVIOUS:-}
      - JWT_ISSUER=${JWT_ISSUER:-agent-platform}
      # Redis 黑名单（只读 oa-auth-redis，写侧归 auth-service）
      - AUTH_REDIS_HOST=${AUTH_REDIS_HOST:-redis}
      - AUTH_REDIS_PORT=${AUTH_REDIS_PORT:-6379}
      - AUTH_REDIS_PASSWORD=${AUTH_REDIS_PASSWORD:-}
    # 注意：不要加 extra_hosts host-gateway —— Docker Desktop (Windows) 自带的
    # host.docker.internal 才能到达宿主机 loopback 服务（8000/8006）；
    # host-gateway 指向 VM 网关，loopback 服务不可达（B1 实测 502）。
    networks:
      - agent-net
    restart: unless-stopped

  # ── API Gateway（Spring Cloud Gateway，统一入口）──
  # ── 应用服务（AI 系统：RAG/Agent/LLM）──
  app:
    build: .
    ports:
      # P3（docs/auth 修复清单④）：信任边界=网络边界——app 信任网关注入的
      # 身份头（IDENTITY_SOURCE=header/strict），8000 只允许宿主机内部访问，
      # 外部流量必须走 8080 网关；对外暴露 8000 等于允许任何人伪造身份头。
      - "127.0.0.1:8000:8000"
    # 环境变量来源（2026-09-15 固化）：.env 全量注入。
    # 显式 environment 条目优先级更高——列表中的容器内地址（PGHOST=postgres、
    # REDIS_URL=redis://...）不会被 .env 的宿主值覆盖。
      # 模型供应商、Base URL、模型名与凭据统一从数据库注册表读取；这里只保留
      # 容器网络、数据库、队列和本地推理等基础设施配置。
    env_file:
      - .env
    environment:
      # LLM 供应商配置不从 env 注入，统一由数据库注册表提供。
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      # 开发环境默认全量走级联；生产请通过环境变量显式设置 1/10/50/100。
      - METADATA_CASCADE_ENABLED=${METADATA_CASCADE_ENABLED:-true}
      - METADATA_CASCADE_ROLLOUT_PERCENT=${METADATA_CASCADE_ROLLOUT_PERCENT:-100}
      - METADATA_CLASSIFIER_ENABLED=${METADATA_CLASSIFIER_ENABLED:-false}
      - METADATA_CLASSIFIER_MODEL_PATH=${METADATA_CLASSIFIER_MODEL_PATH:-/app/data/models/metadata_lr/lr_model_dryrun.joblib}
      # 开发阶段关闭影子，避免额外 Embedding 成本；生产观察期显式打开。
      - METADATA_CASCADE_SHADOW_ENABLED=${METADATA_CASCADE_SHADOW_ENABLED:-false}
      - METADATA_SHADOW_QUEUE_ENABLED=${METADATA_SHADOW_QUEUE_ENABLED:-false}
      # PostgreSQL — 记忆库（读写，服务账号）
      - PGHOST=postgres
      # 向量库后端开关（chroma|pgvector，透传 .env；默认 chroma 零变化）
      - PGPORT=5432
      - PGDATABASE=agent_memory
      - PGUSER=postgres
      - PGPASSWORD=${PGPASSWORD:?PGPASSWORD is required}
      # PostgreSQL — 业务库（只读账号，数据库层强制只读）
      - BUSINESS_PGDATABASE=agent_business
      - PG_READONLY_USER=agent_readonly
      - PG_READONLY_PASSWORD=${PG_READONLY_PASSWORD:?PG_READONLY_PASSWORD is required}
      # 模型
      - EMBEDDING_MODEL_PATH=${EMBEDDING_MODEL_PATH:-BAAI/bge-small-zh-v1.5}
      - RERANKER_MODEL_PATH=${RERANKER_MODEL_PATH:-BAAI/bge-reranker-base}
      # 日志
      - LOG_FORMAT=${LOG_FORMAT:-json}
      # 认证（fail-closed：未配置 API_KEY 时业务端点拒绝服务）
      - API_KEY=${API_KEY:-}
      # 身份来源：只认网关验签后注入的身份头（默认 header；生产禁 legacy 由
      # backend/config/startup.py 启动校验强制）。9000 外任何直连 8000 的
      # 流量一律按 guest 处理
      - IDENTITY_SOURCE=${IDENTITY_SOURCE:-header}
      # 网关安全页数据源（/observability/gateway-auth 只读代理）。prometheus 属
      # observability profile：未启动时该路由返回 available=false，前端显式降级
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://prometheus:9090}
      # Redis
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - REDIS_URL=redis://redis:6379/0
      # Celery（broker/result 分库：/1 队列，/2 结果，避免键冲突）
      # 显式注入容器内地址，优先级高于 .env 的宿主值（与 REDIS_URL 同策略）
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # Kafka（事件发布，默认关闭；需要 WhatsApp/Java 闭环时在 .env 设 true）
      - KAFKA_ENABLED=${KAFKA_ENABLED:-false}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Kafka 入站消费者（WhatsApp 闭环：webhook → 本消费者 → agent.ask → ai.reply.events）
      - KAFKA_CONSUMER_ENABLED=${KAFKA_CONSUMER_ENABLED:-false}
      # 客服模块（意图路由/转人工/确认态，.env 中 CS_ENABLED 控制）
      - CS_ENABLED=${CS_ENABLED:-true}
      # 客服演示沙盒（2026-09-17）：开启后业务查询身份映射为演示客户
      # 99001，配合 demo_sandbox.sql 的 DEMO- 前缀数据走完整客服流程；
      # 设 CS_DEMO_MODE=false 回到真实身份与真实数据
      - CS_DEMO_MODE=${CS_DEMO_MODE:-true}
      - CS_DEMO_CUSTOMER_ID=${CS_DEMO_CUSTOMER_ID:-99001}
      # 旅游域图（行程规划，.env 中 TRAVEL_ENABLED 控制；checkpointer 走
      # postgres，需 agent_memory 库已建 checkpoints 表——首次由
      # PostgresSaver.setup 自动建表）
      - TRAVEL_ENABLED=${TRAVEL_ENABLED:-true}
      - TRAVEL_CHECKPOINTER_ENABLED=${TRAVEL_CHECKPOINTER_ENABLED:-true}
      - TRAVEL_CHECKPOINTER_BACKEND=${TRAVEL_CHECKPOINTER_BACKEND:-postgres}
      - TRAVEL_CHECKPOINT_TTL_DAYS=${TRAVEL_CHECKPOINT_TTL_DAYS:-7}
      # AI 工具网关（唯一保留的 Java 侧联系：Java 客服系统经 /internal/ai/call 调用 Python 工具）
      - AI_TOOLS_ENABLED=${AI_TOOLS_ENABLED:-true}
      # 业务系统（Java）地址：cs_admin cutover 开关用——项目拆分后 Java 容器已移出
      # 本 compose；除非 Java 侧自行恢复容器并接入网络，否则保持 CS_ADMIN_SOURCE=local
      - BUSINESS_SERVICE_URL=${BUSINESS_SERVICE_URL:-}
      - CS_ADMIN_SOURCE=${CS_ADMIN_SOURCE:-local}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-}
      # RAG 服务化：app 走远端代理（rag-service 持有 embedding/Chroma/索引）
      - RAG_MODE=remote
      - RAG_SERVICE_URL=http://rag-service:8090
      # RAG 数据根目录指向 app_data 卷挂载点（文档注册表/Chroma/BM25/docs 全在此，
      # 与 rag-service 共享同一份数据；文档管理路由读的注册表也在这里）
      - RAG_DATA_DIR=/app/data
    volumes:
      - app_data:/app/data
      - app_cache:/app/.cache
    # 健康检查统一在 compose 定义（镜像级 HEALTHCHECK 已从 Dockerfile 移除——
    # 它写死 8000 端口，对同镜像的非 8000 服务是永久 unhealthy 陷阱）
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # kafka 依赖已移除：项目拆分后 Kafka 归 Java 闭环（profiles: java-loop），
      # py 侧 KAFKA_ENABLED=false 不消费
      rag-service:
        condition: service_started
    networks:
      - agent-net
    restart: unless-stopped

  # ── RAG 独立服务（重资源：embedding 模型 + Chroma + BM25 + 索引同步）──
  # 初始化含全量增量同步（可能数十分钟），readyz 就绪前 /ask 返回 503；
  # 与 app 共享 app_data 卷（索引数据原地复用，存量部署无迁移成本；
  # remote 模式下 app 不再写索引路径，实际写路径归本服务独占）；
  # 共享 app_cache 卷（embedding/reranker 模型只存一份，不重复下载）
  rag-service:
    build: .
    command: ["python", "-m", "uvicorn", "backend.services.rag_server:app", "--host", "0.0.0.0", "--port", "8090"]
    ports:
      - "127.0.0.1:8090:8090"
    env_file:
      - .env
    environment:
      # 强制本地模式（服务端自我代理防护，rag_server 内部还有二次校验）
      - RAG_MODE=local
      # PostgreSQL：memory 会话/索引注册需要（缺 PGHOST 会连容器内 localhost:5432 失败）。
      # env_file 注入的是宿主值 localhost，故此处必须显式覆盖为容器网络别名。
      - PGHOST=postgres
      - PGPORT=5432
      # 向量库后端开关（chroma|pgvector；env_file 已透传，此处显式声明默认值）
      - PGDATABASE=agent_memory
      - PGUSER=postgres
      - PGPASSWORD=${PGPASSWORD:?PGPASSWORD is required}
      # RAG 数据根目录指向 app_data 卷（与 app 共享同一份注册表/索引/文档）
      - RAG_DATA_DIR=/app/data
      # 向量/重排/生成模型及凭据由数据库注册表提供；本地模型路径仍由 env 注入。
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - EMBEDDING_MODEL_PATH=${EMBEDDING_MODEL_PATH:-BAAI/bge-small-zh-v1.5}
      - RERANKER_MODEL_PATH=${RERANKER_MODEL_PATH:-BAAI/bge-reranker-base}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    volumes:
      - app_data:/app/data
      - app_cache:/app/.cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/healthz"]
      # liveness 只看进程；就绪状态看 /readyz（app 侧 fail-fast + 重试）
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5m
    networks:
      - agent-net
    restart: unless-stopped

  # ── 标准 MCP 协议服务（streamable HTTP，供 Claude/Cursor 等外部 client）──
  # 工具执行复用 MCPServer.call_tool；RAG 工具经代理转发 rag-service（不重复
  # 加载 embedding/Chroma）；鉴权沿用全局 API_KEY（X-API-Key，fail-closed）
  mcp-service:
    build: .
    command: ["python", "-m", "uvicorn", "mcp_servers.protocol_app:app", "--host", "0.0.0.0", "--port", "8091"]
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      # RAG 走远端：本进程不加载索引（rag-service 才是索引单点）
      - RAG_MODE=remote
      - RAG_SERVICE_URL=http://rag-service:8090
      # 鉴权（fail-closed：未配置时拒绝所有 MCP 调用）
      - API_KEY=${API_KEY:-}
      # DNS rebinding 防护白名单（只经 127.0.0.1 发布端口访问时够用；
      # 经网关/域名接入时追加对应 host，如 mcp.example.com:*）
      - MCP_ALLOWED_HOSTS=localhost:*,127.0.0.1:*
      # SQL 工具（本进程直连业务库）
      - PGHOST=postgres
      - PGPORT=5432
      # 向量库后端开关（chroma|pgvector；env_file 已透传，此处显式声明默认值）
      - PGDATABASE=agent_memory
      - PGUSER=postgres
      - PGPASSWORD=${PGPASSWORD:?PGPASSWORD is required}
      - BUSINESS_PGDATABASE=agent_business
      - PG_READONLY_USER=agent_readonly
      - PG_READONLY_PASSWORD=${PG_READONLY_PASSWORD:?PG_READONLY_PASSWORD is required}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    volumes:
      - app_data:/app/data
    # 覆盖镜像级 HEALTHCHECK（Dockerfile 写死 8000，本服务监听 8091，
    # 不覆盖会永远 unhealthy——与 rag-service 同款修正）
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8091/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      rag-service:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - agent-net
    restart: unless-stopped

  # ── Celery Worker（异步任务执行，独立于 API 进程水平扩展）──
  # 与 app 共用同一镜像；只消费 agent/rag_index 队列（task_routes 固定路由）。
  # 纵向扩并发用 CELERY_WORKER_CONCURRENCY，横向扩 = 起多个本服务副本。
  # agent 执行需要 LLM/PG checkpoint/RAG(远端)：LLM key 来自 env_file(.env)，
  # 容器内地址（PG/Redis/RAG/Ollama）在此显式覆盖。
  worker:
    build: .
    command:
      ["celery", "-A", "backend.workers.agent_worker", "worker",
       "--loglevel=info", "-Q", "agent,rag_index",
       "--concurrency=${CELERY_WORKER_CONCURRENCY:-4}",
       "-n", "agent-worker@%h"]
    env_file:
      - .env
    environment:
      # Celery：broker db1 / result db2（与 app 注入保持一致）
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # 控制面（取消/暂停标志、事件 pub/sub 走业务 db0）
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379/0
      # PostgreSQL — 任务状态权威（agent_memory.tasks）+ LangGraph checkpoint
      - PGHOST=postgres
      - PGPORT=5432
      # 向量库后端开关（chroma|pgvector；env_file 已透传，此处显式声明默认值）
      - PGDATABASE=agent_memory
      - PGUSER=postgres
      - PGPASSWORD=${PGPASSWORD:?PGPASSWORD is required}
      - TRAVEL_CHECKPOINTER_ENABLED=${TRAVEL_CHECKPOINTER_ENABLED:-true}
      - TRAVEL_CHECKPOINTER_BACKEND=${TRAVEL_CHECKPOINTER_BACKEND:-postgres}
      - TRAVEL_CHECKPOINT_TTL_DAYS=${TRAVEL_CHECKPOINT_TTL_DAYS:-7}
      # LLM / 模型供应商配置由数据库注册表提供。
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      # 与 app 保持同一元数据灰度指针；设 false/0 可立即回退主索引。
      - METADATA_CASCADE_ENABLED=${METADATA_CASCADE_ENABLED:-true}
      - METADATA_CASCADE_ROLLOUT_PERCENT=${METADATA_CASCADE_ROLLOUT_PERCENT:-100}
      - METADATA_CLASSIFIER_ENABLED=${METADATA_CLASSIFIER_ENABLED:-false}
      - METADATA_CLASSIFIER_MODEL_PATH=${METADATA_CLASSIFIER_MODEL_PATH:-/app/data/models/metadata_lr/lr_model_dryrun.joblib}
      - METADATA_CASCADE_SHADOW_ENABLED=${METADATA_CASCADE_SHADOW_ENABLED:-false}
      - METADATA_SHADOW_QUEUE_ENABLED=${METADATA_SHADOW_QUEUE_ENABLED:-false}
      - EMBEDDING_MODEL_PATH=${EMBEDDING_MODEL_PATH:-BAAI/bge-small-zh-v1.5}
      - RERANKER_MODEL_PATH=${RERANKER_MODEL_PATH:-BAAI/bge-reranker-base}
      # 索引执行体必须在本地：Celery worker 消费 rag_index 队列跑上传索引，
      # RAG_MODE=remote 下 RAGPipeline 是 ask/retrieve 代理（索引管理面被
      # client.py 明确拒绝），reindex_file 无法执行。改为 local 直接加载
      # 索引资源（bge 模型在共享 app_cache 卷内），写共享 app_data 存储
      # （与 rag-service 同卷）；ask/retrieve 仍由 rag-service 承担。
      - RAG_MODE=local
      - RAG_SERVICE_URL=http://rag-service:8090
      - RAG_DATA_DIR=/app/data
      - LOG_FORMAT=${LOG_FORMAT:-json}
    volumes:
      - app_data:/app/data
      - app_cache:/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rag-service:
        condition: service_started
    # 存活判定：向本容器节点发 inspect ping（default 节点名 celery@<hostname>，
    # -n agent-worker@%h 时节点名为 agent-worker@<hostname>）。
    # $$ 为 compose 转义 → 运行时由 shell 展开 hostname。
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.workers.agent_worker inspect ping -d agent-worker@$$(hostname) --timeout 10 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    networks:
      - agent-net
    restart: unless-stopped

  # ── 元数据影子 Worker（独立队列/并发/故障域）────────────────
  # 影子任务只消费 rag_metadata_shadow；不能并入主 worker，否则影子积压会
  # 抢占 agent/rag_index 槽位，破坏主索引的高并发隔离。
  metadata-shadow-worker:
    build: .
    command:
      ["celery", "-A", "backend.workers.agent_worker", "worker",
       "--loglevel=info", "-Q", "${CELERY_METADATA_SHADOW_QUEUE:-rag_metadata_shadow}",
       "--concurrency=${METADATA_SHADOW_WORKER_CONCURRENCY:-2}",
       "-n", "metadata-shadow-worker@%h"]
    env_file:
      - .env
    environment:
      # broker/result 与主 worker 一致；影子任务只传 job_id，不把正文塞进 Redis broker。
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CELERY_METADATA_SHADOW_QUEUE=${CELERY_METADATA_SHADOW_QUEUE:-rag_metadata_shadow}
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379/0
      # 影子任务需要 PG 读取 job/input 状态；显式覆盖宿主机地址。
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=agent_memory
      - PGUSER=postgres
      - PGPASSWORD=${PGPASSWORD:?PGPASSWORD is required}
      # embedding 在影子 worker 本地加载，使用共享模型缓存；不依赖 rag-service。
      - RAG_MODE=local
      - RAG_DATA_DIR=/app/data
      - EMBEDDING_MODEL_PATH=${EMBEDDING_MODEL_PATH:-BAAI/bge-small-zh-v1.5}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    volumes:
      - app_data:/app/data
      - app_cache:/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.workers.agent_worker inspect ping -d metadata-shadow-worker@$$(hostname) --timeout 10 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    networks:
      - agent-net
    restart: unless-stopped

  # ── PostgreSQL + pgvector ──
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=agent_memory
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${PGPASSWORD:?PGPASSWORD is required}
    # 本地调试/迁移脚本通道：绑 127.0.0.1:5433（宿主机 5432 被本机原生 PG 占用）
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # 首次初始化：建业务库 + schema + 种子 + 只读角色（仅空卷时执行）
      - ./docker/init-dbs.sh:/docker-entrypoint-initdb.d/10-init-dbs.sh:ro
      - ./backend/sql/migrations:/docker-migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_memory"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agent-net
    restart: unless-stopped

  # ── Kafka（事件总线，KRaft 单节点）──
  # kafka：仅 Java 客服闭环使用（py 侧 KAFKA_ENABLED=false）——默认不随 up 启动
  kafka:
    profiles: ["java-loop"]
    image: apache/kafka:3.7.0
    ports:
      # 外部监听器供宿主机开发调试（Python/Java 本地运行时用）
      - "127.0.0.1:9094:9094"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    volumes:
      - kafka_data:/opt/kafka/data
    networks:
      - agent-net
    restart: unless-stopped

  # ── Ollama（可选，本地模型）──
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # ── Prometheus（指标抓取 + 告警，可选）──
  # 启动：docker compose --profile observability up -d prometheus grafana
  # UI: http://localhost:9090（查询 recording rules：chat:qps:rate5m 等）
  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus-alert-rules.yml:/etc/prometheus/prometheus-alert-rules.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      # Linux 宿主机也能解析 host.docker.internal（Docker Desktop 自带该解析）
      - "host.docker.internal:host-gateway"
    networks:
      - agent-net
    restart: unless-stopped

  # ── Grafana（看板，可选；数据源自动装配指向 prometheus）──
  # UI: http://localhost:3001（默认 admin/admin，GRAFANA_PASSWORD 可覆盖）
  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - agent-net
    restart: unless-stopped

  # ── Redis exporter（observability profile；redis:6379 → :9121/metrics）──
  redis-exporter:
    image: oliver006/redis_exporter:latest
    profiles: ["observability"]
    environment:
      - REDIS_ADDR=redis://redis:6379
    networks:
      - agent-net
    restart: unless-stopped

  # ── PostgreSQL exporter（observability profile；agent_memory → :9187/metrics）──
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    profiles: ["observability"]
    environment:
      # 仅监控账号只读查询；密码与 postgres 超管同源（本地单机部署，够用）
      - DATA_SOURCE_NAME=postgresql://postgres:${PGPASSWORD:?PGPASSWORD is required}@postgres:5432/agent_memory?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agent-net
    restart: unless-stopped

  # ── Celery exporter（observability profile；消费 worker 事件流 → :9808/metrics）──
  # 指标：celery_worker_up / celery_queue_length / celery_task_{sent,succeeded,
  # failed,retried}_total / celery_task_runtime_seconds。事件流开关已在
  # celery_app.conf 打开（worker_send_task_events / task_send_sent_event）。
  celery-exporter:
    image: danihodovic/celery-exporter:latest
    profiles: ["observability"]
    command: ["--broker-url=redis://redis:6379/1"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agent-net
    restart: unless-stopped

  # ── Redis（缓存/限流/异步队列）──
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agent-net
    restart: unless-stopped

volumes:
  app_data:
  app_cache:
  pg_data:
  ollama_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:
