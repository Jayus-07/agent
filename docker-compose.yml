# Agent Platform — 一键启动全家桶
#
#   docker compose up -d          # 启动全部服务
#   docker compose logs -f app    # 查看应用日志
#   docker compose down           # 停止
#
# P1-12 生产化改动：
#   - PostgreSQL 不再对外暴露端口（仅容器网络内可达）；
#     如需本地调试，取消下方 postgres.ports 注释（仅绑 127.0.0.1）
#   - 应用业务库查询走 agent_readonly 只读账号（数据库层只读防线）
#   - 首次启动由 db-migrate（one-shot）统一跑 scripts/init_db.py 建库建表
#     （2026-09-21 起废弃 init-dbs.sh 手抄清单，迁移事实源唯一化）
#   - PGPASSWORD / PG_READONLY_PASSWORD 必填（fail-fast，无默认弱密码）

# 微服务拆分后的统一网络
networks:
  agent-net:
    driver: bridge

# ── Build Identity 锚（Platform Readiness STOP B1）──────────────
# 所有代码承载服务共用：构建时注入 git commit / 构建时间（启动日志与
# /health 回读）。发布脚本（scripts/release.sh / release checklist）负责
# export GIT_COMMIT=$(git rev-parse --short HEAD)；未设置时 unknown——
# 「运行容器不知道自己是哪个 commit」即视为发布流程违规（A8/P1-17）。
x-build: &build
  context: .
  args:
    GIT_COMMIT: ${GIT_COMMIT:-unknown}
    BUILD_TIME: ${BUILD_TIME:-unknown}
    DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
    RUNTIME_DEBIAN_MIRROR: ${RUNTIME_DEBIAN_MIRROR:-${DEBIAN_MIRROR:-}}
    PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    TORCH_CPU_INDEX_URL: ${TORCH_CPU_INDEX_URL:-https://download.pytorch.org/whl/cpu}


services:
  # ── APISIX（Python 项目独立入口，B1 起）──
  # standalone 声明式配置（apisix/apisix.yaml 进 git，不引 Nacos/etcd）；
  # 端口绑 127.0.0.1：B1~B3 仅本机验证，B4 切流时才评估对外暴露。
  # Java SCG(8080) 原样保留，是回滚路径，二者并存互不影响。
  apisix:
    image: apache/apisix:3.13.0-debian
    container_name: agent-apisix
    ports:
      - "127.0.0.1:9080:9080"
    volumes:
      # 改路由只动 apisix/apisix.yaml，重启容器即生效（发布/回滚流程见方案 §8）
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      # standalone 声明：role=data_plane + config_provider=yaml（3.13 镜像要求显式声明）
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      # 自研认证插件（B2；源码进 Git，密钥走环境变量不落盘）
      - ./apisix/plugins:/usr/local/apisix/custom_plugins/apisix/plugins:ro
    environment:
      # 认证模式：默认 enforce（fail-closed）。灰度已完成（.env 曾设 shadow→enforce），
      # 需要临时回观测时在 .env 显式设 GATEWAY_AUTH_MODE=shadow
      - GATEWAY_AUTH_MODE=${GATEWAY_AUTH_MODE:-enforce}
      # 会话闸（方案 A）：off/audit/enforce，默认 enforce（2026-09-22 切入，
      # 与后端 JWT_SESSION_GUARD_MODE 同语义双层；回滚 = .env 改回 audit 后重建本服务）
      - GATEWAY_SESSION_CHECK=${GATEWAY_SESSION_CHECK:-enforce}
      # JWT 验签（与 Java auth-service 同源；值来自 .env，禁止写入本文件）
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_SECRET_PREVIOUS=${JWT_SECRET_PREVIOUS:-}
      - JWT_ISSUER=${JWT_ISSUER:-agent-platform}
      # Redis 黑名单（只读独立 auth-redis，写侧归本地 auth 路由）
      # B1：实例启用 requirepass 后，未显式配 AUTH_REDIS_PASSWORD 时
      # 回退 REDIS_PASSWORD（Java 写侧需同步同密码，见 .env 注释）
      - AUTH_REDIS_HOST=${AUTH_REDIS_HOST:-auth-redis}
      - AUTH_REDIS_PORT=${AUTH_REDIS_PORT:-6379}
      - AUTH_REDIS_PASSWORD=${AUTH_REDIS_PASSWORD:-${REDIS_PASSWORD:-}}
    depends_on:
      auth-redis:
        condition: service_healthy
    # 注意：不要加 extra_hosts host-gateway —— Docker Desktop (Windows) 自带的
    # host.docker.internal 才能到达宿主机 loopback 服务（8000/8006）；
    # host-gateway 指向 VM 网关，loopback 服务不可达（B1 实测 502）。
    networks:
      - agent-net
    restart: unless-stopped

  # ── 单容器后端（2026-10-20 后端容器合一）────────────────────
  # app / rag-service / mcp-service 三个 uvicorn + 四个 Celery 队列池 +
  # beat + 双 cs-dispatcher 全部跑在同一个容器里，由 supervisord 托管
  # （进程清单与端口分配见 docker/backend-supervisord.conf；镜像仍是
  # 同一份构建，db-migrate / business-mock 继续复用）。
  #
  # 兼容性：网络别名保留 app / rag-service / mcp-service 三个旧 DNS 名——
  # APISIX 上游（app:8000）、Prometheus 抓取目标、.env 的
  # RAG_SERVICE_URL 全部零改动；进程间 RAG 调用走容器内回环 127.0.0.1。
  #
  # 日常运维：
  #   改后端代码后:  docker compose ... up -d --build backend   （重建+重启一气呵成）
  #   进程总览:      docker exec agent-backend supervisorctl status
  #   单进程日志:    docker exec agent-backend supervisorctl tail -f app
  #   只重启某进程:  docker exec agent-backend supervisorctl restart agent-worker
  #
  # 注意：本服务必须单副本——beat 多副本会重复调度周期任务，
  # cs-dispatcher 双实例已在容器内用显式实例名区分心跳。
  backend:
    build: *build
    container_name: agent-backend
    ports:
      # 信任边界与拆分版一致（P3）：8000 只绑宿主机回环，外部流量必须走
      # 9080 网关；对外暴露 8000 等于允许伪造身份头。8090/8091 仅本机调试。
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8090:8090"
      - "127.0.0.1:8091:8091"
    # 环境变量来源（2026-09-15 固化口径不变）：.env 全量注入；显式
    # environment 优先级更高——容器内地址（PGHOST=postgres 等）不会被
    # .env 的宿主值覆盖。原 app / rag-service / mcp-service / 各 worker
    # 的差异变量在此取并集；进程级差异（RAG_MODE、指标端口、dispatcher
    # 实例名）下沉到 supervisord 的 program environment。
    env_file:
      - .env
    environment:
      # ── PostgreSQL：记忆库（读写）+ 业务库（只读账号）──
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=agent_memory
      - PGUSER=postgres
      - PGPASSWORD=${PGPASSWORD:?PGPASSWORD is required}
      - BUSINESS_PGDATABASE=agent_business
      - PG_READONLY_USER=agent_readonly
      - PG_READONLY_PASSWORD=${PG_READONLY_PASSWORD:?PG_READONLY_PASSWORD is required}
      # ── Redis：缓存/控制面 db0 + 认证控制面 + Celery broker/result ──
      # broker/result 拆独立 redis-broker（noeviction+AOF），未 ack 任务
      # 消息与结果永不被逐出
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - AUTH_REDIS_ENABLED=${AUTH_REDIS_ENABLED:-true}
      - AUTH_REDIS_URL=redis://:${AUTH_REDIS_PASSWORD:-${REDIS_PASSWORD:-}}@${AUTH_REDIS_HOST:-auth-redis}:${AUTH_REDIS_PORT:-6379}/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-}@redis-broker:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-}@redis-broker:6379/2
      # ── RAG：容器默认 local（rag-service 进程与索引执行体口径）；
      # app / mcp 两个进程在 supervisord 里覆盖为 remote，走容器内
      # 127.0.0.1:8090，不再经网络别名绕行
      - RAG_MODE=local
      - RAG_SERVICE_URL=http://127.0.0.1:8090
      # 重索引任务化：提交进 rag_index 队列由 rag-index-worker 执行
      - RAG_REINDEX_ASYNC_ENABLED=true
      # RAG 数据根（文档注册表/索引/docs 全在 app_data 卷，进程间共享）
      - RAG_DATA_DIR=/app/data
      # ── 模型路径与本地推理（模型/凭据事实源仍是数据库注册表）──
      - EMBEDDING_MODEL_PATH=${EMBEDDING_MODEL_PATH:-BAAI/bge-small-zh-v1.5}
      - RERANKER_MODEL_PATH=${RERANKER_MODEL_PATH:-BAAI/bge-reranker-base}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      # ── 元数据级联灰度（API 进程与 Celery 池共用同一指针）──
      - METADATA_CASCADE_ENABLED=${METADATA_CASCADE_ENABLED:-false}
      - METADATA_CASCADE_ROLLOUT_PERCENT=${METADATA_CASCADE_ROLLOUT_PERCENT:-100}
      - METADATA_CLASSIFIER_ENABLED=${METADATA_CLASSIFIER_ENABLED:-false}
      - METADATA_CLASSIFIER_MODEL_PATH=${METADATA_CLASSIFIER_MODEL_PATH:-/app/data/models/metadata_lr/lr_model_dryrun.joblib}
      - METADATA_CASCADE_SHADOW_ENABLED=${METADATA_CASCADE_SHADOW_ENABLED:-false}
      - METADATA_SHADOW_QUEUE_ENABLED=${METADATA_SHADOW_QUEUE_ENABLED:-false}
      # ── 认证 / 网关信任边界 ──
      # fail-closed：未配置 API_KEY 时业务端点拒绝服务；只认网关验签后
      # 注入的身份头，直连 8000 的流量一律按 guest 处理
      - API_KEY=${API_KEY:-}
      - IDENTITY_SOURCE=${IDENTITY_SOURCE:-header}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-}
      # 分享令牌只存摘要；该独立 HMAC 密钥用于相同幂等请求重放恢复原链接
      - TRAVEL_V2_SHARE_TOKEN_SECRET=${TRAVEL_V2_SHARE_TOKEN_SECRET:-}
      # ── 网关安全页数据源（observability profile 未启动时显式降级）──
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://prometheus:9090}
      # ── 日志与告警外推（应用级降级告警通道，alerts.py 读取）──
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_WEBHOOK_TYPE=${ALERT_WEBHOOK_TYPE:-generic}
      # ── Kafka 事件总线（默认关闭；WhatsApp/Java 闭环时 .env 开启）──
      - KAFKA_ENABLED=${KAFKA_ENABLED:-false}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CONSUMER_ENABLED=${KAFKA_CONSUMER_ENABLED:-false}
      # ── 客服域（意图路由/转人工/确认态/演示沙盒/自动派单）──
      - CS_ENABLED=${CS_ENABLED:-true}
      - CS_DEMO_MODE=${CS_DEMO_MODE:-false}
      - CS_DEMO_CUSTOMER_ID=${CS_DEMO_CUSTOMER_ID:-99001}
      - CS_ADMIN_SOURCE=${CS_ADMIN_SOURCE:-local}
      - BUSINESS_SERVICE_URL=${BUSINESS_SERVICE_URL:-}
      # off | shadow | enforce：派单容器可先起，确认候选与容量后再切
      - CS_DISPATCH_MODE=${CS_DISPATCH_MODE:-off}
      - CS_OFFER_TIMEOUT_SECONDS=${CS_OFFER_TIMEOUT_SECONDS:-30}
      - CS_MAX_DISPATCH_ATTEMPTS=${CS_MAX_DISPATCH_ATTEMPTS:-3}
      - CS_HANDOFF_TIMEOUT_SECONDS=${CS_HANDOFF_TIMEOUT_SECONDS:-120}
      - CS_DISPATCH_INTERVAL_SECONDS=${CS_DISPATCH_INTERVAL_SECONDS:-1.0}
      - CS_DISPATCHER_HEARTBEAT_TTL_SECONDS=${CS_DISPATCHER_HEARTBEAT_TTL_SECONDS:-30}
      # ── 旅游域图（checkpointer 走 postgres，表由 PostgresSaver 自建）──
      - TRAVEL_ENABLED=${TRAVEL_ENABLED:-true}
      - TRAVEL_CHECKPOINTER_ENABLED=${TRAVEL_CHECKPOINTER_ENABLED:-true}
      - TRAVEL_CHECKPOINTER_BACKEND=${TRAVEL_CHECKPOINTER_BACKEND:-postgres}
      - TRAVEL_CHECKPOINT_TTL_DAYS=${TRAVEL_CHECKPOINT_TTL_DAYS:-7}
      # 旅游独立入口跨副本 admission：Redis 不可用时 fail-closed
      - TRAVEL_ADMISSION_BACKEND=${TRAVEL_ADMISSION_BACKEND:-redis}
      - TRAVEL_REQUEST_WORKERS=${TRAVEL_REQUEST_WORKERS:-16}
      - TRAVEL_REQUEST_GLOBAL_LIMIT=${TRAVEL_REQUEST_GLOBAL_LIMIT:-100}
      - TRAVEL_REQUEST_TENANT_LIMIT=${TRAVEL_REQUEST_TENANT_LIMIT:-32}
      - TRAVEL_REQUEST_USER_LIMIT=${TRAVEL_REQUEST_USER_LIMIT:-2}
      - TRAVEL_REQUEST_TIMEOUT_S=${TRAVEL_REQUEST_TIMEOUT_S:-50}
      # ── AI 工具网关（Java 客服经 /internal/ai/call 调用 Python 工具）──
      - AI_TOOLS_ENABLED=${AI_TOOLS_ENABLED:-true}
      # ── 副作用幂等实机验收探针（默认全关，验收窗口经 .env 开启）──
      - SIDE_EFFECT_PROBE_ENABLED=${SIDE_EFFECT_PROBE_ENABLED:-0}
      - SIDE_EFFECT_PROBE_LEASE_SECONDS=${SIDE_EFFECT_PROBE_LEASE_SECONDS:-300}
      - SIDE_EFFECT_PROBE_SLEEP_MS=${SIDE_EFFECT_PROBE_SLEEP_MS:-0}
      - SIDE_EFFECT_TEST_CRASH_AFTER_EFFECT=${SIDE_EFFECT_TEST_CRASH_AFTER_EFFECT:-0}
      - SIDE_EFFECT_TEST_CRASH_BEFORE_EFFECT=${SIDE_EFFECT_TEST_CRASH_BEFORE_EFFECT:-0}
      - SIDE_EFFECT_TEST_FAIL_ONCE=${SIDE_EFFECT_TEST_FAIL_ONCE:-0}
      # ── MCP streamable HTTP：DNS rebinding 防护白名单（经网关/域名
      # 接入时追加对应 host，如 mcp.example.com:*）──
      - MCP_ALLOWED_HOSTS=localhost:*,127.0.0.1:*
    volumes:
      - app_data:/app/data
      - app_cache:/app/.cache
      # 评测明细单一事实源（M7）：宿主 CLI 产生的 run 直接对容器可见
      - ./data/eval_runs:/app/data/eval_runs
    # 三个 HTTP 进程逐一探活：rag 用 /healthz（只看进程，就绪看 /readyz，
    # 初始化含全量增量同步时 readiness 503 但进程活着）
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health && curl -fsS http://127.0.0.1:8090/healthz && curl -fsS http://127.0.0.1:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    networks:
      agent-net:
        aliases:
          - app
          - rag-service
          - mcp-service
    restart: unless-stopped
    # B6 优雅停机：supervisor 逆序停进程（dispatcher→worker→beat→HTTP），
    # uvicorn 有 --timeout-graceful-shutdown 收尾窗口；700s 兜底 SIGKILL。
    # 注意：单容器共享一份 grace 预算（拆分版每容器各 700s），极端情况下
    # 多进程同时有超长在途请求时尾部进程可能被 SIGKILL——Celery 靠
    # acks_late 重投，HTTP 靠客户端重试。
    stop_grace_period: 700s
    deploy:
      resources:
        limits:
          memory: 6g
          cpus: "4.0"

  # ── business-service HTTP mock（批次B 联调）────────────────
  # Java business-service 未就绪期间的只读订单查询 mock，契约见
  # backend/mock/business_service/contract.md（真实服务落地时照此实现）。
  # 与 app 共用镜像（fastapi/uvicorn 已内置），仅独立进程 + 端口。
  #   - 鉴权：mock 配置 INTERNAL_API_TOKEN（与 app 相同 env 注入）时
  #     强制校验 X-Internal-Token，fail-closed。
  #   - 无任何外部依赖（不连 DB/Redis），可独立启停：
  #     docker compose up -d business-mock
  #   - 上线切换：真实 Java 服务就绪后改 BUSINESS_SERVICE_URL 指向之，
  #     本服务直接下线，无任何代码改动。
  business-mock:
    build: *build
    command:
      ["python", "-m", "uvicorn", "backend.mock.business_service.main:app",
       "--host", "0.0.0.0", "--port", "8081"]
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    healthcheck:
      test:
        ["CMD-SHELL",
         "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - agent-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=agent_memory
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${PGPASSWORD:?PGPASSWORD is required}
    # 本地调试/迁移脚本通道：绑 127.0.0.1:5433（宿主机 5432 被本机原生 PG 占用）
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # 迁移不再由 docker-entrypoint-initdb.d 手抄清单执行（postgres 容器无
      # Python，清单曾两次落后于 migrations 目录）——全部交给下方 db-migrate
      # 服务统一跑 scripts/init_db.py（自动扫描 + fail-fast 登记库归属）。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_memory"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agent-net
    restart: unless-stopped
    # H1：PG 是全平台状态权威，自身也限住（宽裕值），防其他服务拖垮宿主机后 OOM killer 误伤
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"

  # ── 数据库迁移（one-shot init container，迁移事实源唯一化）──
  # 复用 app 镜像（共享构建缓存）跑 scripts/init_db.py：自动扫描
  # backend/sql/migrations/*.sql，按 MIGRATION_TARGETS 登记归属库，幂等可重跑，
  # 撞已存在自动降级逐语句补齐。失败（rc!=0）→ 依赖它的服务全部不启动（fail-fast），
  # 杜绝「迁移残缺但服务照起」。新增迁移文件只需落进 migrations 目录并在
  # MIGRATION_TARGETS 登记一行，无需再改本文件。
  db-migrate:
    build: *build
    env_file:
      - .env
    environment:
      # 容器内地址显式注入（优先级高于 .env 的宿主值），与 app 同策略
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=${PGPASSWORD:?PGPASSWORD is required}
      - MEMORY_PGDATABASE=agent_memory
      - BUSINESS_PGDATABASE=agent_business
      # 只读角色密码对齐 init_db.py 的 verify_readonly 步骤
      - PG_READONLY_USER=agent_readonly
      - PG_READONLY_PASSWORD=${PG_READONLY_PASSWORD:?PG_READONLY_PASSWORD is required}
    command: ["python", "scripts/init_db.py"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agent-net
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ── Kafka（事件总线，KRaft 单节点）──
  # kafka：仅 Java 客服闭环使用（py 侧 KAFKA_ENABLED=false）——默认不随 up 启动
  kafka:
    profiles: ["java-loop"]
    image: apache/kafka:3.7.0
    ports:
      # 外部监听器供宿主机开发调试（Python/Java 本地运行时用）
      - "127.0.0.1:9094:9094"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    volumes:
      - kafka_data:/opt/kafka/data
    networks:
      - agent-net
    restart: unless-stopped

  # ── Ollama（可选，本地模型）──
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    ports:
      # H2（2026-09-21 审查）：唯一未收敛回环的端口 → 绑 127.0.0.1，
      # 容器网络内各服务仍走 ollama:11434 别名访问
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "4.0"

  # ── PG 自动备份（B3：每日 pg_dump + 保留策略）────────────────
  # 全仓此前零自动备份：PG 是任务状态/checkpoint/记忆库唯一权威，
  # 磁盘损坏 = 全量丢失。本服务用与 postgres 同版本镜像（pg_dump 兼容），
  # 首轮启动即备份一次，此后每 PG_BACKUP_INTERVAL_SECONDS 备份一轮，
  # 保留最近 PG_BACKUP_RETENTION_DAYS 天（脚本见 docker/pg-backup.sh）。
  # 恢复：docker/pg-backup.sh 底部注释有 pg_restore 命令。
  pg-backup:
    image: pgvector/pgvector:pg16
    container_name: agent-pg-backup
    command: ["bash", "/scripts/pg-backup.sh"]
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=${PGPASSWORD:?PGPASSWORD is required}
      - PG_BACKUP_DIR=/backups
      - PG_BACKUP_RETENTION_DAYS=${PG_BACKUP_RETENTION_DAYS:-14}
      - PG_BACKUP_INTERVAL_SECONDS=${PG_BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./docker/pg-backup.sh:/scripts/pg-backup.sh:ro
      # 备份落宿主机目录（可直接拷走做异地容灾）
      - ./backups/pg:/backups
    depends_on:
      # 首轮备份等迁移完成，避免全新部署时备份到空库
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - agent-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

  # ── Prometheus（指标抓取 + 告警，可选）──
  # 启动：docker compose --profile observability up -d prometheus grafana alertmanager
  # UI: http://localhost:9090（查询 recording rules：chat:qps:rate5m 等）
  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    # M4（2026-10-06 验收补充）：显式声明保留策略，不依赖镜像隐式默认值
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus-alert-rules.yml:/etc/prometheus/prometheus-alert-rules.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      # Linux 宿主机也能解析 host.docker.internal（Docker Desktop 自带该解析）
      - "host.docker.internal:host-gateway"
    networks:
      - agent-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  # ── Grafana（看板，可选；数据源自动装配指向 prometheus）──
  # UI: http://localhost:3001（默认 admin/admin，GRAFANA_PASSWORD 可覆盖）
  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      # UI 默认简体中文（用户可在 个人资料→偏好 各自覆盖）
      - GF_USERS_DEFAULT_LANGUAGE=zh-Hans
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - agent-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # 2026-10-07：512m 不够——运行时实测 493MiB（96.5%）贴近上限，GC 压力
          # 导致 HTTP 不响应（health 超时、页面挂起，restarts=2 同因）。调到 1g
          # 并放宽 CPU（7 张看板 + 插件后台安装的真实占用）。
          memory: 1g
          cpus: "1.0"

  # ── Alertmanager（B4：告警只响不给的触达修复，observability profile）──
  # Prometheus 40+ 条规则触发后经本服务外推：webhook receiver（generic JSON，
  # 可接自建接收端/转发桥）。URL 从 .env 的 ALERTMANAGER_WEBHOOK_URL
  # 经 sed 注入 docker/alertmanager.yml.tpl（AM 原生不支持 env 展开）。
  # ⚠️ 与应用级告警的 ALERT_WEBHOOK_URL 是**两个独立变量**：AM 的
  # webhook payload 是标准 Alertmanager JSON，钉钉/企微/飞书群机器人
  # 直连会被拒（格式不匹配）——AM 侧直推群机器人需自建转发桥
  # （读 AM webhook → 转格式）。未配置时指向 127.0.0.1:9（discard，
  # 不可达仅记发送失败日志，不崩进程）。
  # 应用级降级告警（LLM 熔断/重试耗尽等）走 app/worker 内 alerts.py 的
  # ALERT_WEBHOOK_URL，原生支持 wecom/dingtalk/feishu 格式。
  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9093:9093"
    environment:
      # 默认指向本 compose 的 alert-bridge 桥（同 profile 一起启动）；
      # 桥按 ALERT_BRIDGE_* 环境变量外推企微/飞书/钉钉，未配置时落桥日志。
      - ALERTMANAGER_WEBHOOK_URL=${ALERTMANAGER_WEBHOOK_URL:-http://alert-bridge:9094/alert}
    # alertmanager 镜像基于 busybox：sh + sed 可用。config 不能读 env →
    # 启动前用 sed 把占位符替换成真实 webhook URL 再 exec 主进程
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "sed \"s|__ALERT_WEBHOOK_URL__|${ALERTMANAGER_WEBHOOK_URL:-http://127.0.0.1:9/unset}|g\" /etc/alertmanager/alertmanager.yml.tpl > /tmp/alertmanager.yml && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager"
    volumes:
      - ./docker/alertmanager.yml.tpl:/etc/alertmanager/alertmanager.yml.tpl:ro
    depends_on:
      - prometheus
    networks:
      - agent-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  # ── Redis exporter（observability profile；redis:6379 → :9121/metrics）──
  # ── 告警外投桥（2026-10-06 验收补链：AM webhook → 企微/飞书/钉钉）──────
  # 零第三方依赖（stdlib）；ALERT_BRIDGE_* 全部可选，未配置时告警落桥日志
  # （docker logs agent-alert-bridge-1），通道在 .env 按需填入。
  alert-bridge:
    build:
      context: ./docker/alert-bridge
    image: agent-alert-bridge:latest
    profiles: ["observability"]
    ports:
      # 宿主 9095：9094 已被 kafka(java-loop) 占用，双 profile 同开时避免冲突；
      # 容器内仍 9094，AM 经服务名 http://alert-bridge:9094 访问不受影响
      - "127.0.0.1:9095:9094"
    environment:
      - ALERT_BRIDGE_WECOM_WEBHOOK=${ALERT_BRIDGE_WECOM_WEBHOOK:-}
      - ALERT_BRIDGE_FEISHU_WEBHOOK=${ALERT_BRIDGE_FEISHU_WEBHOOK:-}
      - ALERT_BRIDGE_FEISHU_SECRET=${ALERT_BRIDGE_FEISHU_SECRET:-}
      - ALERT_BRIDGE_DINGTALK_WEBHOOK=${ALERT_BRIDGE_DINGTALK_WEBHOOK:-}
      - ALERT_BRIDGE_DINGTALK_SECRET=${ALERT_BRIDGE_DINGTALK_SECRET:-}
    networks:
      - agent-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.1"

  # ── Tempo（2026-10-06：OTel 链路后端，observability profile）──────────
  # 自研 trace（PG 权威）不变；otel_exporter.py 镜像出口经 OTLP HTTP 4318
  # 推送到此，Grafana 里看 span 瀑布 / TraceQL 检索。镜像数据仅供排障
  # （7 天保留），权威审计仍在自研 trace → PG。
  tempo:
    image: grafana/tempo:latest
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      # 宿主 13200：3200 是 frontend-admin（devctl）端口，错位避免冲突
      - "127.0.0.1:13200:3200"
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    networks:
      - agent-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "0.5"

  # ── Loki（容器 stdout 日志聚合，observability profile）───────────────
  # promtail 采集 compose 容器日志（app 需 LOG_FORMAT=json，行自带
  # trace_id）；Tempo span → Loki 日志互跳见 grafana provisioning。
  loki:
    image: grafana/loki:latest
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      # 宿主 13100：3100 是 frontend（devctl）端口，错位避免冲突
      - "127.0.0.1:13100:3100"
    volumes:
      - ./docker/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - agent-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ── Promtail（Loki 采集器：docker socket 发现本 compose 容器）────────
  promtail:
    image: grafana/promtail:latest
    profiles: ["observability"]
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./docker/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_data:/positions
    depends_on:
      - loki
    networks:
      - agent-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.1"

  redis-exporter:
    image: oliver006/redis_exporter:latest
    profiles: ["observability"]
    environment:
      - REDIS_ADDR=redis://redis:6379
      # B1：requirepass 启用后需要鉴权（空值 = 未启用密码，行为不变）
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    networks:
      - agent-net
    restart: unless-stopped

  # ── Redis broker exporter（B1 拆实例后独立监控 → :9122/metrics）──
  redis-broker-exporter:
    image: oliver006/redis_exporter:latest
    profiles: ["observability"]
    environment:
      - REDIS_ADDR=redis://redis-broker:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    networks:
      - agent-net
    restart: unless-stopped

  # ── PostgreSQL exporter（observability profile；agent_memory → :9187/metrics）──
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    profiles: ["observability"]
    environment:
      # 仅监控账号只读查询；密码与 postgres 超管同源（本地单机部署，够用）
      - DATA_SOURCE_NAME=postgresql://postgres:${PGPASSWORD:?PGPASSWORD is required}@postgres:5432/agent_memory?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agent-net
    restart: unless-stopped

  # ── Celery exporter（observability profile；消费 worker 事件流 → :9808/metrics）──
  # 指标：celery_worker_up / celery_queue_length / celery_task_{sent,succeeded,
  # failed,retried}_total / celery_task_runtime_seconds。事件流开关已在
  # celery_app.conf 打开（worker_send_task_events / task_send_sent_event）。
  celery-exporter:
    image: danihodovic/celery-exporter:latest
    profiles: ["observability"]
    # B1：broker 拆 redis-broker 实例 + 密码
    command: ["--broker-url=redis://:${REDIS_PASSWORD:-}@redis-broker:6379/1"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agent-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  # ── Redis 实例 1：缓存/限流/控制面（db0）──
  # B1（2026-09-21 审查）：缓存语义保留 allkeys-lru（可逐出）；requirepass
  # 可选启用（REDIS_PASSWORD 为空 = 不鉴权，与旧版一致）。注意：JWT 吊销
  # 黑名单等安全键历史上也在 db0（写侧归 Java auth-service）——启用密码后
  # Java 侧与 apisix 的 AUTH_REDIS_* 需同步指向本实例并携带密码。
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      # REDIS_PASSWORD 为空时 requirepass "" = 关闭鉴权（redis 官方语义）
      - --requirepass
      - "${REDIS_PASSWORD:-}"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # 密码启用与否都通：先带密码 ping，失败再裸 ping
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping 2>/dev/null | grep -q PONG || redis-cli ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      # 供 healthcheck CMD-SHELL 内 $REDIS_PASSWORD 引用（$$ 转义后取容器 env）
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    networks:
      - agent-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.0"

  # ── Redis 实例 1a：认证控制面（黑名单/会话闸，noeviction）──
  # 与可逐出的业务缓存分离：缓存实例故障时 APISIX 仍可验签、查黑名单
  # 和会话键；认证状态不与 RAG 缓存共用故障域。
  auth-redis:
    image: redis:7-alpine
    container_name: agent-auth-redis
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - "${AUTH_REDIS_PASSWORD:-${REDIS_PASSWORD:-}}"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - auth_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$AUTH_REDIS_PASSWORD\" --no-auth-warning ping 2>/dev/null | grep -q PONG || redis-cli ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      - AUTH_REDIS_PASSWORD=${AUTH_REDIS_PASSWORD:-${REDIS_PASSWORD:-}}
    networks:
      - agent-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "0.5"

  # ── Redis 实例 2：Celery broker/result 专用（db1/db2）──
  # B1 核心修复：broker 与缓存拆实例。noeviction——内存满时写入报错
  # （入队 fail-fast 可见）而不是静默逐出未 ack 任务消息；AOF everysec
  # 保证崩溃后消息/结果最多丢 1 秒。maxmemory 512mb + noeviction：
  # 队列真正堆积时以错误暴露，绝不丢消息。
  redis-broker:
    image: redis:7-alpine
    container_name: agent-redis-broker
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - "${REDIS_PASSWORD:-}"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      # 宿主机 6380（6379 已被缓存实例占用）；宿主侧 .env 的 CELERY_* 指向此端口
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_broker_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping 2>/dev/null | grep -q PONG || redis-cli ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    networks:
      - agent-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.0"

  # ── 外部 MCP 数据源：12306 车票查询（drfccv/mcp-server-12306）──
  # 2026-10-02 拍板「外部 MCP server 作为 Tool 数据源」的首个消费方。
  # 上游为非官方聚合、无 SLA、仅供学习研究（不商用）；平台侧开关
  # TRAIN_MCP_ENABLED 默认关，关掉本容器即整体降级，不影响主链路。
  # app 容器内经服务名直连 http://mcp-12306:8000/mcp（容器名直连是首选，
  # 不经宿主机回环）。
  mcp-12306:
    image: drfccv/mcp-server-12306:latest
    container_name: mcp-12306
    ports:
      - "127.0.0.1:18000:8000"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - agent-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

volumes:
  app_data:
  app_cache:
  pg_data:
  ollama_data:
  redis_data:
  auth_redis_data:
  redis_broker_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  tempo_data:
  loki_data:
  promtail_data:
