# Alembic 迁移配置 — 双库双 section（P1-13）
#
# 连接串不写在这里（防密码入库）：env.py 从 backend.config.database 读取
# 环境变量（PGHOST/PGPORT/PGUSER/PGPASSWORD/BUSINESS_PGDATABASE）构造 URL。
#
# 常用命令（在仓库根目录执行）：
#   alembic -c alembic.ini -n business upgrade head    # 业务库升到最新
#   alembic -c alembic.ini -n memory   upgrade head    # 记忆库升到最新
#   alembic -c alembic.ini -n business current         # 查看当前版本
#   alembic -c alembic.ini -n business revision -m "描述"   # 生成新迁移
#   alembic -c alembic.ini -n business stamp 0001      # 已有库打基线标记
#
# 迁移文件位置：
#   backend/sql/alembic/business/versions/   — 业务库（agent_business）
#   backend/sql/alembic/memory/versions/     — 记忆库（agent_memory）

[business]
script_location = backend/sql/alembic/business
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
# 版本表名在 env.py 中指定（alembic_version_business）

[memory]
script_location = backend/sql/alembic/memory
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

# ── 以下为共享日志配置 ──

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
