# Alembic migration configuration for two PostgreSQL databases.
# Connection URLs remain out of this file; env.py reads application settings.
# Run from the repository root:
#   alembic -c alembic.ini -n business upgrade head
#   alembic -c alembic.ini -n memory upgrade head
#   alembic -c alembic.ini -n business current
#   alembic -c alembic.ini -n business revision -m "description"
#   alembic -c alembic.ini -n business stamp 0001
# Version directories:
#   backend/sql/alembic/business/versions/ - agent_business
#   backend/sql/alembic/memory/versions/   - agent_memory

[business]
script_location = backend/sql/alembic/business
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
# The version table is configured by env.py (alembic_version_business).

[memory]
script_location = backend/sql/alembic/memory
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

# Shared logging configuration.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
