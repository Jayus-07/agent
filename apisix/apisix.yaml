# APISIX standalone 声明式配置 — Python 项目独立入口（B1：鉴权旁路，仅路由/转发/兼容性）
#
# 方案：docs/gateway-apisix-migration-plan.md v2.0 §2（B0 审计实测修正版）
# 审计：docs/gateway-apisix-audit-report.md
#
# B0 实测约束（改这里之前先读审计报告）：
# 1. FastAPI 路由无 /api 前缀 —— 所有 /api/* 路由必须 StripPrefix（regex_uri 剥 /api）。
# 2. /api/sys/* 目标是 /system/<path>（对齐 SCG RewritePath，非裸 StripPrefix）。
# 3. FastAPI 鉴权中间件先于路由执行 → 未知路径 401；APISIX 兜底 /api/* 整段转发，不做前缀过滤。
# 4. /api/chat/* 禁 gzip（本配置从未开启 gzip）、read/send 600s、retries=0；
#    响应无缓冲依赖镜像默认行为（B1/B2 实测逐块传输），B3 矩阵持续复测。
# 5. /internal/* 不经 APISIX（本文件不含该路由）。
# 6. B1 不含 gateway-auth / 黑名单 / 身份头注入（B2 硬闸门内容）。
# 7. CORS 由上游各自处理（FastAPI CORSMiddleware / Java 网关），APISIX 不加 cors 插件，
#    避免与上游 CORS 头重复（SCG 曾为此专门配 DedupeResponseHeader）。
#
# 限流设计（2026-09-16 P1 增强）：
# - 限流键 $http_x_user_id：gateway-auth(priority=2500) 先注入身份头，limit 插件后执行；
#   键为空（api-key 通道 / OPTIONS 预检）时 limit-count 自动回退 remote_addr（插件源码
#   limit-count/init.lua 实测语义），即用户配额与 IP 配额天然分桶。
# - 未认证请求在 gateway-auth 层已被 401，不会消耗限流配额。
# - policy=local 为进程级计数：当前单副本语义正确；扩多副本时必须切 redis 策略
#   （否则配额按副本数放大），见 docs/gateway-observability-and-ratelimit.md。
# - 阈值刻意宽松（后端还有 MAX_CONCURRENT_REQUESTS=5 并发门兜底）：网关层定位是
#   反滥用与按用户公平，不是主容量防线。
#
# 系统直通路由（/, /health, /metrics, /openapi.json）：B1 为基线兼容保留，
# B4 生产加固时按 §2 "不对外" 收口决策复核。

upstreams:
  - id: app
    type: roundrobin
    retries: 0
    timeout:
      connect: 5
      read: 60
      send: 60
    # app 以 compose 容器形态运行（agent-app-1），容器名直连；
    # 若改为宿主机裸跑 uvicorn，改回 "host.docker.internal:8000"
    nodes:
      "app:8000": 1
  - id: app_chat
    type: roundrobin
    retries: 0
    timeout:
      connect: 5
      read: 600
      send: 600
    nodes:
      "app:8000": 1
routes:
  # ── 认证（2026-09-15 拆分：py 自建 auth 模块，strip /api → /auth/*）──
  # login/refresh/logout 公开可达；logout 的令牌吊销由后端写 Redis 黑名单
  - id: auth-service
    uri: /api/auth/*
    upstream_id: app
    plugins:
      prometheus: {}
      proxy-rewrite:
        regex_uri: ["^/api/(.*)$", "/$1"]

  # ── 用户中心（2026-09-16 拆白名单）──
  # 自助注册必须匿名可达 → 单列无插件路由（radixtree 静态路径优先于通配，
  # 命中不受声明顺序影响）；其余 /api/sys/*（提权 PATCH /sys/users/{id}/role
  # 等）挂 gateway-auth——此前整段白名单绕过网关验签，注入头（含
  # X-User-Roles）到不了后端，角色类接口在浏览器链路上 401 不可用
  - id: sys-register
    uri: /api/sys/users/register
    upstream_id: app
    plugins:
      prometheus: {}
      proxy-rewrite:
        regex_uri: ["^/api/(.*)$", "/$1"]

  - id: system-service
    uri: /api/sys/*
    upstream_id: app
    plugins:
      gateway-auth: {}
      prometheus: {}
      proxy-rewrite:
        regex_uri: ["^/api/(.*)$", "/$1"]

  # ── SSE/长任务：独立 upstream（600s + retries=0）+ 禁缓冲 ──
  # 限流：每用户并发 3（SSE 长连接最贵，10 个流就能占满后端并发门）+
  # 每用户 30 次/分钟（LLM 调用配额，防脚本刷 chat）
  - id: chat-sse
    uri: /api/chat/*
    upstream_id: app_chat
    plugins:
      gateway-auth: {}
      prometheus: {}
      limit-conn:
        key: http_x_user_id
        conn: 3
        burst: 2
        default_conn_delay: 0.1
        rejected_code: 429
      limit-count:
        key: http_x_user_id
        count: 30
        time_window: 60
        rejected_code: 429
      proxy-rewrite:
        regex_uri: ["^/api/(.*)$", "/$1"]

  # ── 副作用路由（禁重试，retries=0 已在 upstream 层设置）──
  # 限流：按 IP 并发闸（api-key 服务调用为主，无用户头；副作用防并行风暴）
  # ⚠️ limit-conn 的 key 是必填字段（无 limit-count 的空值回退 IP 语义——
  #    生产坏配置门禁实测抓到），按 IP 限流必须显式写 remote_addr
  - id: sql-side-effect
    uri: /api/sql/*
    upstream_id: app
    plugins:
      gateway-auth: {}
      prometheus: {}
      limit-conn:
        key: remote_addr
        conn: 10
        burst: 5
        default_conn_delay: 0.1
        rejected_code: 429
      proxy-rewrite:
        regex_uri: ["^/api/(.*)$", "/$1"]
  - id: mcp-side-effect
    uri: /api/mcp/*
    upstream_id: app
    plugins:
      gateway-auth: {}
      prometheus: {}
      limit-conn:
        key: remote_addr
        conn: 10
        burst: 5
        default_conn_delay: 0.1
        rejected_code: 429
      proxy-rewrite:
        regex_uri: ["^/api/(.*)$", "/$1"]

  # ── 系统直通（B1 基线兼容；B4 复核收口）──
  - id: sys-health
    uri: /health
    plugins:
      prometheus: {}
    upstream_id: app
  - id: sys-metrics
    uri: /metrics
    plugins:
      prometheus: {}
    upstream_id: app
  - id: sys-openapi
    uri: /openapi.json
    plugins:
      prometheus: {}
    upstream_id: app
  - id: sys-index
    uri: /
    plugins:
      prometheus: {}
    upstream_id: app

  # ── 兜底：/api/* → FastAPI（整段转发，剥 /api）──
  # 限流：每用户 600 次/分钟（≈10 rps，反滥用基线；预检/api-key 回退按 IP 计数）
  - id: app-fallback
    uri: /api/*
    upstream_id: app
    plugins:
      gateway-auth: {}
      prometheus: {}
      limit-count:
        key: http_x_user_id
        count: 600
        time_window: 60
        rejected_code: 429
      proxy-rewrite:
        regex_uri: ["^/api/(.*)$", "/$1"]

# global_rules：访问审计日志挂全路由（含 auth/sys 白名单——登录尝试恰是重点
# 审计对象）。log 阶段 XADD Redis Stream，后端落库，管理端观测页查询。
# fail-open：日志链路故障不影响转发。
global_rules:
  - id: access-log-global
    plugins:
      gateway-access-log: {}

#END
