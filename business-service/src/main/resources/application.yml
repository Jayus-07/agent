server:
  port: 8081

spring:
  application:
    name: business-service
  jpa:
    # 表结构由 backend/sql/migrations + alembic 管理，JPA 只映射不建表
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: customer_service
  datasource:
    # 记忆库（读写：customer_service schema）— 主数据源
    url: ${MEM_DB_URL:jdbc:postgresql://localhost:5432/agent_memory}
    username: ${MEM_DB_USERNAME:postgres}
    password: ${MEM_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      pool-name: memory-db-pool
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: business-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

app:
  # 业务库（agent_business，只读账号，数据库层强制只读）
  biz-db:
    url: ${BIZ_DB_URL:jdbc:postgresql://localhost:5432/agent_business}
    username: ${BIZ_DB_USERNAME:agent_readonly}
    password: ${BIZ_DB_PASSWORD:}
  # 内部 REST 调用令牌（Python AI 服务 → 业务系统）；为空则不校验
  internal-api-token: ${INTERNAL_API_TOKEN:}
  # 风控阈值（对齐 backend/config/customer_service.py）
  risk:
    high-risk-actions: refund_request,refund_execute,return_request,return_execute
    critical-actions: batch_refund,account_delete
    critical-refund-amount: 5000
  whatsapp:
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    graph-api-base: https://graph.facebook.com/v20.0

logging:
  level:
    com.agent.cs: INFO
