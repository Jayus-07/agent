# Tool Quality Check — 检测 Tool 重复定义与注册完整性
# 
# 触发条件：
# - PR/MR: 当变更涉及 backend/tools/*.py 时自动触发
# - push to main/master: 每日定时运行
# - 手动触发：workflow_dispatch
#
# 检查内容：
# 1. Tool 重复定义检测（P0 级）
# 2. 所有核心 Tool 正确注册
# 3. Registry 机制正常

name: Tool Quality Check

on:
  # PR 触发：影响 Tools 相关代码时
  pull_request:
    paths:
      - 'backend/tools/**/*.py'
      - '.github/workflows/tool_quality.yml'
  
  # master 合并后触发
  push:
    branches: [main, master]
    paths:
      - 'backend/tools/**/*.py'
  
  # 每日定时（北京时间 09:00 = 01:00 UTC）
  schedule:
    - cron: '0 1 * * *'
  
  # 手动触发
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Enable remote debugging (TruffleHog)'
        required: false
        default: 'false'

# 取消排队中的相同 workflow（避免堆积）
concurrency:
  group: tool-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-tool-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
      
      # P0 质量门禁：检查 Tool 重复定义
      - name: Run Tool Quality Check
        run: |
          echo "============================================================"
          echo "Running Tool Quality Checks"
          echo "============================================================"
          python scripts/tool_quality_check_clean.py
      
      # Generate Coverage Report for Tools
      - name: Generate Coverage Report
        if: github.event_name == 'pull_request'
        run: |
          pytest -p no:cacheprovider \
            --cov=backend.tools \
            --cov-report=xml:coverage-tools.xml \
            --cov-report=html:htmlcov-tools \
            backend/tests/tools/
      
      # Upload coverage to Codecov (optional but recommended)
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false  # Don't fail PR if Codecov fails
          files: ./coverage-tools.xml
          flags: tools,unit-tests
          name: tool-quality-coverage
      
      # 可选：上传 Coverage 报告（如果有修改 Tool 测试）
      - name: Upload coverage artifacts
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tool-quality-report
          path: htmlcov/
          retention-days: 7
      
      # 可选：对失败的 PR 添加评论说明
      - name: Comment on PR failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🚫 Tool Quality Check Failed

The Tool quality checks did not pass. Please review the following:

- 🔍 **Duplicate detection**: Ensure no Tool is defined multiple times in the same file
- 📝 **Registration**: Verify all tools are registered in their respective modules
- ✅ **Registry**: Run \`python scripts/tool_quality_check_clean.py\` locally to debug

See the full logs for more details.`
            })
      
      # 成功评论（仅用于调试）
      - name: Comment on success
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ✅ Tool Quality Check Passed

All Tool quality checks have passed:
- 🎯 No duplicate definitions detected
- 📦 All core tools properly registered
- 🔧 Registry mechanism working correctly

You can proceed with your Pull Request!`
            })
