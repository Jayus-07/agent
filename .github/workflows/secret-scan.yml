name: secret-scan

# P0 护栏（2026-10-12）：避免再次把带明文凭据的日志/连接串提交进公开仓库。
# 复用 scripts/scan_secrets.py（无第三方依赖），不引入新服务。
#
# 阻断口径（第三轮审查修正）：
#   - 高置信凭据形态（URL 带凭据 / 私钥块 / 云与平台 token）命中 → 阻断；
#   - **新增行**单独跑 assigned_secret（diff 模式）→ 新提交里写死 API_KEY/密码一律红；
#   - 仓库既有安全债（scripts/travel_*.py 的历史硬编码 key）只在树扫描报告，不阻断；
#   - 历史扫描只覆盖本次新增提交（PR: base..head；push: before..after），
#     不做全历史遍历——全历史泄漏以安全债报告单独治理。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 工作树扫描（高置信形态阻断；存量安全债只报告）
        run: |
          python scripts/scan_secrets.py --tree \
            --fail-on url_with_credentials,private_key_block,aws_access_key_id,github_token,slack_token,openai_style_key
      - name: 新增行扫描（硬编码密钥阻断）
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$BASE_SHA"; HEAD="$HEAD_SHA"
          else
            BASE="$BEFORE_SHA"; HEAD="$PUSH_SHA"
          fi
          if [ -z "$BASE" ] || [ -z "$HEAD" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "缺少可比区间，跳过新增行扫描"
            exit 0
          fi
          python scripts/scan_secrets.py --diff "$BASE..$HEAD"
      - name: 历史扫描（仅本次新增提交区间）
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$BASE_SHA"; HEAD="$HEAD_SHA"
          else
            BASE="$BEFORE_SHA"; HEAD="$PUSH_SHA"
          fi
          if [ -z "$BASE" ] || [ -z "$HEAD" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "缺少可比区间，跳过历史扫描（由工作树扫描兜底）"
            exit 0
          fi
          python scripts/scan_secrets.py --history --range "$BASE..$HEAD" \
            --fail-on url_with_credentials,private_key_block,aws_access_key_id,github_token,slack_token,openai_style_key
