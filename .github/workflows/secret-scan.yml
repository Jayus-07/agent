name: secret-scan

# P0 护栏（2026-10-12）：避免再次把带明文凭据的日志/连接串提交进公开仓库。
# 复用脚本 scripts/scan_secrets.py（无第三方依赖），不引入新服务。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 历史扫描需要完整提交图
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 工作树扫描（当前跟踪文件）
        run: python scripts/scan_secrets.py --tree
      - name: 历史扫描（PR 区间；push 到 main 时全量）
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python scripts/scan_secrets.py --history --range "${BASE_SHA}..${HEAD_SHA}"
          else
            python scripts/scan_secrets.py --history
          fi
