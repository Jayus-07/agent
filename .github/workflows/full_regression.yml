name: Full Regression

# 全量回归（2026-10-29 盘点后新增；2026-10-30 首轮单 job 实测改分治）：
# PR 口径 targeted 清单只覆盖 ~650/12500 用例，清单外漂移无人发现。
# 单 job 全量跑不进 180min 上限（挂死用例按 150-300s/个排队耗尽时长，
# 被杀后失败清单不落盘）——按目录 matrix 分治：13 个 suite 并行、各自
# 隔离 DB、互不阻塞；单 suite 可独立重跑（dispatch 传 suites 参数）。
# 失败即红（GitHub 失败通知）但不属任何 PR 门禁，不挡合并。
on:
  schedule:
    # 每周一 03:00 UTC（北京时间周一 11:00）
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      suites:
        description: "限定 suite（逗号分隔，空 = 全部）"
        default: ""
        required: false

jobs:
  pytest-suite:
    name: pytest ${{ matrix.suite.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # 注：job 级 if 不可引用 matrix 上下文（dispatch 解析 422 实证），
    # suites 参数过滤在下方 Suite gate 步骤以环境变量实现。
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      MEMORY_PGDATABASE: agent_memory_test
      # workflow runs 表（WORKFLOW_DB_PG_CONFIG 默认 agent_memory）——
      # CI 只建 *_test 库，不显式指向会 13 例 connection 失败（run 41114061156 实证）
      WORKFLOW_DB_PGDATABASE: agent_memory_test
      BUSINESS_PGDATABASE: agent_business_test
      # inventory 存储（INVENTORY_DB_PG_CONFIG 默认 agent_business）——
      # CI 显式建了无后缀 agent_business 兼容库（004 迁移），不显式指向
      # *_test 会让 inventory 测试表落进真实兼容库且 drop_pgtest_tables
      # （按 BUSINESS/WORKFLOW/INVENTORY 配置扫描）覆盖不到：同 worker
      # 前序用例的 notification_policies 行毒死后续用例（test_notification
      # 10 例互踩，v2 run 41120872440 实证）
      INVENTORY_DB_PGDATABASE: agent_business_test
      VECTOR_PGDATABASE: agent_memory_test
      RAG_STORES_PGDATABASE: agent_memory_test
      DOC_REGISTRY_PGDATABASE: agent_memory_test
      OBS_DB_PGDATABASE: agent_memory_test
      # SQL executor 池的只读角色（与上方 Initialize 步骤的 ALTER ROLE/GRANT 配套）
      PG_READONLY_USER: agent_readonly
      PG_READONLY_PASSWORD: pg_readonly_ci
      # 出站凭据加密主密钥：CI 无 .env，create_provider 等真实加密路径
      # fail-closed（SecretKeyMissing，v4 run 41205470228 实证）。固定测试
      # 值（32 字节 urlsafe-base64），与 PGPASSWORD 同级仅用于测试链路。
      # fail-closed 行为本身由 tests/infra/test_shared_crypto.py delenv 覆盖。
      SECRETS_ENCRYPTION_KEY: Y2ktdGVzdC1rZXktMDEyMzQ1Njc4OWFiY2RlZmdoaWo=
      # Redis 通道开关：CI 无 .env 时缺省 false，get_redis() 静默返回 None
      # （config/redis.py 缺省 false 分支无日志），坐席 presence 判定
      # fail-closed → reaper 放弃恢复 → p5 离线自愈用例 scanned=0
      # （v8 run 41238707884 诊断断言实证）。指向上方 redis service 容器。
      REDIS_ENABLED: "true"
      REDIS_URL: redis://localhost:6379/0
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: rag, paths: "backend/tests/rag" }
          - { name: customer_service, paths: "backend/tests/customer_service" }
          - { name: travel, paths: "backend/tests/travel" }
          - { name: orchestration, paths: "backend/tests/orchestration" }
          - { name: api, paths: "backend/tests/api" }
          - { name: evaluation, paths: "backend/tests/evaluation backend/tests/evaluation_v2" }
          - { name: sql-infra, paths: "backend/tests/sql backend/tests/infra" }
          - { name: prompts-context, paths: "backend/tests/prompts backend/tests/context_budget" }
          - { name: tools-security-obs, paths: "backend/tests/tools backend/tests/security backend/tests/observability" }
          - { name: services-travelv2, paths: "backend/tests/services backend/tests/memory backend/tests/travel_v2" }
          - { name: misc, paths: "backend/tests/audit backend/tests/business_report backend/tests/config backend/tests/domain_runtime backend/tests/inventory backend/tests/mcp_registry backend/tests/messaging backend/tests/node_runtime backend/tests/runtime backend/tests/scripts backend/tests/skills backend/tests/tool_runtime backend/tests/workers" }
          - { name: backend-root, paths: "" } # backend/tests 根散文件，步骤内展开
          - { name: repo-tests, paths: "tests" }
    steps:
      - name: Suite gate
        env:
          SELECTED: ${{ inputs.suites }}
        run: |
          # dispatch 限定 suites 时跳过未选中 job（scheduled 无 inputs 全跑）
          if [ -n "$SELECTED" ] && ! echo "$SELECTED" | grep -qw "${{ matrix.suite.name }}"; then
            echo "SKIP_SUITE=true" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        if: env.SKIP_SUITE != 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: env.SKIP_SUITE != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        if: env.SKIP_SUITE != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Initialize isolated databases
        if: env.SKIP_SUITE != 'true'
        run: |
          # agent_business（无 _test 后缀）是 004 只读角色迁移的兼容库：
          # 该迁移硬编码库名，不显式创建会让 init_db 在 004 上失败
          # （rag_smoke preflight 同款坑位注释）。
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres \
            -c 'CREATE DATABASE agent_business' \
            -c 'CREATE DATABASE agent_business_test' \
            -c 'CREATE DATABASE demo'
          python scripts/init_db.py --host localhost --port 5432 --user postgres
          # demo 库给 data_collection 的写库探针用（DC_DATABASE_URL 默认
          # postgresql://postgres@localhost:5432/demo）；pandas.to_sql
          # 自建测试表，无需跑业务迁移。CI 与本地统一都显式建库，
          # 否则 12 个 data_collection 集成用例以 partial（写入 0 条）
          # 失败——基线 v1（run 40948443665）实证。
          # 004_readonly_role 只对 agent_business 库 GRANT 且不设密码；
          # SQL executor 池固定走 agent_readonly（BUSINESS_DB_READONLY_CONFIG），
          # CI 必须给角色设密码并对 agent_business_test 复刻 schema 只读授权，
          # 否则 test_pg_integration 10 例全部 error_type='connection'
          # （本地因 .env 配有 PG_READONLY_* 而不可复现，基线 v1 实证）。
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres \
            -c "ALTER ROLE agent_readonly WITH LOGIN PASSWORD 'pg_readonly_ci'"
          PGPASSWORD=postgres psql -h localhost -U postgres -d agent_business_test -c \
            "GRANT CONNECT ON DATABASE agent_business_test TO agent_readonly;
             GRANT USAGE ON SCHEMA product, \"order\", inventory, customer, crawler, finance, ai TO agent_readonly;
             GRANT SELECT ON ALL TABLES IN SCHEMA product, \"order\", inventory, customer, crawler, finance TO agent_readonly;
             GRANT SELECT ON ai.agent_tasks, ai.agent_trace TO agent_readonly;
             REVOKE SELECT ON finance.wallet_balances, finance.wallet_ledger FROM agent_readonly;"
          # 末行 REVOKE：schema 级 GRANT 会把 init_db 之后新建的业务表一并授给
          # 只读角色（125_mall_wallet 的 wallet 两表实证，v3 run 41151145995
          # test_readonly_grants_equal_declared_tables 越权告警）。新业务表
          # 默认不纳管（fail-closed）；确需只读访问时在 083 口径显式登记。

      - name: Suite pytest
        if: env.SKIP_SUITE != 'true'
        run: |
          # pytest-timeout 截杀挂死/超慢用例（150s/个）；xdist 4 worker
          # （4 核 runner；loadfile 按文件分组，避免同文件跨进程互踩）。
          SUITE="${{ matrix.suite.name }}"
          PATHS="${{ matrix.suite.paths }}"
          if [ -z "$PATHS" ]; then
            PATHS=$(ls backend/tests/test_*.py 2>/dev/null | tr '\n' ' ')
          fi
          echo "suite=$SUITE paths=$PATHS"
          RC=0
          python -m pytest $PATHS -q --no-cov -rf --timeout=150 \
            -n 4 --dist loadfile -p no:cacheprovider \
            > pytest_out.txt 2>&1 || RC=$?
          # 失败明细独立成文件（artifact 留档）
          grep -E "^(FAILED|ERROR) " pytest_out.txt | sort -u \
            > failures_${SUITE}.txt || true
          {
            echo "## suite $SUITE：exit=$RC 失败 $(wc -l < failures_${SUITE}.txt) 例"
            echo '```'
            grep -E "^(FAILED|ERROR) " pytest_out.txt | sort -u || echo "（无失败）"
            echo '```'
            echo '```'
            tail -3 pytest_out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -50 pytest_out.txt
          exit "$RC"

      - name: Upload failure list
        if: always() && env.SKIP_SUITE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: failures-${{ matrix.suite.name }}
          path: failures_*.txt
          if-no-files-found: ignore

  summary:
    name: Regression summary
    needs: pytest-suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Suite result table
        env:
          NEEDS: ${{ toJSON(needs.*) }}
        run: |
          python - <<'PY'
          import json, os
          needs = json.loads(os.environ["NEEDS"])
          # toJSON(needs.*) 在只有一个 need 时序列化为数组而非对象
          # （全量/分 suite dispatch 均触发，Regression summary 因此恒红）
          if isinstance(needs, list):
              needs = {job.get("name", "?"): job for job in needs}
          lines = ["## 全量回归 suite 终态", "", "| suite | 结论 |", "|---|---|"]
          for name, job in sorted(needs.items()):
              result = job.get("result", "?")
              mark = "✅ pass" if result == "success" else f"❌ {result}"
              lines.append(f"| {name} | {mark} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY
