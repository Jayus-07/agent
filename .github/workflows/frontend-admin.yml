name: frontend-admin CI

on:
  pull_request:
    paths:
      - "frontend-admin/**"
      - ".github/workflows/frontend-admin.yml"
  push:
    branches: [main]
    paths:
      - "frontend-admin/**"
      - ".github/workflows/frontend-admin.yml"

permissions:
  contents: read

jobs:
  frontend-admin-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json
      - name: High/Critical 依赖漏洞门禁
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high

  frontend-admin-functional:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json
      - name: 安装锁定依赖（复用 npm 缓存）
        id: install
        run: npm ci --prefer-offline
      - name: Vitest 定向测试
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm test
      - name: TypeScript 检查
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npx tsc --noEmit
      - name: Next.js 构建
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run build
