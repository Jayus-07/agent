name: frontend-admin CI

on:
  pull_request:
    paths:
      - "frontend-admin/**"
      - "backend/app/api/routes/observability.py"
      - "backend/tests/observability/test_admin_observability_reads.py"
      - "requirements-lock.txt"
      - "pyproject.toml"
      - ".github/workflows/frontend-admin.yml"
  push:
    branches: [main]
    paths:
      - "frontend-admin/**"
      - "backend/app/api/routes/observability.py"
      - "backend/tests/observability/test_admin_observability_reads.py"
      - "requirements-lock.txt"
      - "pyproject.toml"
      - ".github/workflows/frontend-admin.yml"

permissions:
  contents: read

jobs:
  admin-observability-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Python 运行时与依赖缓存
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: 安装锁定的后端测试依赖
        run: python -m pip install -r requirements-lock.txt
      - name: 管理端全局观测 API 权限回归
        run: python -m pytest backend/tests/observability/test_admin_observability_reads.py -q --no-cov

  frontend-admin-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json
      - name: High/Critical 依赖漏洞门禁
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high

  frontend-admin-functional:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json
      - name: 安装锁定依赖（复用 npm 缓存）
        id: install
        run: npm ci --prefer-offline
      - name: Vitest 定向测试
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm test
      - name: TypeScript 检查
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npx tsc --noEmit
      - name: Next.js 构建
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run build
