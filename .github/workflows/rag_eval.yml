name: RAG Eval

on:
  # PR 触发：影响 RAG/agents/prompts 时跑评估
  pull_request:
    paths:
      - 'backend/rag/**'
      - 'backend/agents/**'
      - 'backend/evaluation/**'
      - 'backend/prompts/**'
      - '.github/workflows/rag_eval.yml'
  # master 合并：跑全量评估 + judge
  push:
    branches: [master]
  # 每周一 09:00 北京时间（01:00 UTC）跑全量
  schedule:
    - cron: '0 1 * * 1'
  # 手动触发
  workflow_dispatch:
    inputs:
      module:
        description: 'Module to evaluate (all/rag/e2e/sql/planner)'
        required: false
        default: 'all'

# 取消上一次进行中的相同 workflow
concurrency:
  group: rag-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rag-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # LLM API key（CI 环境变量）
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      EVAL_TRIGGER: ci:${{ github.event_name }}
      GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements-dev.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Initialize test database
        run: |
          cd backend
          PGPASSWORD=postgres psql -h localhost -U postgres -d agent_test \
            -c "CREATE SCHEMA IF NOT EXISTS product; CREATE SCHEMA IF NOT EXISTS order;"
          echo "DB ready"

      - name: Run RAG retrieval eval (no LLM, fast)
        run: |
          cd backend
          python -m evaluation --module rag --output ../artifacts/${{ github.run_id }}/rag/

      - name: Run E2E eval (--judge on master only)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch')
        run: |
          cd backend
          python -m evaluation --module e2e --live --judge \
            --output ../artifacts/${{ github.run_id }}/e2e/
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # Judge 用独立模型

      - name: Run E2E eval (no judge, PR)
        if: github.event_name == 'pull_request'
        run: |
          cd backend
          python -m evaluation --module e2e --live \
            --output ../artifacts/${{ github.run_id }}/e2e/

      - name: Regression check vs baseline
        run: |
          cd backend
          # 找最新一次 run
          LATEST_RUN=$(ls -t data/eval_runs/ 2>/dev/null | head -1)
          if [ -z "$LATEST_RUN" ]; then
            echo "⚠️ No eval run found, skipping regression check"
            exit 0
          fi
          echo "Checking regression for run: $LATEST_RUN"
          python -m evaluation.baseline "$LATEST_RUN" --threshold 0.05
        continue-on-error: false

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_id }}
          path: artifacts/
          retention-days: 30

      - name: Comment on PR with summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'artifacts/${{ github.run_id }}';
            let summary = '## 📊 RAG Eval Summary\n\n';
            try {
              const reports = fs.readdirSync(path, { recursive: true });
              for (const r of reports) {
                if (r.endsWith('eval-rag-*.md') || r.endsWith('eval-e2e-*.md')) {
                  const content = fs.readFileSync(`${path}/${r}`, 'utf8');
                  summary += `<details><summary>${r}</summary>\n\n\`\`\`\n${content.slice(0, 3000)}\n\`\`\`\n</details>\n\n`;
                }
              }
            } catch (e) {
              summary += `Failed to read artifacts: ${e.message}`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary,
            });
