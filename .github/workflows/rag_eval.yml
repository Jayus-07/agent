# RAG 评测 CI — Golden Set 离线质量门
#
# 触发：push to main / PR
# 成本：¥0（全离线 — 本地 embedding + local reranker，零 API 调用）
# 耗时：~3-5 min（首次 HF 模型下载 ~1 min，后续缓存命中 <10s）
#
# 流程：
#   1. 安装 Python 依赖（pyproject.toml + requirements-dev.txt）
#   2. 从 HuggingFace 镜像下载 embedding/reranker 模型（缓存）
#   3. 首次 init 自动从 data/docs/ 构建 ChromaDB + BM25 索引
#   4. 运行 golden set（13 条核心用例）→ pytest 断言聚合指标 + 逐条 pass

name: RAG Eval CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "data/docs/**"
      - "pyproject.toml"
      - "backend/requirements*.txt"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "data/docs/**"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: eval-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-set:
    name: Golden Set (13 cases, offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RERANKER_BACKEND: local
      EMBEDDING_BACKEND: local
      HF_ENDPOINT: https://hf-mirror.com
      LANGFUSE_ENABLED: "false"
      OBS_ANALYTICS_ENABLED: "false"
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'backend/requirements*.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-small-zh-bge-reranker-base-v1
          restore-keys: hf-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install -r backend/requirements-dev.txt

      - name: Pre-download HF models
        run: |
          python -c "
          from sentence_transformers import SentenceTransformer, CrossEncoder
          SentenceTransformer('BAAI/bge-small-zh-v1.5')
          CrossEncoder('BAAI/bge-reranker-base')
          print('Models ready')
          "

      - name: Run Golden Set evaluation
        run: |
          python -m pytest backend/tests/evaluation/test_eval_golden.py \
            --tb=short -s 2>&1 | tee golden_set_report.txt
        timeout-minutes: 10

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-set-report
          path: golden_set_report.txt
          retention-days: 7
