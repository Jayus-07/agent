# RAG 评测 CI — Golden Set 离线质量门（V3 语义门控）
#
# 触发：PR to main / 手动 workflow_dispatch
# 成本：¥0（全离线 — 本地 embedding + local reranker，零 API 调用）
# 耗时：~3-5 min（首次 HF 模型下载 ~1 min，后续缓存命中 <10s）
#
# 流程：
#   1. 安装 Python 依赖（pyproject.toml + requirements-dev.txt）
#   2. 从 HuggingFace 镜像下载 embedding/reranker 模型（缓存）
#   3. 首次 init 自动从 data/docs/ 构建 ChromaDB + BM25 索引
#   4. 运行 golden set（13 条核心用例）→ 语义门控 pass/fail
#
# V3 变更：pass/fail 由 sem_context_recall 决定，不再依赖 doc_id 标注

name: RAG Eval CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "data/docs/**"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "data/docs/**"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: eval-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-set:
    name: Golden Set (13 cases, offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RERANKER_BACKEND: local
      EMBEDDING_BACKEND: local
      HF_ENDPOINT: https://hf-mirror.com
      LANGFUSE_ENABLED: "false"
      OBS_ANALYTICS_ENABLED: "false"
      PYTHONUTF8: "1"
      EVAL_GATE: semantic

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'backend/requirements*.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-small-zh-bge-reranker-base-v1
          restore-keys: hf-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install -r backend/requirements-dev.txt

      - name: Pre-download HF models
        run: |
          python -c "
          from sentence_transformers import SentenceTransformer, CrossEncoder
          SentenceTransformer('BAAI/bge-small-zh-v1.5')
          CrossEncoder('BAAI/bge-reranker-base')
          print('Models ready')
          "

      - name: Run Golden Set evaluation
        run: |
          python -m pytest backend/tests/evaluation/test_eval_golden.py \
            --tb=short -s --no-cov 2>&1 | tee golden_set_report.txt
        timeout-minutes: 10

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/
          retention-days: 14

      - name: Comment PR with metrics
        if: always() && github.event_name == 'pull_request'
        run: python backend/scripts/pr_comment_metrics.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish metrics to history CSV
        if: always()
        run: python backend/scripts/publish_metrics.py

      - name: Upload metrics history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-history
          path: reports/metrics_history.csv
          retention-days: 90

  llm-judge:
    name: LLM Judge (non-blocking, Ollama)
    runs-on: ubuntu-latest
    needs: golden-set
    continue-on-error: true
    timeout-minutes: 20

    env:
      RERANKER_BACKEND: local
      EMBEDDING_BACKEND: local
      HF_ENDPOINT: https://hf-mirror.com
      LANGFUSE_ENABLED: "false"
      OBS_ANALYTICS_ENABLED: "false"
      PYTHONUTF8: "1"
      EVAL_GATE: semantic
      OLLAMA_MODEL: qwen2.5:3b

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'backend/requirements*.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-small-zh-bge-reranker-base-v1
          restore-keys: hf-${{ runner.os }}-

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull model
        run: |
          ollama serve &
          sleep 3
          ollama pull qwen2.5:3b
          echo "Ollama ready"
        timeout-minutes: 5

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install -r backend/requirements-dev.txt

      - name: Pre-download HF models
        run: |
          python -c "
          from sentence_transformers import SentenceTransformer, CrossEncoder
          SentenceTransformer('BAAI/bge-small-zh-v1.5')
          CrossEncoder('BAAI/bge-reranker-base')
          print('Models ready')
          "

      - name: Run LLM Judge evaluation
        run: |
          python -m pytest backend/tests/evaluation/test_eval_llm_judge.py \
            -v -m llm_judge --tb=short -s \
            --no-cov 2>&1 | tee llm_judge_report.txt
        timeout-minutes: 15

      - name: Upload LLM Judge report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-judge-report
          path: llm_judge_report.txt
          retention-days: 7

  deploy-pages:
    name: Deploy Report to GitHub Pages
    runs-on: ubuntu-latest
    needs: golden-set
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eval-report
          path: site/

      - name: Prepare Pages site
        run: |
          LATEST=$(ls -t site/eval-rag-*.html 2>/dev/null | head -1)
          if [ -n "$LATEST" ]; then
            cp "$LATEST" site/index.html
            cp site/eval-rag-*.json site/ 2>/dev/null || true
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - id: deployment
        uses: actions/deploy-pages@v4
