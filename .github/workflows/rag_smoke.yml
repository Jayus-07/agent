name: RAG PR Smoke

# 触发与信任边界（2026-10-11 GPT 复核整改）：
# - pull_request：只跑免费可信预检（路径检测 + E0 preflight），**不引用付费
#   Secrets、不跑真实 API 评测**——同仓库未审核 PR 不获得付费凭据
#   （prompt-eval environment 当前无 protection_rules，该收敛由触发器保证）。
# - push(main)：只汇总离线预检状态，不自动调用真实 Provider。
# - workflow_dispatch：默认只跑免费离线预检；仅显式设置 run_live_eval=true
#   才进入真实检索评测，供离线矩阵通过、凭据与预算准备后使用。
# - 完整回归由 rag_regression.yml 的 workflow_dispatch 承担（无 PR/定时触发）。
#
# 语义定位：固定 8 条用例（desktop_upload_smoke suite）的真实检索评测，全部层级阈值
# 达标才 PASS；检索评测与生成/Judge 评测（--judge/--ragas 显式 opt-in）分开。

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_eval:
        description: "显式启用真实 Provider 评测（离线矩阵通过且已获准后才开启）"
        required: true
        type: boolean
        default: false
      multiquery:
        description: "受信任评测启用 MultiQuery（生产检索链默认启用；false 仅用于对照）"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: rag-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect RAG changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # 判定逻辑单一事实源在 .github/scripts/rag_smoke_path_filter.py，
          # 正反触发回归测试见 tests/test_rag_smoke_path_filter.py。
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "RAG-related changes: true (manual trusted run)"
            exit 0
          fi

          # 首次创建 main 分支没有可比较的 before SHA；按相关改动处理，
          # 其余 push 必须与 PR 一样通过共享路径过滤器。
          if [[ "$EVENT_NAME" == "push" && "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "RAG-related changes: true (initial branch push)"
            exit 0
          fi

          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            echo "::error::Pull request base or head SHA is missing; cannot determine changed paths."
            exit 1
          fi

          changed_paths="$RUNNER_TEMP/rag-smoke-changed-paths.txt"
          if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_paths"; then
            echo "::error::Unable to determine changed paths for the RAG smoke gate."
            exit 1
          fi

          relevant_output="$(python3 .github/scripts/rag_smoke_path_filter.py --event "$EVENT_NAME" < "$changed_paths")"
          if [[ "$relevant_output" != "relevant=true" && "$relevant_output" != "relevant=false" ]]; then
            echo "::error::RAG path filter returned an invalid result: $relevant_output"
            exit 1
          fi
          echo "$relevant_output"
          echo "$relevant_output" >> "$GITHUB_OUTPUT"

  # ── PR / 手动默认：免费预检（无付费 Secrets、无真实 API 调用）───────
  rag-smoke-pr-static:
    needs: detect-changes
    if: >-
      (github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_live_eval != true)) &&
      needs.detect-changes.outputs.relevant == 'true'
    name: RAG Smoke preflight (offline, no paid API)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      MEMORY_PGDATABASE: agent_memory_test
      BUSINESS_PGDATABASE: agent_business_test
      VECTOR_PGDATABASE: agent_memory_test
      RAG_STORES_PGDATABASE: agent_memory_test
      DOC_REGISTRY_PGDATABASE: agent_memory_test
      OBS_DB_PGDATABASE: agent_memory_test
      # 取消订单 sandbox 直查链路回归的专属隔离库（库名过测试库守卫），
      # 由测试 fixture 自行按迁移建表，不依赖 init_db 目标库；
      # 连接复用本 job 既有 PGHOST/PGPORT/PGUSER/PGPASSWORD，不在本文件内嵌凭据。
      MALL_SANDBOX_PG_DBNAME: agent_business_sandbox_test
      # 积分查询 sandbox 直查链路回归（B2）：复用同一隔离库，同守卫纪律。
      POINTS_SANDBOX_PG_DBNAME: agent_business_sandbox_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Evaluation preflight (E0, free)
        run: python -m backend.evaluation.preflight --module rag --selection desktop_upload_smoke

      - name: Initialize isolated database for free Prompt contracts
        run: |
          # 004 只读角色迁移的兼容库；所有操作均在本 job 的临时 PG 中。
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE agent_business'
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE agent_business_sandbox_test'
          python scripts/init_db.py --host localhost --port 5432 --user postgres

      - name: Targeted regression tests (free, no paid API)
        run: |
          # 门禁机制与路径过滤的定向回归（免费：无付费模型调用、不读
          # API Secrets；不扩大为全量 pytest）。
          python -m pytest tests/test_rag_smoke_path_filter.py \
            backend/tests/api/test_admin_mcp_api.py::TestToolListPayload \
            tests/evaluation/test_seed_eval_bindings_verify.py \
