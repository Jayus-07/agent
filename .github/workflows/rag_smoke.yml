      - name: Declare skipped real-API scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_LIVE_EVAL: ${{ inputs.run_live_eval }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            scope="SKIPPED_UNTRUSTED_PR"
            reason="同仓库 PR 不获得付费 API Secrets。"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$RUN_LIVE_EVAL" != "true" ]]; then
            scope="SKIPPED_LIVE_OPT_IN_REQUIRED"
            reason="手动运行未显式设置 run_live_eval=true。"
          else
            echo "::error::Unexpected event reached the offline-only preflight job."
            exit 1
          fi
          {
            echo "## RAG Smoke（真实 API 评测）= $scope"
            echo "$reason"
            echo "本 Job 仅覆盖免费 E0 资产预检（suite/hash/case 完整性）和离线定向测试。"
            echo "真实评测需在离线矩阵通过、凭据隔离和预算准备完成后显式触发。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "REAL_API_EVAL=$scope"

  # ── 付费入口：仅受信任的手动 dispatch 显式 opt-in 才运行 ────────────
  rag-smoke:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.relevant == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.run_live_eval == true
    name: RAG Smoke Evaluation (8 cases, real API)
    runs-on: [self-hosted, linux, x64, local-stack]
    # 受信任环境：与 prompt-eval 共用 environment secrets。
    environment: prompt-eval
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # 真实 API 检索评测口径：DB API 模型（specialized binding），
      # ENV_MODE=cloud；禁止本地 BGE / Ollama / 旧 env 凭据回退。
      ENV_MODE: cloud
      EVAL_GATE: legacy
      EVAL_SEMANTIC_SCORER: lexical
      EVAL_TRIGGER: ${{ github.event_name }}
      EVAL_TRIGGERED_BY: github-actions-rag-smoke
      EVAL_RUN_ID: rag-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      LLM_BUDGET_MODE: enforce
      # 评测阶段请求额度；fixture 索引阶段另设阶段额度，最终账本覆盖两阶段
      # （基线 2026-10-18 main run 实测：108 calls / 106,330 tokens / CNY 0.116，
      # 含 baseline 16 份 fixture 冷索引 + 8-case 评测；费用上限仍为 CNY 0.50，
      # calls/tokens 用约 1.8 倍实测值做失控保护，不构成成本放宽）。
      # MultiQuery 生效后单 case 会多 1 次改写 + N 路检索（含 rerank），
      # 8-case 实测预估 ~85 calls / ~50k tokens；额度按此留余量。
      LLM_REQUEST_MAX_CALLS: "128"
      LLM_REQUEST_MAX_TOKENS: "96000"
      LLM_REQUEST_MAX_COST: "0.40"
      # 改写与生产共用默认子预算，不设置评测专用 timeout 覆盖值。
      # 隔离评测库需要落 llm_usage 明细供费用归因；不得关闭统一账本写入。
      OBS_ANALYTICS_ENABLED: "true"
      PYTHONUTF8: "1"
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      MEMORY_PGDATABASE: agent_memory_test
      BUSINESS_PGDATABASE: agent_business_test
      VECTOR_PGDATABASE: agent_memory_test
      RAG_STORES_PGDATABASE: agent_memory_test
      DOC_REGISTRY_PGDATABASE: agent_memory_test
      OBS_DB_PGDATABASE: agent_memory_test
      WORKFLOW_DB_PGDATABASE: agent_memory_test
      PROMPT_EVAL_TEST_PGDATABASE: agent_memory_test
      PROMPT_EVAL_TEST_PROVIDER_ID: rag-eval-chat
      PROMPT_EVAL_TEST_API_KEY: ${{ secrets.PROMPT_EVAL_TEST_API_KEY }}
      PROMPT_EVAL_TEST_BASE_URL: ${{ secrets.PROMPT_EVAL_TEST_BASE_URL }}
      PROMPT_EVAL_TEST_MODEL: ${{ vars.PROMPT_EVAL_TEST_MODEL }}
      # 价格快照仅通过只读 Registry 连接导入，禁止 CI 变量自报价格。
      # Live 仅由显式 workflow_dispatch 触发；默认按生产口径启用 MultiQuery。
      EVAL_MULTIQUERY: ${{ inputs.multiquery }}
      PROMPT_EVAL_TEST_EMBEDDING_PROVIDER_ID: rag-eval-embedding
      PROMPT_EVAL_TEST_EMBEDDING_API_KEY: ${{ secrets.PROMPT_EVAL_TEST_EMBEDDING_API_KEY }}
      PROMPT_EVAL_TEST_EMBEDDING_BASE_URL: ${{ secrets.PROMPT_EVAL_TEST_EMBEDDING_BASE_URL }}
      PROMPT_EVAL_TEST_EMBEDDING_MODEL: ${{ vars.PROMPT_EVAL_TEST_EMBEDDING_MODEL }}
      PROMPT_EVAL_TEST_EMBEDDING_DIMENSIONS: ${{ vars.PROMPT_EVAL_TEST_EMBEDDING_DIMENSIONS || '1024' }}
      VECTOR_PG_DIM: ${{ vars.PROMPT_EVAL_TEST_EMBEDDING_DIMENSIONS || '1024' }}
      PROMPT_EVAL_TEST_RERANK_PROVIDER_ID: rag-eval-rerank
      PROMPT_EVAL_TEST_RERANK_API_KEY: ${{ secrets.PROMPT_EVAL_TEST_RERANK_API_KEY }}
      PROMPT_EVAL_TEST_RERANK_BASE_URL: ${{ secrets.PROMPT_EVAL_TEST_RERANK_BASE_URL }}
      PROMPT_EVAL_TEST_RERANK_MODEL: ${{ vars.PROMPT_EVAL_TEST_RERANK_MODEL }}
      SECRETS_ENCRYPTION_KEY: ${{ secrets.SECRETS_ENCRYPTION_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Evaluation preflight
        run: python -m backend.evaluation.preflight --module rag --selection desktop_upload_smoke

      - name: Trim corpora to evaluation scope
        run: |
          # 只从本次 rag_eval_kb manifest 部署 fixture；旧 baseline 与兼容别名
          # 会被全量 sync 再次纳入并触发 near-dup 交叉 HOLD。
          rm -rf data/docs/policy_general
          rm -rf data/docs/rag_eval_kb data/docs/rag_test_kb data/docs/rag_100_docs
          mkdir -p data/docs/rag_eval_kb
          ls data/docs/

      - name: Prepare migration compatibility database
        run: |
          # 对齐 prompt_eval 模式：004_readonly_role 等迁移要跨库操作
          # agent_business；库不存在会让只读角色失败并连锁导致
          # customer_service schema 缺失（006/082 连锁失败）。
          python - <<'PY'
          import psycopg2

          conn = psycopg2.connect(
              host="localhost",
              port=5432,
              user="postgres",
              password="postgres",
              dbname="postgres",
          )
          conn.autocommit = True
          try:
              with conn.cursor() as cur:
                  cur.execute("SELECT 1 FROM pg_database WHERE datname = 'agent_business'")
                  if cur.fetchone() is None:
                      cur.execute('CREATE DATABASE agent_business')
          finally:
              conn.close()
          PY

      - name: Initialize isolated evaluation database
        run: python scripts/init_db.py --host localhost --port 5432 --user postgres

      - name: Seed DB API model bindings
        env:
          PROMPT_EVAL_PRICE_REGISTRY_DATABASE_URL: ${{ secrets.PROMPT_EVAL_PRICE_REGISTRY_DATABASE_URL }}
          PROMPT_EVAL_PRICE_REGISTRY_TABLE_PREFIX: ${{ vars.PROMPT_EVAL_PRICE_REGISTRY_TABLE_PREFIX }}
        run: python -m backend.scripts.seed_prompt_eval_db --require-approved-prices

      - name: Verify approved prices before any paid API call
        run: python -m backend.scripts.seed_prompt_eval_db --verify-pricing

      - name: Verify model bindings
        env:
          EVAL_MEMORY_PGDATABASE: agent_memory_test
        run: |
          python scripts/seed_eval_model_bindings.py --verify --target-db agent_memory_test

      - name: Snapshot usage ledger before paid provider calls
        id: usage-ledger-baseline
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import psycopg

          conn = psycopg.connect(
              host="localhost", port=5432, user="postgres", password="postgres",
              dbname=os.environ["MEMORY_PGDATABASE"],
          )
          with conn.cursor() as cur:
              cur.execute("SELECT COALESCE(MAX(id), 0) FROM llm_usage")
              start_id = int(cur.fetchone()[0] or 0)
          conn.close()
          print(f"usage_start_id={start_id}")
          PY

      - name: Import baseline evaluation fixtures
        env:
          # fixture 冷索引实测（2026-10-18 main run）：约 80 calls / 45k tokens /
          # CNY 0.10（16 份 baseline，每份 1 次元数据 LLM + 多次 embedding）。
          # 原 16 calls / 8k tokens 会在第 5 份文档即 RequestBudgetExceeded。
          LLM_REQUEST_MAX_CALLS: "160"
          LLM_REQUEST_MAX_TOKENS: "120000"
          LLM_REQUEST_MAX_COST: "0.15"
        run: python -m backend.evaluation.import_fixture baseline

      - name: Assert index completeness
        run: |
          python - <<'PY'
          import os
          import sys

          import psycopg

          expected_dims = int(os.getenv("PROMPT_EVAL_TEST_EMBEDDING_DIMENSIONS", "1024"))
          conn = psycopg.connect(
              host="localhost", port=5432, user="postgres", password="postgres",
              dbname=os.environ["MEMORY_PGDATABASE"],
          )
          with conn.cursor() as cur:
              cur.execute(
                  "SELECT count(*), min(vector_dims(embedding)), "
                  "max(vector_dims(embedding)) FROM rag_vectors "
                  "WHERE collection = 'chroma' AND metadata->>'kb_id' = 'rag_eval_kb'"
              )
              n, dmin, dmax = cur.fetchone()
          conn.close()
          problems = []
          if not n:
              problems.append("kb=rag_eval_kb 向量数为 0（导入失败或空集合）")
          if dmin != expected_dims or dmax != expected_dims:
              problems.append(
                  f"kb=rag_eval_kb 向量维度 {dmin}..{dmax} 与绑定声明 {expected_dims} 不一致"
              )
          for p in problems:
              print(f"[assert] FAIL {p}")
          if problems:
              print("[assert] EVAL_INDEX_CHECK=failed —— 评测保持 BLOCKED")
              sys.exit(1)
          print(f"[assert] EVAL_INDEX_CHECK=passed vectors={n} dims={expected_dims}")
          PY

      - name: Run RAG smoke evaluation
        run: |
          # 原始退出码直捕（禁止管道 tail 吞码）；完整日志落 artifacts。
          set -o pipefail
          MULTIQUERY_ARGS=()
          if [[ "$EVAL_MULTIQUERY" == "true" ]]; then
            MULTIQUERY_ARGS+=(--multiquery)
          fi
          python -u -m backend.evaluation.cli rag \
            --selection desktop_upload_smoke \
            --run-id "$EVAL_RUN_ID" \
            "${MULTIQUERY_ARGS[@]}" \
            --no-ragas \
            --no-resume \
            --strict-gate \
            --triggered-by github-actions-rag-smoke 2>&1 | tee /tmp/eval-run.log
          exit "$?"

      - name: Collect API cost attribution
        if: always()
        env:
          LLM_USAGE_START_ID: ${{ steps.usage-ledger-baseline.outputs.usage_start_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from decimal import Decimal

          import psycopg

          try:
              conn = psycopg.connect(
                  host="localhost", port=5432, user="postgres", password="postgres",
                  dbname=os.environ["MEMORY_PGDATABASE"],
              )
              with conn.cursor() as cur:
                  cur.execute(
                      "SELECT component, model, provider, cost_status, pricing_source, count(*), "
                      "sum(coalesce(total_tokens, 0)), sum(coalesce(billed_cost_cny, 0)) "
                      "FROM llm_usage "
                      "WHERE id > %s AND component IN ('llm', 'embedding', 'rerank') "
                      "GROUP BY component, model, provider, cost_status, pricing_source "
                      "ORDER BY component, model, provider, cost_status, pricing_source",
                      (int(os.getenv("LLM_USAGE_START_ID") or 0),),
                  )
                  rows = cur.fetchall()
                  cur.execute(
                      "SELECT count(*), "
                      "count(*) FILTER (WHERE tenant_id IS DISTINCT FROM %s "
                      "OR user_id IS DISTINCT FROM %s), "
                      "sum(coalesce(total_tokens, 0)), "
                      "sum(coalesce(billed_cost_cny, 0)) "
                      "FROM llm_usage WHERE id > %s "
                      "AND component IN ('llm', 'embedding', 'rerank')",
                      (
                          "eval", os.environ["EVAL_TRIGGERED_BY"],
                          int(os.getenv("LLM_USAGE_START_ID") or 0),
                      ),
                  )
                  usage_totals = cur.fetchone()
                  cur.execute(
                      "WITH reservation_per_call AS ("
                      "SELECT DISTINCT ON (id) id, status, reserved_cny, settled_cny "
                      "FROM budget_reservations WHERE request_id = %s "
                      "ORDER BY id, created_at) "
                      "SELECT status, count(*), sum(reserved_cny), sum(settled_cny) "
                      "FROM reservation_per_call GROUP BY status ORDER BY status",
                      (f"eval:{os.environ['EVAL_RUN_ID']}",),
                  )
                  reservation_rows = cur.fetchall()
              conn.close()
          except Exception:  # noqa: BLE001
              print("[cost] usage/quota ledger 查询失败；对账标记为 UNVERIFIED")
              rows = []
              query_failed = True
          else:
              query_failed = False
          unverified_statuses = {"", "unpriced", "price_unknown"}
          unverified_calls = sum(
              int(r[5] or 0) for r in rows
              if (r[3] or "").lower() in unverified_statuses
          )
          estimated_calls = sum(
              int(r[5] or 0) for r in rows if (r[3] or "").lower() == "estimated"
          )
          cost_verification = (
              "UNVERIFIED" if query_failed or not rows or unverified_calls
              else "ESTIMATED" if estimated_calls else "VERIFIED"
          )
          reservation_counts = {
              str(r[0]): int(r[1] or 0) for r in reservation_rows
          } if not query_failed else {}
          reservation_amounts_cny = {
              str(status): {
                  "reserved_cny": round(sum(
                      float(r[2] or 0) for r in reservation_rows if r[0] == status
                  ), 6),
                  "settled_cny": round(sum(
                      float(r[3] or 0) for r in reservation_rows if r[0] == status
                  ), 6),
              }
              for status in reservation_counts
          } if not query_failed else {}
          reservation_total = sum(reservation_counts.values())
          settled_cost = sum(
              (Decimal(str(r[3] or 0)) for r in reservation_rows if r[0] == "settled"),
              Decimal("0"),
          ) if not query_failed else Decimal("0")
          usage_calls = int(usage_totals[0] or 0) if not query_failed else 0
          unattributed_calls = int(usage_totals[1] or 0) if not query_failed else 0
          usage_tokens = int(usage_totals[2] or 0) if not query_failed else 0
          usage_cost = Decimal(str(usage_totals[3] or 0)) if not query_failed else Decimal("0")
          ledger_difference = abs(usage_cost - settled_cost)
          budget_envelope_verification = (
              "WITHIN_LIMITS"
              if not query_failed
              and usage_calls <= 200
              and usage_tokens <= 200000
              and usage_cost <= Decimal("0.50")
              else "OVER_LIMIT"
          )
          budget_ledger_verification = (
              "VERIFIED"
              if not query_failed
              and os.environ.get("LLM_BUDGET_MODE") == "enforce"
              and usage_calls > 0
              and reservation_total == usage_calls
              and reservation_counts.get("reserved", 0) == 0
              and reservation_counts.get("needs_review", 0) == 0
              and unattributed_calls == 0
              and ledger_difference <= Decimal("0.000001")
              else "UNVERIFIED"
          )
          summary = []
          for r in rows:
              cost_status = (r[3] or "").lower()
              summary.append({
                  "component": r[0],
                  "model": r[1],
                  "provider": r[2],
                  "cost_status": cost_status or "unknown",
                  "pricing_source": r[4] or "unknown",
                  "calls": int(r[5] or 0),
                  "total_tokens": int(r[6] or 0),
                  "billed_cost_cny": (
                      None if cost_status in unverified_statuses
                      else round(float(r[7] or 0), 6)
                  ),
              })
          Path("data/eval_runs").mkdir(parents=True, exist_ok=True)
          Path("data/eval_runs/llm_usage_summary.json").write_text(
              json.dumps({
                  "note": "隔离测试库账本，未同步生产计费",
                  "eval_run_id": os.environ.get("EVAL_RUN_ID", ""),
                  "budget_request_id": f"eval:{os.environ.get('EVAL_RUN_ID', '')}",
                  "budget_mode": os.environ.get("LLM_BUDGET_MODE", ""),
                  "cost_verification": cost_verification,
                  "budget_ledger_verification": budget_ledger_verification,
                  "verification_error": "ledger_query_failed" if query_failed else None,
                  "unverified_calls": unverified_calls,
                  "usage_calls": usage_calls,
                  "usage_tokens": usage_tokens,
                  "unattributed_calls": unattributed_calls,
                  "budget_envelope_verification": budget_envelope_verification,
                  "budget_reservations": reservation_counts,
                  "reservation_amounts_cny": reservation_amounts_cny,
                  "usage_cost_cny": round(float(usage_cost), 6),
                  "settled_cost_cny": round(float(settled_cost), 6),
                  "ledger_difference_cny": round(float(ledger_difference), 6),
                  "usage": summary,
              },
                         ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps({"cost_verification": cost_verification,
                            "budget_ledger_verification": budget_ledger_verification,
                            "usage_calls": usage_calls,
                            "usage_tokens": usage_tokens,
                            "unattributed_calls": unattributed_calls,
                            "budget_envelope_verification": budget_envelope_verification,
                            "budget_reservations": reservation_counts,
                            "reservation_amounts_cny": reservation_amounts_cny,
                            "usage_cost_cny": round(float(usage_cost), 6),
                            "settled_cost_cny": round(float(settled_cost), 6),
                            "ledger_difference_cny": round(float(ledger_difference), 6),
                            "unverified_calls": unverified_calls, "usage": summary},
                           ensure_ascii=False, indent=2))
          PY

      - name: Require reconciled cost ledger
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("data/eval_runs/llm_usage_summary.json").read_text())
          if summary.get("cost_verification") not in {"VERIFIED", "ESTIMATED"}:
              raise SystemExit("费用未定价或无法验证，禁止通过真实评测")
          if summary.get("budget_ledger_verification") != "VERIFIED":
              raise SystemExit("身份或预占/结算账本未完成对账，禁止通过真实评测")
          if summary.get("budget_envelope_verification") != "WITHIN_LIMITS":
              raise SystemExit("整次评测费用预算超限或无法核实，禁止通过")
          PY

      - name: Upload RAG smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-smoke-${{ github.run_id }}
          path: |
            data/eval_runs/
            /tmp/eval-run.log
          if-no-files-found: warn
          retention-days: 14

  rag-smoke-gate:
    name: RAG Smoke (8 cases)
    needs: [detect-changes, rag-smoke-pr-static, rag-smoke]
    # 该 Job 必须在依赖失败或被跳过后运行；下面的步骤会严格校验结果，不会无条件放行。
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate change detection and evaluation result
        shell: bash
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          RAG_RELEVANT: ${{ needs.detect-changes.outputs.relevant }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_LIVE_EVAL: ${{ inputs.run_live_eval }}
          PR_PREFLIGHT_RESULT: ${{ needs.rag-smoke-pr-static.result }}
          SMOKE_RESULT: ${{ needs.rag-smoke.result }}
        run: |
          set -euo pipefail

          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "::error::RAG change detection did not succeed (result: $DETECT_RESULT)."
            exit 1
          fi

          if [[ "$RAG_RELEVANT" == "false" ]]; then
            if [[ "$PR_PREFLIGHT_RESULT" != "skipped" || "$SMOKE_RESULT" != "skipped" ]]; then
              echo "::error::Non-RAG changes expected both smoke jobs to be skipped (preflight: $PR_PREFLIGHT_RESULT, evaluation: $SMOKE_RESULT)."
              exit 1
            fi
            echo "NOT_APPLICABLE: no RAG-related changes; the required gate is satisfied without running the RAG evaluation."
            exit 0
          fi

          if [[ "$RAG_RELEVANT" != "true" ]]; then
            echo "::error::RAG relevance output is missing or invalid (value: $RAG_RELEVANT)."
            exit 1
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_PREFLIGHT_RESULT" != "success" || "$SMOKE_RESULT" != "skipped" ]]; then
              echo "::error::RAG pull requests require successful free preflight and must not run real API evaluation (preflight: $PR_PREFLIGHT_RESULT, evaluation: $SMOKE_RESULT)."
              exit 1
            fi
            echo "SUCCESS: RAG pull request passed free preflight; real API evaluation is limited to trusted events."
            exit 0
          fi

          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$PR_PREFLIGHT_RESULT" != "skipped" || "$SMOKE_RESULT" != "skipped" ]]; then
              echo "::error::Main pushes must defer paid evaluation (preflight: $PR_PREFLIGHT_RESULT, evaluation: $SMOKE_RESULT)."
              exit 1
            fi
            echo "DEFERRED: offline PR checks passed; real evaluation requires an explicit trusted workflow_dispatch with run_live_eval=true."
            exit 0
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$RUN_LIVE_EVAL" != "true" ]]; then
              if [[ "$PR_PREFLIGHT_RESULT" != "success" || "$SMOKE_RESULT" != "skipped" ]]; then
                echo "::error::Offline dispatch requires successful free preflight and must skip real API evaluation (preflight: $PR_PREFLIGHT_RESULT, evaluation: $SMOKE_RESULT)."
                exit 1
              fi
              echo "SUCCESS: offline dispatch passed free preflight; real API evaluation remains opt-in."
              exit 0
            fi

            if [[ "$PR_PREFLIGHT_RESULT" != "skipped" || "$SMOKE_RESULT" != "success" ]]; then
              echo "::error::Explicit Live dispatch requires a successful real 8-case evaluation (preflight: $PR_PREFLIGHT_RESULT, evaluation: $SMOKE_RESULT)."
              exit 1
            fi
            echo "SUCCESS: explicit trusted Live dispatch passed the real 8-case evaluation."
            exit 0
          fi

          echo "::error::Unsupported event for the RAG Smoke required gate: $EVENT_NAME"
          exit 1
