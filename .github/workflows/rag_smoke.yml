name: RAG PR Smoke

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rag-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect RAG changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # 手动触发没有 PR diff，按显式手动运行处理。
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            echo "::error::Pull request base or head SHA is missing; cannot determine changed paths."
            exit 1
          fi

          changed_paths="$RUNNER_TEMP/rag-smoke-changed-paths.txt"
          if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_paths"; then
            echo "::error::Unable to determine changed paths for the RAG smoke gate."
            exit 1
          fi

          relevant=false
          while IFS= read -r path; do
            case "$path" in
              backend/rag/*|backend/evaluation/*|backend/infra/llm/*|backend/config/*|\
              backend/orchestration/graph/*|backend/core/tool_runtime/policy.py|\
              backend/services/rag_server.py|backend/prompts/*|\
              backend/sql/migrations/*|data/docs/*|pyproject.toml|requirements-lock.txt|\
              .github/workflows/rag_smoke.yml|.github/workflows/rag_regression.yml)
                relevant=true
                break
                ;;
            esac
          done < "$changed_paths"

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "RAG-related changes: $relevant"

  rag-smoke:
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    name: RAG Smoke Evaluation (8 cases)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # PR 门禁使用可复现的离线检索模式，不调用生成模型或 LLM Judge。
      ENV_MODE: local
      EVAL_GATE: legacy
      EVAL_SEMANTIC_SCORER: lexical
      EVAL_TRIGGER: github_pr
      EVAL_TRIGGERED_BY: github-actions-rag-smoke
      EMBEDDING_MODEL_PATH: BAAI/bge-small-zh-v1.5
      RERANKER_MODEL_PATH: BAAI/bge-reranker-base
      RERANKER_DEVICE: cpu
      VECTOR_PG_DIM: "512"
      LANGFUSE_ENABLED: "false"
      OBS_ANALYTICS_ENABLED: "false"
      PYTHONUTF8: "1"
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      MEMORY_PGDATABASE: agent_memory
      BUSINESS_PGDATABASE: agent_business
      VECTOR_PGDATABASE: agent_memory
      RAG_STORES_PGDATABASE: agent_memory

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-rag-smoke-bge-small-reranker-base-v1
          restore-keys: hf-rag-smoke-

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Prepare offline retrieval models
        run: |
          python - <<'PY'
          from sentence_transformers import CrossEncoder, SentenceTransformer

          SentenceTransformer("BAAI/bge-small-zh-v1.5")
          CrossEncoder("BAAI/bge-reranker-base", device="cpu")
          print("RAG smoke models ready")
          PY

      - name: Initialize isolated evaluation databases
        run: python scripts/init_db.py --host localhost --port 5432 --user postgres

      - name: Import baseline evaluation fixtures
        run: python -m backend.evaluation.import_fixture baseline

      - name: Run RAG smoke evaluation
        run: >-
          python -m backend.evaluation.cli rag
          --selection pr_smoke
          --no-ragas
          --no-resume
          --triggered-by github-actions-rag-smoke

      - name: Upload RAG smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-smoke-${{ github.run_id }}
          path: data/eval_runs/
          if-no-files-found: warn
          retention-days: 14

  rag-smoke-gate:
    name: RAG Smoke (8 cases)
    needs: [detect-changes, rag-smoke]
    # 该 Job 必须在依赖失败或被跳过后运行；下面的步骤会严格校验结果，不会无条件放行。
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate change detection and evaluation result
        shell: bash
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          RAG_RELEVANT: ${{ needs.detect-changes.outputs.relevant }}
          SMOKE_RESULT: ${{ needs.rag-smoke.result }}
        run: |
          set -euo pipefail

          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "::error::RAG change detection did not succeed (result: $DETECT_RESULT)."
            exit 1
          fi

          if [[ "$RAG_RELEVANT" == "false" ]]; then
            if [[ "$SMOKE_RESULT" != "skipped" ]]; then
              echo "::error::Non-RAG changes expected the evaluation job to be skipped (result: $SMOKE_RESULT)."
              exit 1
            fi
            echo "NOT_APPLICABLE: no RAG-related changes; the required gate is satisfied without running the RAG evaluation."
            exit 0
          fi

          if [[ "$RAG_RELEVANT" != "true" ]]; then
            echo "::error::RAG relevance output is missing or invalid (value: $RAG_RELEVANT)."
            exit 1
          fi

          if [[ "$SMOKE_RESULT" != "success" ]]; then
            echo "::error::RAG-related changes require a successful 8-case evaluation (result: $SMOKE_RESULT)."
            exit 1
          fi

          echo "SUCCESS: RAG-related changes passed the real 8-case evaluation."
