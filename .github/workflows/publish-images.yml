name: Publish production images

on:
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "apisix/**"
      - "backend/**"
      - "constraints/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".github/scripts/**"
      - "docs/customer-service/demo-kb/**"
      - "docs/customer-service/kb/**"
      - "frontend/**"
      - "frontend-admin/**"
      - "frontend-cs/**"
      - "mcp_servers/**"
      - "pyproject.toml"
      - "requirements-lock.txt"
      - "scripts/**"
      - "部署/prod-4c8g/**"
      - ".github/workflows/publish-images.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-production-images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and publish ${{ matrix.target.name }} image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: backend
            context: .
            file: ./Dockerfile
            scope: backend
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            scope: frontend
          - name: admin
            context: ./frontend-admin
            file: ./frontend-admin/Dockerfile
            scope: frontend-admin
          - name: cs
            context: ./frontend-cs
            file: ./frontend-cs/Dockerfile
            scope: frontend-cs
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          image_base="ghcr.io/${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA:0:7}"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "image_base=$image_base"
            echo "short_sha=$short_sha"
            echo "build_time=$build_time"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare target build configuration
        id: target_config
        shell: bash
        run: |
          target="${{ matrix.target.name }}"
          {
            echo "build_args<<EOF"
            if [[ "$target" == "backend" ]]; then
              echo "GIT_COMMIT=${{ steps.meta.outputs.short_sha }}"
              echo "BUILD_TIME=${{ steps.meta.outputs.build_time }}"
              echo "GIT_DIRTY=false"
            elif [[ "$target" == "frontend" ]]; then
              echo "API_URL=http://apisix:9080"
              echo "NEXT_PUBLIC_ADMIN_URL=${{ vars.PRODUCTION_ADMIN_URL || 'https://admin.anyanyan.me' }}"
              echo "NEXT_PUBLIC_CS_URL=${{ vars.PRODUCTION_CS_URL || 'https://cs.anyanyan.me' }}"
            elif [[ "$target" == "admin" ]]; then
              echo "API_URL=http://apisix:9080"
            elif [[ "$target" == "cs" ]]; then
              echo "API_URL=http://apisix:9080"
              echo "NEXT_PUBLIC_WS_ORIGIN=${{ vars.PRODUCTION_CS_WS_ORIGIN }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.target.context }}
          file: ${{ matrix.target.file }}
          push: true
          tags: ${{ steps.meta.outputs.image_base }}:${{ matrix.target.name }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_time }}
            ${{ matrix.target.name == 'backend' && 'com.agent-platform.git-dirty=false' || '' }}
          build-args: ${{ steps.target_config.outputs.build_args }}
          cache-from: type=gha,scope=${{ matrix.target.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.scope }}
          provenance: false

      - name: Save image digest
        shell: bash
        run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.target.name }}.txt"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.target.name }}
          path: digests/${{ matrix.target.name }}.txt
          retention-days: 1

  manifest:
    name: Generate and upload release manifest
    needs: [build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all digest artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Prepare manifest metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          image_base="ghcr.io/${GITHUB_REPOSITORY,,}"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "image_base=$image_base"
            echo "build_time=$build_time"
          } >> "$GITHUB_OUTPUT"

      - name: Write image digest manifest
        env:
          IMAGE_BASE: ${{ steps.meta.outputs.image_base }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          image_base = os.environ["IMAGE_BASE"]
          digests = {}
          for name in ["backend", "frontend", "admin", "cs"]:
              file_path = Path(f"digests/{name}.txt")
              if not file_path.exists():
                  raise SystemExit(f"Missing digest file for {name}")
              val = file_path.read_text(encoding="utf-8").strip()
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", val):
                  raise SystemExit(f"Invalid digest for {name}: {val}")
              digests[name] = val

          manifest = {
              "commit": os.environ["GITHUB_SHA"],
              "created": os.environ["BUILD_TIME"],
              "images": {
                  name: f"{image_base}@{digest}"
                  for name, digest in digests.items()
              },
          }
          Path("production-image-digests.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: production-image-digests
          path: production-image-digests.json
          if-no-files-found: error
          retention-days: 90
