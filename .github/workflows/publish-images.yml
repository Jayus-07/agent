name: Publish production images

on:
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "apisix/**"
      - "backend/**"
      - "constraints/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".github/scripts/**"
      - "docs/customer-service/demo-kb/**"
      - "docs/customer-service/kb/**"
      - "frontend/**"
      - "frontend-admin/**"
      - "frontend-cs/**"
      - "mcp_servers/**"
      - "pyproject.toml"
      - "requirements-lock.txt"
      - "scripts/**"
      - "部署/prod-4c8g/**"
      - ".github/workflows/publish-images.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-production-images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          image_base="ghcr.io/${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA:0:7}"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "image_base=$image_base"
            echo "short_sha=$short_sha"
            echo "build_time=$build_time"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish backend image
        id: backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image_base }}:backend-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_time }}
            com.agent-platform.git-dirty=false
          build-args: |
            GIT_COMMIT=${{ steps.meta.outputs.short_sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            GIT_DIRTY=false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: false

      - name: Build and publish web image
        id: frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image_base }}:frontend-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_time }}
          build-args: |
            API_URL=http://apisix:9080
            NEXT_PUBLIC_ADMIN_URL=${{ vars.PRODUCTION_ADMIN_URL || 'https://admin.anyanyan.me' }}
            NEXT_PUBLIC_CS_URL=${{ vars.PRODUCTION_CS_URL || 'https://cs.anyanyan.me' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: false

      - name: Build and publish admin image
        id: admin
        uses: docker/build-push-action@v7
        with:
          context: ./frontend-admin
          file: ./frontend-admin/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image_base }}:admin-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_time }}
          build-args: |
            API_URL=http://apisix:9080
          cache-from: type=gha,scope=frontend-admin
          cache-to: type=gha,mode=max,scope=frontend-admin
          provenance: false

      - name: Build and publish customer service image
        id: cs
        uses: docker/build-push-action@v7
        with:
          context: ./frontend-cs
          file: ./frontend-cs/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image_base }}:cs-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_time }}
          build-args: |
            API_URL=http://apisix:9080
            NEXT_PUBLIC_WS_ORIGIN=${{ vars.PRODUCTION_CS_WS_ORIGIN || 'wss://cs.anyanyan.me' }}
          cache-from: type=gha,scope=frontend-cs
          cache-to: type=gha,mode=max,scope=frontend-cs
          provenance: false

      - name: Write image digest manifest
        env:
          IMAGE_BASE: ${{ steps.meta.outputs.image_base }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          ADMIN_DIGEST: ${{ steps.admin.outputs.digest }}
          CS_DIGEST: ${{ steps.cs.outputs.digest }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          image_base = os.environ["IMAGE_BASE"]
          digests = {
              "backend": os.environ["BACKEND_DIGEST"],
              "frontend": os.environ["FRONTEND_DIGEST"],
              "admin": os.environ["ADMIN_DIGEST"],
              "cs": os.environ["CS_DIGEST"],
          }
          if any(not re.fullmatch(r"sha256:[0-9a-f]{64}", value) for value in digests.values()):
              raise SystemExit("Buildx 未返回有效镜像摘要")

          manifest = {
              "commit": os.environ["GITHUB_SHA"],
              "created": os.environ["BUILD_TIME"],
              "images": {
                  name: f"{image_base}@{digest}"
                  for name, digest in digests.items()
              },
          }
          Path("production-image-digests.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload release manifest
        uses: actions/upload-artifact@v7
        with:
          name: production-image-digests
          path: production-image-digests.json
          if-no-files-found: error
          retention-days: 90
