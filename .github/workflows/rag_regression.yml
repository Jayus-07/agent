name: RAG Regression

on:
  schedule:
    # GitHub 使用 UTC；北京时间每天 02:00 执行，避开白天 PR 高峰。
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      selection:
        description: "要运行的 RAG 评测集"
        required: true
        type: choice
        default: regression
        options:
          - regression
          - ci_golden
          - expanded_100
          - scale_20k

permissions:
  contents: read

concurrency:
  group: rag-regression-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  rag-regression:
    name: RAG Regression (${{ inputs.selection || 'regression' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ENV_MODE: local
      EVAL_GATE: legacy
      EVAL_SEMANTIC_SCORER: lexical
      EVAL_TRIGGER: scheduled
      EVAL_TRIGGERED_BY: github-actions-rag-regression
      EMBEDDING_MODEL_PATH: BAAI/bge-small-zh-v1.5
      RERANKER_MODEL_PATH: BAAI/bge-reranker-base
      RERANKER_DEVICE: cpu
      VECTOR_PG_DIM: "512"
      LANGFUSE_ENABLED: "false"
      OBS_ANALYTICS_ENABLED: "false"
      PYTHONUTF8: "1"
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      MEMORY_PGDATABASE: agent_memory
      BUSINESS_PGDATABASE: agent_business
      VECTOR_PGDATABASE: agent_memory
      RAG_STORES_PGDATABASE: agent_memory

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-rag-regression-bge-small-reranker-base-v1
          restore-keys: hf-rag-regression-

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Prepare offline retrieval models
        run: |
          python - <<'PY'
          from sentence_transformers import CrossEncoder, SentenceTransformer

          SentenceTransformer("BAAI/bge-small-zh-v1.5")
          CrossEncoder("BAAI/bge-reranker-base", device="cpu")
          print("RAG regression models ready")
          PY

      - name: Evaluation preflight
        env:
          EVAL_SELECTION: ${{ inputs.selection || 'regression' }}
        run: python -m backend.evaluation.preflight --module rag --selection "$EVAL_SELECTION"

      - name: Initialize isolated evaluation databases
        run: python scripts/init_db.py --host localhost --port 5432 --user postgres

      - name: Import selected evaluation fixtures
        env:
          EVAL_SELECTION: ${{ inputs.selection || 'regression' }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          selection = os.environ["EVAL_SELECTION"]
          suite = json.loads(
              (Path("backend/evaluation/datasets/rag/suites") / f"{selection}.json")
              .read_text(encoding="utf-8")
          )
          subprocess.run(
              [sys.executable, "-m", "backend.evaluation.import_fixture", suite["fixture_set"]],
              check=True,
          )
          PY

      - name: Run selected RAG regression
        env:
          EVAL_SELECTION: ${{ inputs.selection || 'regression' }}
        run: >-
          python -m backend.evaluation.cli rag
          --selection ${{ inputs.selection || 'regression' }}
          --no-ragas
          --no-resume
          --triggered-by github-actions-rag-regression

      - name: Upload RAG regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-regression-${{ github.run_id }}
          path: data/eval_runs/
          if-no-files-found: warn
          retention-days: 30
