name: Build CI base image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.ci"
      - "requirements-lock.txt"
      - ".github/workflows/build-ci-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-ci-base-image
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push CI base image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.ci
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/ci-base:latest
            ghcr.io/${{ github.repository }}/ci-base:${{ github.sha }}
          cache-from: type=gha,scope=ci-base
          cache-to: type=gha,mode=max,scope=ci-base
          provenance: false
