name: Evaluation V2 Contract

on:
  pull_request:
    branches: [main, master]
    paths:
      - "backend/app/api/router.py"
      - "backend/app/api/routes/evaluation_imports.py"
      - "backend/app/api/routes/evaluation_v2.py"
      - "backend/evaluation/**"
      - "backend/evaluation_v2/**"
      - "backend/services/task_service.py"
      - "backend/rag/vectorstore/pgvector_store.py"
      - "backend/tasks/error_taxonomy.py"
      - "backend/sql/migrations/108_evaluation_v2_domain.sql"
      - "backend/sql/migrations/109_evaluation_v2_gate_approvals.sql"
      - "backend/sql/migrations/110_evaluation_v2_human_reviews.sql"
      - "backend/sql/migrations/111_evaluation_v2_case_revision_candidates.sql"
      - "backend/sql/migrations/112_evaluation_v2_domain_runner.sql"
      - "backend/tests/evaluation/test_dataset_enterprise_extensions.py"
      - "backend/tests/evaluation/test_sql_eval.py"
      - "backend/tests/evaluation/test_cs_runner_v2.py"
      - "backend/tests/evaluation/test_travel_golden_v1.py"
      - "backend/tests/rag/test_pgvector_store.py"
      - "backend/tests/test_task_phase2_step2_error_taxonomy.py"
      - "backend/tests/evaluation_v2/**"
      - "scripts/init_db.py"
      - "requirements-lock.txt"
      - "frontend-admin/.dockerignore"
      - "frontend-admin/Dockerfile"
      - "frontend-admin/package.json"
      - "frontend-admin/package-lock.json"
      - "frontend-admin/src/api/evaluation*.ts"
      - "frontend-admin/src/app/evaluations/**"
      - "frontend-admin/src/components/workbench/evaluation/**"
      - "frontend-admin/src/lib/workbenchRoutes.ts"
      - ".github/workflows/evaluation-v2.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/api/router.py"
      - "backend/app/api/routes/evaluation_imports.py"
      - "backend/app/api/routes/evaluation_v2.py"
      - "backend/evaluation/**"
      - "backend/evaluation_v2/**"
      - "backend/services/task_service.py"
      - "backend/rag/vectorstore/pgvector_store.py"
      - "backend/tasks/error_taxonomy.py"
      - "backend/sql/migrations/108_evaluation_v2_domain.sql"
      - "backend/sql/migrations/109_evaluation_v2_gate_approvals.sql"
      - "backend/sql/migrations/110_evaluation_v2_human_reviews.sql"
      - "backend/sql/migrations/111_evaluation_v2_case_revision_candidates.sql"
      - "backend/sql/migrations/112_evaluation_v2_domain_runner.sql"
      - "backend/tests/evaluation/test_dataset_enterprise_extensions.py"
      - "backend/tests/evaluation/test_sql_eval.py"
      - "backend/tests/evaluation/test_cs_runner_v2.py"
      - "backend/tests/evaluation/test_travel_golden_v1.py"
      - "backend/tests/rag/test_pgvector_store.py"
      - "backend/tests/test_task_phase2_step2_error_taxonomy.py"
      - "backend/tests/evaluation_v2/**"
      - "scripts/init_db.py"
      - "requirements-lock.txt"
      - "frontend-admin/.dockerignore"
      - "frontend-admin/Dockerfile"
      - "frontend-admin/package.json"
      - "frontend-admin/package-lock.json"
      - "frontend-admin/src/api/evaluation*.ts"
      - "frontend-admin/src/app/evaluations/**"
      - "frontend-admin/src/components/workbench/evaluation/**"
      - "frontend-admin/src/lib/workbenchRoutes.ts"
      - ".github/workflows/evaluation-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluation-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluation-v2-contract:
    name: Evaluation V2 free contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Compile evaluation V2 code
        run: >-
          python -m compileall -q
          backend/evaluation_v2
          backend/app/api/routes/evaluation_v2.py
          backend/evaluation/corpus_snapshots.py
          backend/rag/vectorstore/pgvector_store.py
          backend/tasks/error_taxonomy.py
          backend/services/task_service.py

      - name: Run free E0 asset preflight
        run: python -m backend.evaluation.preflight --module rag --selection desktop_upload_smoke

      - name: Run deterministic evaluation V2 contracts
        run: >-
          python -m pytest
          backend/tests/evaluation_v2
          backend/tests/evaluation/test_dataset_enterprise_extensions.py::test_synthesis_uses_visible_chunks_directly_and_keeps_request_budget
          backend/tests/evaluation/test_sql_eval.py
          backend/tests/evaluation/test_cs_runner_v2.py
          backend/tests/evaluation/test_travel_golden_v1.py
          backend/tests/rag/test_pgvector_store.py::TestScalarToText
          backend/tests/rag/test_pgvector_store.py::TestWhereToSql
          backend/tests/test_task_phase2_step2_error_taxonomy.py::TestClassify
          backend/tests/test_task_phase2_step2_error_taxonomy.py::TestRetryPolicy
          -q --no-cov

  evaluation-v2-admin:
    name: Evaluation V2 admin build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json

      - name: Install locked admin dependencies
        working-directory: frontend-admin
        run: npm ci --include=optional

      - name: Run evaluation center UI tests
        working-directory: frontend-admin
        run: npm run test -- src/components/workbench/evaluation

      - name: Check admin TypeScript
        working-directory: frontend-admin
        run: ./node_modules/.bin/tsc --noEmit

      - name: Build admin production bundle
        working-directory: frontend-admin
        run: npm run build
