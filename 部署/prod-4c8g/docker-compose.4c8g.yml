# 生产专用层：根 Compose + docker-compose.local.yml 共享资源层 + 本文件。
# --env-file .env.production 负责插值，env_file 负责容器运行配置，二者均须指定。
x-production: &production
  env_file: !override ["${RUNTIME_ENV_FILE:-.env.production}"]
services:
  app:
    <<: *production
  agent-worker:
    <<: *production
  rag-index-worker:
    <<: *production
  rag-service:
    <<: *production
  mcp-service:
    <<: *production
  maintenance-worker:
    <<: *production
  report-worker:
    <<: *production
  beat:
    <<: *production
  cs-dispatcher:
    <<: *production
  db-migrate:
    <<: *production
  business-mock:
    profiles: ["development-tools"]
