# ============================================================================
# 生产覆盖层：4 vCPU / 8 GB RAM / 40 GB SSD
# 2026-10-20 后端容器合一：原 app / agent-worker / rag-index-worker /
# maintenance-worker / report-worker / beat / cs-dispatcher 合并为单 backend
# 容器（supervisord 托管，内含 rag-service / mcp-service 进程）。
# 用法（仓库根目录）：
#   docker compose --env-file .env.production \
#     -f docker-compose.yml -f 部署/prod-4c8g/docker-compose.4c8g.yml up -d <services>
# 只启动 README §3 列出的服务；kafka/ollama/observability 不启动。
# ============================================================================

x-logging: &prod-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    # 1.2G：shared_buffers 384MB + 连接/排序开销；PG 是唯一状态权威，优先保
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/prod.conf
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./部署/prod-4c8g/postgresql.conf:/etc/postgresql/prod.conf:ro
    deploy:
      resources:
        limits:
          memory: 1200m
          cpus: "1.5"
    logging: *prod-logging

  redis:
    command:
      - redis-server
      - --maxmemory
      - 320mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - "${REDIS_PASSWORD:-}"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "0.5"
    logging: *prod-logging

  redis-broker:
    command:
      - redis-server
      - --maxmemory
      - 320mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - "${REDIS_PASSWORD:-}"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "0.3"
    logging: *prod-logging

  auth-redis:
    command:
      - redis-server
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - "${AUTH_REDIS_PASSWORD:-${REDIS_PASSWORD:-}}"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.2"
    logging: *prod-logging

  apisix:
    deploy:
      resources:
        limits:
          memory: 224m
          cpus: "0.5"
    logging: *prod-logging

  backend:
    # 单容器 = 原 app 1100m + agent-worker 768m + rag-index-worker 800m +
    # maintenance 256m + report 256m + beat 128m + dispatcher 224m ≈ 3.5G，
    # 另含此前生产不启动的 rag-service / mcp-service 进程的空闲开销
    # （uvicorn 常驻、模型懒加载，空闲约 300-500m）；限额取 3.8G。
    # 上限而非预占：单 cgroup 内各进程互相借用余量，超限由 cgroup OOM 兜底。
    deploy:
      resources:
        limits:
          memory: 3800m
          cpus: "3.0"
    logging: *prod-logging

  pg-backup:
    deploy:
      resources:
        limits:
          memory: 96m
          cpus: "0.2"
    logging: *prod-logging
