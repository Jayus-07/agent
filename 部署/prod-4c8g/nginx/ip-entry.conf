# IP 直访入口模板：安装到 /etc/nginx/sites-available/ip-entry。
# 背景：域名 anyanyan.me 的国内链路存在 SNI 拦截（海外正常），国内统一改用
# https://<服务器公网IP> 直访（443 主站 / 3443 客服端+坐席端 / 3444 管理端）。
# 证书：Let's Encrypt IP 证书（acme.sh shortlived profile，有效期约 6 天），
#   安装路径 /etc/nginx/ssl/ip-cert/{fullchain,privkey}.pem，由 acme.sh
#   续期 reloadcmd 与运维共同维护；修改服务器上的此文件前先备份。
# 依赖：$connection_upgrade map 定义在 agent-platform.conf，两文件需同时安装。
# 防火墙：UFW 与云安全组需放行 TCP 80、443、3443、3444。
# default_server（2026-11-21 事故）：浏览器按 RFC 6066 对 IP 直访不发 SNI，
#   无 SNI 请求由该端口第一个 server 块兜底。sites-enabled 按字母序加载，
#   agent-platform 排在 ip-entry 之前——certbot --nginx 一旦给它补上 443 块，
#   隐式默认就被抢走，IP 直访拿到域名证书（SAN 无 IP）→ 浏览器证书告警，
#   文档能打开但 fetch/XHR 全部失败（移动端表现为"Network request failed"）。
#   因此三个 SSL listen 必须显式声明 default_server；80 端口保持不带
#   （系统 default 站点已是 80 default_server，重复声明会导致 nginx -t 失败，
#   ACME http-01 靠 Host 头匹配本块，不受影响）。

server {
    listen 80;
    server_name <SERVER_PUBLIC_IP>;

    # ACME http-01 验证（IP 证书续期用；验证服务器从海外访问，可达）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://<SERVER_PUBLIC_IP>$request_uri;
    }
}

# 主站：企业助手 / 旅游 / RAG 等业务
server {
    listen 443 ssl default_server;
    server_name <SERVER_PUBLIC_IP>;
    ssl_certificate /etc/nginx/ssl/ip-cert/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ip-cert/privkey.pem;
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }
}

# 客服端 + 坐席端（前端 3300；坐席 WS /ws/ 转发到 APISIX 9080）
server {
    listen 3443 ssl default_server;
    server_name <SERVER_PUBLIC_IP>;
    ssl_certificate /etc/nginx/ssl/ip-cert/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ip-cert/privkey.pem;
    client_max_body_size 64m;

    location ^~ /ws/ {
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }
}

# 管理端
server {
    listen 3444 ssl default_server;
    server_name <SERVER_PUBLIC_IP>;
    ssl_certificate /etc/nginx/ssl/ip-cert/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ip-cert/privkey.pem;
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }
}
