# PostgreSQL 16 —— 1.2GB 容器 / 8GB 宿主（4C8G 生产档）
# 装载方式：docker-compose.prod.yml 以 -c config_file=/etc/postgresql/prod.conf 启动
listen_addresses = '*'
max_connections = 120              # 8 个应用进程 × 6 套池 × 2 = 96，留 24 余量
shared_buffers = 384MB             # 容器内存的 1/3
effective_cache_size = 1024MB
work_mem = 8MB                     # 排序/哈希，按单连接；120 连接不要调大
maintenance_work_mem = 96MB
wal_buffers = 16MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1             # SSD
effective_io_concurrency = 100
default_statistics_target = 100
log_min_duration_statement = 1000  # 慢性查询留痕（>1s）
log_checkpoints = off
log_connections = off
log_disconnections = off
autovacuum_max_workers = 2
