# PostgreSQL 参数参考；实际启动参数以 docker-compose.local.yml 的 command 为准。
listen_addresses = '*'
max_connections = 120              # 8 个应用进程 × 6 套池 × 2 = 96，留 24 余量
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB                     # 每个排序/哈希节点；连接数不能乘以过高工作内存
maintenance_work_mem = 64MB
wal_buffers = 16MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1             # SSD
effective_io_concurrency = 100
default_statistics_target = 100
log_min_duration_statement = 1000  # 慢性查询留痕（>1s）
log_checkpoints = off
log_connections = off
log_disconnections = off
autovacuum_max_workers = 2
