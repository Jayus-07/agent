# ============================================================================
# 本机覆盖层：让开发机按 4C8G 生产档运行（本机 Docker 只有 8 GiB / 12 CPU）
# 2026-10-20 后端容器合一：原 app / rag-service / mcp-service / 四个 Celery
# 池 / beat / 双 cs-dispatcher 合并为单 backend 容器（supervisord 托管），
# 本层只保留基础设施与 backend 的资源限额；开发鉴权（ALLOW_UNAUTHENTICATED）
# 仍由 .env 控制。
# 用法（仓库根目录）：
#   docker compose -f docker-compose.yml -f 部署/prod-4c8g/docker-compose.local.yml up -d <services>
# PostgreSQL 的 max_connections/shared_buffers 用 ALTER SYSTEM 落库，不在此挂载。
# ============================================================================

x-logging: &prod-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    deploy: { resources: { limits: { memory: 1100m, cpus: "1.5" } } }
    logging: *prod-logging

  redis:
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - "${REDIS_PASSWORD:-}"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    deploy: { resources: { limits: { memory: 448m, cpus: "0.5" } } }
    logging: *prod-logging

  redis-broker:
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - "${REDIS_PASSWORD:-}"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    deploy: { resources: { limits: { memory: 320m, cpus: "0.3" } } }
    logging: *prod-logging

  auth-redis:
    command:
      - redis-server
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - "${AUTH_REDIS_PASSWORD:-${REDIS_PASSWORD:-}}"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    deploy: { resources: { limits: { memory: 128m, cpus: "0.2" } } }
    logging: *prod-logging

  apisix:
    deploy: { resources: { limits: { memory: 320m, cpus: "0.5" } } }
    logging: *prod-logging

  backend:
    # 单容器 = 原 app 1000m + agent-worker 768m + rag-index-worker 768m +
    # rag-service 512m + mcp 256m + maintenance 224m + report 224m +
    # beat 128m + 双 dispatcher 384m ≈ 4.4G；限额取 4.8G（上限而非预占，
    # 单 cgroup 内各进程可互相借用余量）
    deploy: { resources: { limits: { memory: 4800m, cpus: "4.0" } } }
    logging: *prod-logging

  pg-backup:
    deploy: { resources: { limits: { memory: 96m, cpus: "0.2" } } }
    logging: *prod-logging
